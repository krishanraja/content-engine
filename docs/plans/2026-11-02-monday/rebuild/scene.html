<!doctype html>
<meta charset="utf-8">
<!-- Monday 2 Nov rebuild: the proof's scene (proof/scene.html, approved 1 Nov 2026: "Good, build all four this way")
     generalised to whole cuts. ?cut=long|short&layer=bg|fg. render(t) draws one frame; the timeline (tl_<cut>.js) is
     written by plan.py from his word clock, so every picture lands on the word it belongs to. -->
<style>
@font-face{font-family:Anton;src:url('../../../../assets/fonts/makeyourmindup/Anton-Regular.ttf')}
@font-face{font-family:Archivo;src:url('../../../../assets/fonts/makeyourmindup/Archivo-Variable.ttf')}
@font-face{font-family:Plex;src:url('../../../../assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf')}
html,body{margin:0;overflow:hidden;background:transparent}
.L{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.anton{font-family:Anton;line-height:.92;text-transform:uppercase}
.mono{font-family:Plex;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.hl{display:inline-block;position:relative;z-index:0}
.hl::before{content:'';position:absolute;left:-6px;right:-6px;top:6%;bottom:2%;background:var(--hl,#FFD84D);z-index:-1;transform-origin:left;transform:scaleX(var(--k,1))}
#grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.badge{position:absolute;width:58px;height:82px;border-radius:7px;background:#f3eee2 url('../../../../assets/plates/two-passports/paper.jpg') center/220px;box-shadow:0 8px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(12,21,18,.2);overflow:hidden}
.badge::before{content:'';position:absolute;inset:0;background:url('../../../../assets/plates/two-passports/guilloche.svg') center/110px;opacity:.3}
.badge::after{content:'';position:absolute;left:20px;top:6px;width:18px;height:5px;border-radius:3px;background:#0C1512;opacity:.65}
.badge i{position:absolute;left:0;right:0;bottom:14px;height:12px;background:rgba(12,21,18,.13)}
.badge.j i{background:#FFD84D;filter:brightness(var(--pulse,1))}
.paper{background:#f3eee2 url('../../../../assets/plates/two-passports/paper.jpg') center/300px}
#cap{position:absolute;left:0;right:0;text-align:center}
#cap span{display:inline-block;font-family:Archivo;font-weight:900;color:#F4EFE4;background:#0C1512;box-shadow:9px 9px 0 #FFD84D}
.cell{position:absolute;border-right:2px solid rgba(12,21,18,.12);border-bottom:2px solid rgba(12,21,18,.12)}
</style>
<div class="L" id="root"><div id="cam"></div><div id="grain"></div><div id="corners"></div><div id="cap"></div></div>
<script>
const Q=new URLSearchParams(location.search), LAYER=Q.get('layer')||'fg', CUT=Q.get('cut')||'long', V=CUT==='short';
const FW=V?1080:1920, FH=V?1920:1080;
document.documentElement.style.width=document.body.style.width=FW+'px';document.documentElement.style.height=document.body.style.height=FH+'px';
document.getElementById('root').style.cssText=`position:absolute;left:0;top:0;width:${FW}px;height:${FH}px`;
</script>
<script src="tl_long.js"></script>
<script src="tl_short.js"></script>
<script>
const T=V?TL_SHORT:TL_LONG;           // {off, words, segs, end, dur}
const OFF=T.off, SRC='../imagery/src/', WM='../../../../.cache/makeyourmindup/wordmark.png';
const INK='#0C1512',CREAM='#F4EFE4',BUT='#FFD84D',MINT='#7EF0C0',GREY='#5b625e';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const W=(t,a,d)=>eo((t-a)/d), B=(t,a,d)=>back((t-a)/d);
const fmt=n=>Math.round(n).toLocaleString('en-GB');
let html=[];const put=s=>html.push(s);

// ---------------- captions: house style, phrase by phrase, each word on its own clock ----------------
const BREAKS=/[.?!,]$/;
const PHR=[];{let cur=[];for(const w of T.words){if(w[1]<T.capFrom-0.01)continue;cur.push(w);if((BREAKS.test(w[0])&&cur.length>=2)||cur.length>=(V?5:6)||/[.?!]$/.test(w[0])){PHR.push(cur);cur=[]}}if(cur.length)PHR.push(cur)}
function caps(t,lowBand){const el=document.getElementById('cap');if(LAYER!=='fg'||t<3.0||t>=T.closeAt-0.05){el.innerHTML='';return}
  const tt=t-OFF;let p=null;for(let i=0;i<PHR.length;i++){const s=PHR[i][0][1]-0.05,e=Math.min((PHR[i+1]?PHR[i+1][0][1]:s+4),PHR[i][PHR[i].length-1][2]+1.2)-0.05;if(tt>=s&&tt<e){p=PHR[i];break}}
  if(!p){el.innerHTML='';return}const shown=p.filter(w=>tt>=w[1]-0.03).map(w=>w[0]);if(!shown.length){el.innerHTML='';return}
  if(V){el.style.cssText=`position:absolute;left:70px;right:150px;top:${lowBand?1450:1280}px;text-align:center`;
    el.innerHTML=`<span style="font-size:56px;line-height:1.18;padding:8px 18px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone;display:inline">${shown.join(' ')}</span>`}
  else{el.style.cssText='position:absolute;left:0;right:0;bottom:64px;text-align:center';el.innerHTML=`<span style="font-size:50px;padding:8px 20px 10px;white-space:nowrap">${shown.join(' ')}</span>`}}

// ---------------- the camera never rests ----------------
function camera(t){let x=Math.sin(t*.37)*7,y=Math.cos(t*.29)*5,s=1.012+Math.sin(t*.21)*.008;
  for(const a of T.shakes){const k=clamp(1-(t-a[0])/0.45);if(t>=a[0]&&k>0){x+=a[1]*k*Math.sin((t-a[0])*70);y+=a[1]*.65*k*Math.sin((t-a[0])*61)}}
  return `translate(${x}px,${y}px) scale(${s})`}

// a scene is drawn in a 1200 x 800 box, placed by its mode: beside his column, full frame, or (phone) a full-frame plate
function boxFor(mode){if(!V)return mode==='side'?{x:680,y:96,s:1}:{x:(1920-1200*1.32)/2,y:(1080-800*1.32)/2-30,s:1.32};
  return mode==='band'?{x:70,y:1105,s:0.7167}:{x:(1080-1200*0.9)/2,y:470,s:0.9}}
function wrap(box,inner,extra=''){return `<div class="abs" style="left:${box.x}px;top:${box.y}px;width:1200px;height:800px;transform:scale(${box.s});transform-origin:0 0;${extra}">${inner}</div>`}
const credit=(txt,c,x=0,y=772,o=1)=>txt?`<div class="abs mono" style="left:${x}px;top:${y}px;font-size:21px;color:${c};opacity:${o};white-space:nowrap;background:${c===INK?'rgba(255,216,77,.0)':'rgba(12,21,18,0)'}">${txt}</div>`:'';

// ---------------- scenes ----------------
const S={};
// a real page flies in as paper; the highlighted line lifts off it, larger, and keeps drifting
S.paper=(u,g,th)=>{const p=g.p,fly=B(u,0.0,0.75),pu=W(u,0,g.d);let s='';
  const pw=p.pw||620,ph=pw*p.h/p.w,px=20+(1-fly)*900,py=30+(1-fly)*120;
  s+=`<div class="abs" style="left:${px}px;top:${py+Math.sin(u*.8)*5}px;width:${pw}px;height:${Math.min(ph,720)}px;overflow:hidden;transform:rotate(${-5+3*fly+Math.sin(u*.5)*.6}deg) scale(${.97+pu*.06});box-shadow:0 30px 60px rgba(0,0,0,.42);background:#fff"><img src="${SRC+p.img}" style="width:${pw}px;display:block;transform:translateY(${-Math.max(0,(ph-720))*W(u,0.3,g.d*.6)}px)"></div>`;
  const [x0,y0,x1,y1]=p.strip,sw=x1-x0,sh=y1-y0,k=Math.min(2.4,(p.sk||1130)/sw),lift=B(u,g.lift??0.85,0.6);
  if(u>(g.lift??0.85)){const tx=(px+x0*pw/p.w)*(1-lift)+(1200-sw*k-10)*lift,ty=(py+y0*pw/p.w)*(1-lift)+(p.sy||520)*lift,sc=(pw/p.w)/k*(1-lift)+lift;
    s+=`<div class="abs" style="left:${tx}px;top:${ty+Math.sin(u*1.1)*6}px;width:${sw*k}px;height:${sh*k}px;transform:scale(${sc}) rotate(${(1-lift)*-3+1.2*Math.sin(u*.6)}deg);transform-origin:0 0;background:#fff url('${SRC+p.img}') ${-x0*k}px ${-y0*k}px/${p.w*k}px ${p.h*k}px;box-shadow:0 ${10+24*lift}px ${20+40*lift}px rgba(0,0,0,.45);outline:4px solid ${INK}"></div>`;
    s+=`<div class="abs" style="left:${1200-sw*k-10}px;top:${(p.sy||520)+sh*k+16+Math.sin(u*1.1)*6}px;height:12px;width:${sw*k*W(u,p.sweep??((g.lift??0.85)+0.5),0.9)}px;background:${th.acc}"></div>`;}
  s+=credit(p.credit,th.fg,pw*0.55+40,772,W(u,0.5,.4));return s};
// the ladder: rails, rungs, 2030, the gap, the taller ladder, labels, the line, the cards
S.ladder=(u,g,th)=>{const p=g.p,X=p.x??470,Wd=p.w??280,top=60,bot=740,c=th.fg;let sv=`<svg width="1200" height="800" style="position:absolute;left:0;top:0;overflow:visible"><g stroke="${c}" stroke-width="15" stroke-linecap="round" fill="none">`;
  const rail=p.drawn?1:W(u,0.05,0.6),grow=p.taller!=null?W(u,p.taller,0.8):0,t0=top-50*grow;
  sv+=`<line x1="${X}" y1="${bot}" x2="${X}" y2="${bot-(bot-t0)*rail}"/><line x1="${X+Wd}" y1="${bot}" x2="${X+Wd}" y2="${bot-(bot-t0)*rail}"/>`;
  const ys=[150,300,450,600];ys.forEach((y,i)=>{const q=p.drawn?1:W(u,0.2+(3-i)*0.12,.3);if(q>.02)sv+=`<line x1="${X}" y1="${y}" x2="${X+Wd*q}" y2="${y}"/>`});
  if(grow>.02)sv+=`<line x1="${X}" y1="${40}" x2="${X+Wd*grow}" y2="40" stroke="${th.acc}"/>`;
  // the bottom rung: solid, gone, or lifting away
  const by=730;let bo=1,bdx=0,bdy=0,brot=0;
  if(p.gap)bo=0;if(p.lift!=null&&u>p.lift){const f=u-p.lift;bdy=-f*f*500-f*120;bdx=f*260;brot=-f*40;bo=clamp(1-f*.9)}
  if(p.gap||p.lift!=null)sv+=`<line x1="${X}" y1="${by}" x2="${X+Wd}" y2="${by}" stroke-dasharray="12 20" opacity="${.4*(p.gap?1:W(u,(p.lift||0)+.5,.5))}"/>`;
  if(bo>0.01)sv+=`<g transform="translate(${X+Wd/2+bdx},${by+bdy}) rotate(${brot})" opacity="${bo}"><line x1="${-Wd/2}" y1="0" x2="${Wd/2}" y2="0" stroke="${p.bright!=null?(u>p.bright?th.acc:c):c}" stroke-width="${p.bright!=null&&u>p.bright?20+3*Math.sin(u*4):15}"/></g>`;
  sv+='</g>';
  if(p.lit!=null){const lit=W(u,p.lit,.35);sv+=`<rect x="${X-12}" y="${top+62-112*grow}" width="${Wd+24}" height="60" rx="8" fill="${INK}" opacity="${lit}" transform="translate(0,${-2*Math.sin(u*2)})"/><text x="${X+Wd/2}" y="${top+110-112*grow}" font-family="Anton" font-size="54" fill="${MINT}" text-anchor="middle" opacity="${lit}">2030</text>`}
  if(p.line!=null){const q=W(u,p.line,1.2);sv+=`<line x1="${X+Wd+60}" y1="${150}" x2="${X+Wd+60}" y2="${150+(by-150)*q}" stroke="${MINT}" stroke-width="10" stroke-dasharray="4 16" stroke-linecap="round"/>`;
    if(q>.95)sv+=`<circle cx="${X+Wd+60}" cy="${by}" r="${16+5*Math.sin(u*5)}" fill="none" stroke="${MINT}" stroke-width="6"/>`}
  sv+='</svg>';let s=sv;
  if(p.labels!=null){const q=W(u,p.labels,.4);s+=`<div class="abs" style="left:${X+Wd+40}px;top:${by-28}px;font-size:44px;font-family:Archivo;font-weight:800;letter-spacing:0;text-transform:none;color:${c};opacity:${q};transform:translateX(${(1-q)*40}px)">Teller, clerk</div>`}
  if(p.judge!=null){const q=B(u,p.judge,.55);s+=`<div class="abs anton" style="left:${X+Wd/2}px;top:${150-78+Math.sin(u*1.4)*4}px;font-size:72px;color:${INK};background:${MINT};padding:6px 18px;transform:translateX(-50%) scale(${q});box-shadow:8px 8px 0 ${INK}">Judgement</div>`}
  if(p.qcards){p.qcards.forEach((a,i)=>{if(u<a)return;const q=B(u,a,.6),dx=i===0?-170:170;
    s+=`<div class="abs" style="left:${X+Wd/2+dx-150}px;top:${by-150+(1-q)*-500+Math.sin(u*1.3+i)*5}px;width:300px;height:190px;background:${MINT};border:5px solid ${INK};border-radius:18px;box-shadow:10px 10px 0 ${INK};transform:rotate(${(i?4:-4)*(1-q*.6)+Math.sin(u*.8+i)*1.2}deg)">
      <div class="anton" style="position:absolute;left:24px;top:18px;font-size:120px;color:${INK}">?</div><div class="anton" style="position:absolute;right:26px;bottom:14px;font-size:70px;color:${INK}">${i+1}</div></div>`});
}
  if(p.cover!=null){const fly=B(u,p.cover,0.7),pu=W(u,p.cover,6);s+=`<div class="abs" style="left:${(X+Wd+110)+(1-fly)*900}px;top:${40+(1-fly)*-80}px;width:520px;transform:rotate(${-5+4*fly}deg) scale(${.96+pu*.08});box-shadow:0 30px 60px rgba(12,21,18,.45)"><img src="${SRC}report-cover.jpg" style="width:520px;display:block"></div>`;
    s+=credit('ANTHROPIC · 16 OCT 2026',c,X+Wd+118,772,W(u,p.cover+0.4,.4))}
  const zp=p.lift!=null?.22*W(u,p.lift+.3,3):0;return `<div class="abs" style="inset:0;transform:translate(${Math.sin(u*.4)*8}px,${Math.cos(u*.33)*6}px) scale(${1+W(u,0,g.d)*(p.taller!=null?.03:.12)+zp});transform-origin:${(X+Wd/2)/12}% 88%">${s}</div>`};
// the hire badges: 100 in a tray, the juniors butter; on the fall 18 lift off and drop
S.badges=(u,g,th)=>{const p=g.p,js=[];for(let k=0;k<27;k++)js.push(Math.floor(k*100/27+1)%100);const keep=new Set(js.filter((_,i)=>i%3===0).slice(0,9));
  let s='';const fill=W(u,0.2,2.0);
  for(let i=0;i<100;i++){const r=Math.floor(i/10),c=i%10,isj=js.includes(i);const appear=clamp((fill*100-i)/6);if(appear<=0)continue;
    let x=c*66+((i*37)%7)-3,y=r*92+((i*53)%5)-2,rot=((i*29)%9)-4,op=appear,sc=.6+.4*back(appear);
    if(isj&&!keep.has(i)){const f=(u-(p.fall+(i%9)*0.045));if(f>0){x+=f*((i%2)?60:-60);y+=f*f*1800-f*260;rot+=f*((i%2)?260:-260);sc*=1+f*.4;op*=clamp(1-f*1.6)}}
    s+=`<div class="badge ${isj?'j':''}" style="left:${x}px;top:${y}px;opacity:${op};transform:rotate(${rot}deg) scale(${sc})"><i></i></div>`}
  const push=1+W(u,0.2,g.d)*0.12;let out=`<div class="abs" style="left:${V?250:-20}px;top:${V?40:20}px;width:700px;height:960px;transform:perspective(1600px) rotateX(${32-8*W(u,0.2,8)}deg) rotateZ(-5deg) scale(${push*(V?.8:.82)});transform-origin:50% 40%">${s}</div>`;
  let v=0;if(u>=p.count&&u<p.fall)v=Math.round(27*W(u,p.count,1.4));else if(u>=p.fall)v=Math.round(27-18*W(u,p.fall,1.2));
  const pop=(u>=p.land?1+.12*(1-W(u,p.land,.25)):1)*(1+.035*Math.sin(u*2.4)),NX=V?40:720,NY=V?-330:120;
  if(u>=p.count)out+=`<div class="abs anton" style="left:${NX}px;top:${NY+60}px;font-size:300px;color:${CREAM};transform:scale(${pop});transform-origin:left">${v}%</div><div class="abs" style="left:${NX+10}px;top:${NY+370}px;height:20px;width:${460*W(u,p.land,.4)}px;background:${BUT}"></div>`;
  if(u>=p.fall)out+=`<div class="abs anton" style="left:${NX+(V?640:10)}px;top:${NY+(V?150:410)}px;font-size:84px;color:${GREY};text-decoration:line-through;opacity:${W(u,p.fall,.3)}">27%</div>`;
  out+=credit('ANTHROPIC · OCT 2026','#a9b4ae',V?40:720,V?-372:700,W(u,.6,.4));return out};
// six to one: two bars, the agents' growing the whole time, the report's own line beside them
S.bars=(u,g,th)=>{const p=g.p,base=640,un=80,staff=un*W(u,0.3,.5),k=1+1.2*W(u,0.7,2.2)+3.8*W(u,p.six,1.0),agents=un*k*W(u,0.5,.5);let s='';
  s+=`<div class="abs" style="left:200px;top:${base-staff}px;width:180px;height:${staff}px;background:${INK}"></div><div class="abs" style="left:430px;top:${base-agents}px;width:180px;height:${agents}px;background:${INK};box-shadow:12px 12px 0 ${MINT}"></div>`;
  s+=`<div class="abs" style="left:200px;top:${base+14}px;font-size:38px;font-family:Archivo;font-weight:800;letter-spacing:0;text-transform:none;color:${INK}">Staff</div><div class="abs" style="left:430px;top:${base+14}px;font-size:38px;font-family:Archivo;font-weight:800;letter-spacing:0;text-transform:none;color:${INK}">AI agents</div>`;
  s+=`<div class="abs anton" style="left:430px;top:${base-agents-90}px;font-size:70px;color:${INK}">×${k.toFixed(1)}</div>`;
  const fly=B(u,0.2,.7);s+=`<div class="abs" style="left:${690+(1-fly)*700}px;top:40px;width:500px;transform:rotate(${3-2*fly}deg) scale(${1+W(u,0.7,4)*.05});box-shadow:0 26px 50px rgba(12,21,18,.4)"><img src="${SRC}report-6-1.jpg" style="width:500px;display:block"></div>`;
  if(u>=p.six+1.0){const r=B(u,p.six+1.0,.4);s+=`<div class="abs anton" style="left:700px;top:420px;font-size:150px;white-space:nowrap;color:${INK};transform:scale(${r});transform-origin:left">6 to 1</div>`}
  s+=credit('ANTHROPIC · AUG 2026',INK,692,360,W(u,.5,.4));return s};
// two lines from 2023: senior keeps rising, junior turns down. No numbers, only the direction the study reports
S.lines=(u,g,th)=>{const p=g.p,c=th.fg,X0=80,X1=900,Y0=640;const q=W(u,0.3,p.part?Math.max(1,p.part):2.4),q2=W(u,p.part??1.5,1.6);let sv=`<svg width="1200" height="800" style="position:absolute;left:0;top:0;overflow:visible">`;
  sv+=`<line x1="${X0}" y1="${Y0}" x2="${X1+60}" y2="${Y0}" stroke="${c}" stroke-width="4" opacity=".5"/><line x1="${X0}" y1="${Y0}" x2="${X0}" y2="120" stroke="${c}" stroke-width="4" opacity=".5"/>`;
  const pts=(f)=>{let d='';for(let i=0;i<=40;i++){const x=i/40;if(x>q*.45+q2*.55)break;d+=(d?'L':'M')+(X0+x*(X1-X0))+' '+f(x)}return d};
  const sen=x=>430-80*x-(x>.45?420*(x-.45):0)+Math.sin(x*9)*6,jun=x=>450-80*x+(x>.45?300*(x-.45):0)+Math.sin(x*11)*5;
  sv+=`<path d="${pts(sen)}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
  sv+=`<path d="${pts(jun)}" fill="none" stroke="${th.acc}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>`;
  sv+=`<line x1="${X0+.45*(X1-X0)}" y1="${Y0}" x2="${X0+.45*(X1-X0)}" y2="140" stroke="${c}" stroke-width="3" stroke-dasharray="6 10" opacity="${.5*W(u,0.8,.5)}"/></svg>`;
  let s=sv;const end=x=>X0+x*(X1-X0)+20,ex=Math.min(1,q*.45+q2*.55);
  s+=`<div class="abs" style="left:${end(ex)}px;top:${sen(ex)-26}px;font-size:40px;font-family:Archivo;font-weight:800;letter-spacing:0;text-transform:none;color:${c};opacity:${q2}">Senior jobs</div><div class="abs" style="left:${end(ex)}px;top:${jun(ex)-26}px;font-size:40px;font-family:Archivo;font-weight:800;letter-spacing:0;text-transform:none;color:${c};opacity:${q2}"><span style="background:${th.acc};color:${INK};padding:2px 8px">Junior jobs</span></div>`;
  s+=`<div class="abs mono" style="left:${X0}px;top:${Y0+16}px;font-size:24px;color:${c}">2015</div><div class="abs mono" style="left:${X0+.45*(X1-X0)-30}px;top:${Y0+16}px;font-size:24px;color:${c};opacity:${W(u,0.8,.5)}">2023</div>`;
  s+=credit('HOSSEINI & LICHTINGER · 2025',c,X0,740,W(u,.6,.4));
  return `<div class="abs" style="inset:0;transform:scale(${1+W(u,0,g.d)*.06}) translate(${Math.sin(u*.5)*6}px,0);transform-origin:30% 50%">${s}</div>`};
// a city branch with 20 teller windows, in depth; 7 shutter; then the branch copies down the street, +43%
S.branch=(u,g,th)=>{const p=g.p;let s='';const copy=p.copy!=null?W(u,p.copy,1.4):0,cam=1-0.42*copy;
  const facade=(k,shut,o)=>{let w='';for(let i=0;i<20;i++){const r=Math.floor(i/5),c=i%5,isShut=i>=13&&shut>0,lit=k===0&&p.shut!=null?W(u,0.3+i*((p.shut-0.6)/20),.25):1;const sh=isShut?clamp((shut*7-(i-13))/1.0):0;

          <img src="${WM}" style="position:absolute;left:38px;top:44px;width:430px"><div class="anton" style="position:absolute;left:38px;top:118px;font-size:96px;color:${BUT}">Mondays</div>
