<!doctype html>
<meta charset="utf-8">
<!-- Monday 2 November, "The Ladder" (motion-system.md): every picture beat of the signed direction as a moving scene.
     panels.py loads this page at the panel's size (1314x1080 beside his face, 1080x1000 above it), calls
     setup(scene, params, events) once and draw(t) for every frame. events are the beat's own word times, in seconds
     from the beat's start, read from his take, so each move lands on the word that names it.
     Krish, 2026-10-31: "I want way more animation than ever before and movement." Nothing here holds still: the desk
     drifts, layers part in parallax, objects arrive with a small overshoot and keep floating. -->
<style>
@font-face{font-family:Anton;src:url('../../../../assets/fonts/makeyourmindup/Anton-Regular.ttf')}
@font-face{font-family:Archivo;src:url('../../../../assets/fonts/makeyourmindup/Archivo-Variable.ttf')}
@font-face{font-family:Plex;src:url('../../../../assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf')}
html,body{margin:0;overflow:hidden;background:#0C1512}
#root{position:absolute;inset:0;background:#0C1512;overflow:hidden;font-family:Archivo;color:#F4EFE4}
#grain{position:absolute;inset:-20px;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='4'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");pointer-events:none;z-index:50}
#glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(244,239,228,.06),rgba(0,0,0,0) 62%)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
svg{position:absolute;inset:0;overflow:visible}
.mono{font-family:Plex;letter-spacing:2px}
.credit{position:absolute;left:6%;bottom:4%;font:500 22px Plex;color:#a9b4ae;letter-spacing:1.5px;z-index:40;background:#0C1512;padding:6px 12px;border-radius:4px}.credit:empty{display:none}
.label{position:absolute;font:500 30px Plex;letter-spacing:3px;color:#F4EFE4;white-space:nowrap}
.big{position:absolute;font-family:Anton;line-height:.95;color:#F4EFE4;white-space:nowrap}
.doc{position:absolute;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.doc img{display:block;width:100%}
.card{position:absolute;background:#7EF0C0;color:#0C1512;border-radius:16px;box-shadow:0 24px 50px rgba(0,0,0,.55);padding:34px 40px;font:900 46px/1.08 Archivo}
.card small{display:block;font:500 22px Plex;letter-spacing:2px;margin-bottom:14px;opacity:.8}
</style>
<div id="root"><div id="glow"></div><div id="cam"><svg id="svg"></svg><div id="html"></div></div><div id="grain"></div><div class="credit" id="credit"></div></div>
<script>
const ROOT=document.getElementById('root'), CAM=document.getElementById('cam'), SVG=document.getElementById('svg'), HTML=document.getElementById('html');
let W=1314,H=1080,S='',P={},E={},TALL=false;
const C={ink:'#0C1512',cream:'#F4EFE4',muted:'#5b625e',soft:'#a9b4ae',butter:'#FFD84D',mint:'#7EF0C0'};
// brand-tokens motion: enter 0.05,0.7,0.1,1 over 400 ms. Approximated by a back-out curve with a small overshoot.
const cl=(x)=>Math.min(1,Math.max(0,x));
const outCubic=(x)=>1-Math.pow(1-cl(x),3);
const back=(x)=>{x=cl(x);const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const at=(t,a,d=0.4)=>outCubic((t-a)/d);          // 0..1 from a over d seconds
const pop=(t,a,d=0.45)=>back((t-a)/d);             // 0..1 with a small overshoot
const ev=(k,dflt=0)=>(E[k]!==undefined?E[k]:dflt);
const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function setup(scene,params,events,w,h){S=scene;P=params||{};E=events||{};W=w;H=h;TALL=h<w?false:true;TALL=(w===1080&&h===1000);
  ROOT.style.width=W+'px';ROOT.style.height=H+'px';SVG.setAttribute('width',W);SVG.setAttribute('height',H);SVG.setAttribute('viewBox',`0 0 ${W} ${H}`);
  document.getElementById('credit').textContent=P.credit||'';}
// The desk never rests: a slow drift and breathing scale under every scene.
function camera(t,extra={}){const dx=Math.sin(t*0.42)*W*0.006+(extra.dx||0), dy=Math.cos(t*0.33)*H*0.005+(extra.dy||0);
  const s=1+0.012*Math.sin(t*0.25)+t*0.004+(extra.s||0);CAM.style.transform=`translate(${dx}px,${dy}px) scale(${s})`;}

// ---------- the ladder ----------
// geometry in panel units; rails x at 36% and 60% of width (beside his face) or centred (above it)
function ladderGeo(){const cx=P.cx!==undefined?P.cx*W:W*0.42, wd=Math.min(W*0.26,H*0.34), top=H*0.22, bot=H*0.88;
  const rungs=[0.17,0.33,0.49,0.65].map(f=>top+(bot-top)*f), junior=top+(bot-top)*0.86; return {L:cx-wd/2,R:cx+wd/2,top,bot,rungs,junior,cx,wd}}
function ladder(t,o){ // o: build (s), juniorStrength 0..1, juniorGone 0..1, label2030 0..1, extraTop 0..1, lineDown 0..1
  const g=ladderGeo();let h='';const sw=Math.max(8,H*0.011);
  const rail=o.build===undefined?1:at(t,o.build,1.0);
  const grow=(o.extraTop||0)*H*0.08;
  const top=g.top-grow;
  h+=`<line x1="${g.L}" y1="${g.bot}" x2="${g.L}" y2="${g.bot-(g.bot-top)*rail}" stroke="${C.cream}" stroke-width="${sw}" stroke-linecap="round"/>`;
  h+=`<line x1="${g.R}" y1="${g.bot}" x2="${g.R}" y2="${g.bot-(g.bot-top)*rail}" stroke="${C.cream}" stroke-width="${sw}" stroke-linecap="round"/>`;
  const rungs=g.rungs.slice();if(o.extraTop)rungs.unshift(g.rungs[0]-grow);
  rungs.slice().reverse().forEach((y,i)=>{const p=o.build===undefined?1:at(t,o.build+0.25+i*0.13,0.35);
    const yy=(o.extraTop&&i===rungs.length-1)?g.rungs[0]-grow*(o.extraTop):y;
    h+=`<line x1="${g.L}" y1="${yy}" x2="${g.L+(g.R-g.L)*p}" y2="${yy}" stroke="${C.cream}" stroke-width="${sw}" stroke-linecap="round"/>`});
  // the junior rung: solid, thinning, or lifted away
  const js=o.juniorStrength===undefined?1:o.juniorStrength, gone=o.juniorGone||0;
  if(gone<1){const jp=o.build===undefined?1:at(t,o.build+0.05,0.35);
    h+=`<line x1="${g.L}" y1="${g.junior-gone*H*0.25}" x2="${g.L+(g.R-g.L)*jp}" y2="${g.junior-gone*H*0.25+gone*H*0.12}" stroke="${C.cream}" stroke-width="${sw*(0.15+0.85*js)}" stroke-linecap="round" opacity="${(0.35+0.65*js)*(1-gone)}"/>`;}
  if(gone>0.3){h+=`<line x1="${g.L+sw}" y1="${g.junior}" x2="${g.R-sw}" y2="${g.junior}" stroke="${C.cream}" stroke-width="2" stroke-dasharray="8 16" opacity="${0.45*at(t,0,0.1)}"/>`;}
  if(o.label2030){const a=o.label2030;h+=`<text x="${g.cx}" y="${(o.extraTop?g.rungs[0]-grow:g.rungs[0])-H*0.03}" text-anchor="middle" font-family="Anton" font-size="${H*0.06}" fill="${C.mint}" opacity="${a}" transform="translate(0 ${(1-a)*20})">2030</text>`;}
  if(o.lineDown){const y0=g.rungs[0]+6, y1=y0+(g.junior-y0)*o.lineDown;h+=`<line x1="${g.cx}" y1="${y0}" x2="${g.cx}" y2="${y1}" stroke="${C.mint}" stroke-width="${sw*0.6}" stroke-dasharray="${sw*1.6} ${sw*1.2}" stroke-linecap="round"/>`;
    if(o.lineDown>0.98)h+=`<circle cx="${g.cx}" cy="${g.junior}" r="${sw*1.4*(1+0.15*Math.sin(t*6))}" fill="none" stroke="${C.mint}" stroke-width="${sw*0.5}"/>`;}
  return {svg:h,g};
}

// ---------- scenes ----------
const SCENES={
 // a label beat on his face: the report's cover tilts in, the words type on
 label(t){camera(t);const n=Math.round(cl((t-0.3)/1.2)*P.text.length);const a=pop(t,0.0,0.7);
   HTML.innerHTML=(P.img?`<div class="doc" style="width:${W*0.40}px;left:${W*0.30}px;top:${H*0.10}px;transform:translateY(${(1-a)*H*0.5}px) rotate(${-6+4*a+Math.sin(t*0.8)*0.8}deg)"><img src="${P.img}"></div>`:'')+
   `<div class="label" style="left:${W*0.08}px;top:${P.img?H*0.80:H*0.44}px;font-size:${TALL?40:34}px;color:${C.cream}">${esc(P.text.slice(0,n))}<span style="opacity:${(t*2|0)%2}">▍</span></div>`+
   (P.words?P.words.map((w,i)=>{const b=pop(t,ev('w'+i,0.4+i*0.5),0.45);return `<div class="big" style="left:${W*(0.1+0.45*i)}px;top:${H*0.30}px;font-size:${H*0.15}px;opacity:${b};transform:translateY(${(1-b)*60}px) rotate(${(i?3:-3)*(1-b)}deg)">${esc(w)}</div>`}).join(''):'');
   SVG.innerHTML='';},
 // a real page: it lifts onto the desk, the camera travels to the proving line and keeps pushing; a ring of light breathes on the line
 doc(t){const a=pop(t,0,0.6);const travel=at(t,0.2,Math.max(1.5,(P.dur||3)*0.8));
   // the page arrives, then the camera closes in on the proving line (the highlight sits at the crop's middle)
   const wDoc=(TALL?W*1.30:W*1.15)*(1+0.18*travel);camera(t);
   HTML.innerHTML=`<div class="doc" style="width:${wDoc}px;left:50%;top:${50+(1-a)*60}%;transform:translate(-50%,-50%) rotate(${(1-a)*-5+Math.sin(t*0.6)*0.4}deg)"><img src="${P.img}"></div>`+
     (P.text?`<div class="label" style="left:${W*0.06}px;bottom:${H*0.12}px;background:${C.ink};padding:12px 18px;border-radius:6px;font-size:${H*0.034}px;opacity:${at(t,ev('label',0.8),0.4)};transform:translateX(${(1-at(t,ev('label',0.8),0.4))*-40}px)">${esc(P.text)}</div>`:'');
   SVG.innerHTML='';},
 // the ladder appears; 2030 lands on its word; the junior rung is drawn last and faint
 build(t){camera(t);const L=ladder(t,{build:0,juniorStrength:0.45,label2030:at(t,ev('y2030',1.2),0.4)});SVG.innerHTML=L.svg;HTML.innerHTML='';},
 // early 2025: four hires land on the bottom rung, one butter; the count climbs to 27
 four(t){camera(t);const L=ladder(t,{build:P.rebuild?0:undefined});const g=L.g;let h=L.svg;const r=H*0.03;
   for(let i=0;i<4;i++){const a=pop(t,ev('four',1.6)+i*0.16,0.4);h+=`<circle cx="${g.L+g.wd*(0.17+i*0.22)}" cy="${g.junior-r-6-(1-a)*40}" r="${r*a}" fill="${i?C.cream:C.butter}"/>`}
   SVG.innerHTML=h;const v=Math.round(27*at(t,ev('four',1.6),1.4));const lx=g.R+W*0.07;
   HTML.innerHTML=`<div class="label" style="left:${lx}px;top:${H*0.26}px;opacity:${at(t,ev('early',0.6))}">EARLY 2025</div><div class="big" style="left:${lx}px;top:${H*0.56}px;font-size:${H*0.2}px;opacity:${at(t,ev('four',1.6),0.3)}">${v}%</div>`;},
 // the big moment: 27 counts down to 9 and the junior rung thins to a hairline; three hires leave
 drop(t){const d0=ev('drop',0.6),d1=ev('land',d0+1.3);const k=at(t,d0,Math.max(0.6,d1-d0));camera(t,{s:0.06*at(t,d0,1.2)});
   const L=ladder(t,{juniorStrength:1-0.9*k});const g=L.g;let h=L.svg;const r=H*0.03;
   for(let i=0;i<4;i++){const gone=i?at(t,ev('fewer',0.1)+i*0.15,0.5):0;h+=`<circle cx="${g.L+g.wd*(0.17+i*0.22)}" cy="${g.junior-r-6+gone*40}" r="${r}" fill="${i?C.cream:C.butter}" opacity="${1-gone}"/>`}
   SVG.innerHTML=h;const v=Math.round(27-18*k);const lx=g.R+W*0.07;
   HTML.innerHTML=`<div class="big" style="left:${lx}px;top:${H*0.42}px;font-size:${H*0.09}px;color:${C.muted};text-decoration:line-through;opacity:${at(t,d1-0.1,0.3)}">27%</div>`+
   `<div class="big" style="left:${lx}px;top:${H*0.53}px;font-size:${H*0.22}px">${v}%</div><div style="position:absolute;left:${lx}px;top:${H*0.53+H*0.215}px;height:${H*0.012}px;width:${H*0.24*at(t,d1,0.4)}px;background:${C.butter}"></div>`;},
 // agent hours grow to six times staff hours
 bars(t){camera(t);const unit=H*0.085, base=H*0.84, bw=W*0.12, x0=W*(TALL?0.28:0.34);const a=at(t,ev('august',0.5),0.6);
   const staff=unit*at(t,ev('staff',0.9),0.6), agents=unit*6*at(t,ev('hours',2.0),1.3);
   SVG.innerHTML=`<rect x="${x0}" y="${base-staff}" width="${bw}" height="${staff}" fill="${C.cream}" opacity="${a}"/><rect x="${x0+bw*1.5}" y="${base-agents}" width="${bw}" height="${agents}" fill="${C.mint}" opacity="${a}"/>`+
     `<text x="${x0+bw/2}" y="${base+H*0.045}" text-anchor="middle" font-family="Plex" font-size="${H*0.024}" fill="${C.soft}" opacity="${a}">STAFF</text><text x="${x0+bw*2}" y="${base+H*0.045}" text-anchor="middle" font-family="Plex" font-size="${H*0.024}" fill="${C.soft}" opacity="${a}">AI AGENTS</text>`;
   const r=pop(t,ev('hours',2.0)+1.0,0.45);
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px;opacity:${a}">${esc(P.label||'AUGUST · HOURS WORKED')}</div><div class="big" style="left:${x0+bw*2.8}px;top:${H*0.22}px;font-size:${H*0.13}px;opacity:${r};transform:scale(${0.8+0.2*r})">6 TO 1</div>`;},
 // two lines from 2023: seniors keep rising, juniors turn down (direction only, no numbers)
 lines(t){camera(t);const x0=W*0.1,x1=W*0.9,y0=H*0.5;const p=at(t,ev('start',0.3),Math.max(1.5,(P.dur||4)*0.7)), split=at(t,ev('split',1.6),1.0);
   const pts=(dir)=>{let s='';for(let i=0;i<=40;i++){const f=i/40;if(f>p)break;const x=x0+(x1-x0)*f;const y=y0-(f>0.35?(f-0.35)*H*0.55*dir*split:0)+Math.sin(f*18+t)*2;s+=`${i?'L':'M'}${x},${y}`}return s};
   SVG.innerHTML=`<line x1="${x0}" y1="${H*0.86}" x2="${x1}" y2="${H*0.86}" stroke="${C.muted}" stroke-width="2"/><text x="${x0+(x1-x0)*0.35}" y="${H*0.91}" font-family="Plex" font-size="${H*0.024}" fill="${C.soft}" text-anchor="middle">2023</text>`+
     `<path d="${pts(1)}" stroke="${C.cream}" stroke-width="${H*0.012}" fill="none" stroke-linecap="round"/><path d="${pts(-1)}" stroke="${C.butter}" stroke-width="${H*0.012}" fill="none" stroke-linecap="round"/>`;
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px;opacity:${at(t,0.2)}">${esc(P.text)}</div>`+
     `<div class="label" style="left:${x1-W*0.2}px;top:${y0-H*0.28}px;opacity:${split}">SENIOR</div><div class="label" style="left:${x1-W*0.2}px;top:${y0+H*0.2}px;color:${C.butter};opacity:${split}">JUNIOR</div>`;},
 // a branch of 20 teller windows; seven close (20 to 13)
 branch(t){camera(t);let h='';const cols=5,rows=4,bw=W*0.1,bh=H*0.1,x0=W*(TALL?0.2:0.1),y0=H*0.24;
   for(let i=0;i<20;i++){const c=i%cols,r=(i/cols)|0;const a=pop(t,0.1+i*0.04,0.4);const close=i>=13?at(t,ev('close',2.0)+(i-13)*0.12,0.35):0;
     const x=x0+c*bw*1.18,y=y0+r*bh*1.35;h+=`<g transform="translate(${x} ${y+(1-a)*40})" opacity="${a}"><rect width="${bw}" height="${bh}" rx="6" fill="none" stroke="${C.cream}" stroke-width="4"/><rect width="${bw}" height="${bh*close}" rx="6" fill="${C.muted}"/><circle cx="${bw/2}" cy="${bh*0.62}" r="${bh*0.16}" fill="${C.cream}" opacity="${1-close}"/></g>`}
   SVG.innerHTML=h;const v=Math.round(20-7*at(t,ev('close',2.0),0.95));
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px">TELLERS A CITY BRANCH NEEDED</div><div class="big" style="left:${W*(TALL?0.62:0.72)}px;top:${H*0.38}px;font-size:${H*0.2}px">${v}</div><div class="label" style="left:${W*(TALL?0.62:0.72)}px;top:${H*0.62}px;opacity:${at(t,ev('close',2.0)+1)}">${esc(P.text||'')}</div>`;},
 // the branch stamps out copies until there are 43% more
 copies(t){camera(t,{s:-0.04*at(t,0.2,2)});let h='';const n=P.n||10, extra=Math.round(n*0.43);const bw=W*0.13,bh=H*0.14;
   for(let i=0;i<n+extra;i++){const c=i%5,r=(i/5)|0;const a=i<n?1:pop(t,ev('more',0.8)+(i-n)*0.18,0.4);
     const x=W*0.08+c*bw*1.25,y=H*0.2+r*bh*1.35;h+=`<g transform="translate(${x} ${y-(1-a)*30}) scale(${a})" opacity="${a}"><rect width="${bw}" height="${bh}" rx="8" fill="${i<n?'none':C.butter}" stroke="${C.cream}" stroke-width="4"/><path d="M${bw*0.15} ${bh*0.4} L${bw/2} ${bh*0.12} L${bw*0.85} ${bh*0.4}" stroke="${i<n?C.cream:C.ink}" stroke-width="4" fill="none"/><rect x="${bw*0.25}" y="${bh*0.52}" width="${bw*0.5}" height="${bh*0.3}" fill="${i<n?C.cream:C.ink}"/></g>`}
   SVG.innerHTML=h;const r=pop(t,ev('pct',1.6),0.45);
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px">CITY BANK BRANCHES</div><div class="big" style="right:${W*0.06}px;bottom:${H*0.12}px;font-size:${H*0.16}px;opacity:${r};transform:scale(${0.8+0.2*r})">+43%</div>`;},
 // 400,000 clerk marks fall away, 600,000 accountant marks stack above
 ledger(t){camera(t);let h='';const unit=H*0.06,bw=W*0.06,x0=W*0.14;
   const fall=at(t,ev('gone',1.5),1.2), rise=at(t,ev('added',3.5),1.4);
   for(let i=0;i<4;i++){h+=`<rect x="${x0+i*bw*1.2}" y="${H*0.72-unit*2+fall*H*0.4}" width="${bw}" height="${unit*2}" fill="${C.muted}" opacity="${1-fall}"/>`}
   for(let i=0;i<6;i++){const a=at(t,ev('added',3.5)+i*0.12,0.4);h+=`<rect x="${W*0.55+i*bw*1.2}" y="${H*0.72-unit*3*a}" width="${bw}" height="${unit*3*a}" fill="${C.cream}"/>`}
   SVG.innerHTML=h+`<line x1="${W*0.08}" y1="${H*0.72}" x2="${W*0.92}" y2="${H*0.72}" stroke="${C.muted}" stroke-width="2"/>`;
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px">SINCE 1980</div>`+
     `<div class="big" style="left:${x0}px;top:${H*0.76}px;font-size:${H*0.09}px;opacity:${at(t,ev('gone',1.5))}">−400,000</div><div class="label" style="left:${x0}px;top:${H*0.88}px;font-size:${H*0.022}px;opacity:${at(t,ev('gone',1.5))}">BOOKKEEPING CLERKS</div>`+
     `<div class="big" style="left:${W*0.55}px;top:${H*0.76}px;font-size:${H*0.09}px;opacity:${rise}">+600,000</div><div class="label" style="left:${W*0.55}px;top:${H*0.88}px;font-size:${H*0.022}px;opacity:${rise}">ACCOUNTANTS</div>`;},
 // both past scenes fold back into the ladder, taller than before
 taller(t){camera(t);const L=ladder(t,{extraTop:at(t,ev('bigger',2.5),1.2)});SVG.innerHTML=L.svg;HTML.innerHTML='';},
 // back then: the bottom rung solid, with the two starting jobs on it
 firststep(t){camera(t);const L=ladder(t,{extraTop:1});const g=L.g;SVG.innerHTML=L.svg+`<rect x="${g.L-12}" y="${g.junior-16}" width="${g.wd+24}" height="32" rx="16" fill="${C.butter}" opacity="${0.25+0.2*Math.sin(t*3)}"/>`;
   HTML.innerHTML=`<div class="label" style="left:${g.R+W*0.05}px;top:${g.junior-H*0.09}px;opacity:${at(t,ev('tellers',1.5))}">TELLER</div><div class="label" style="left:${g.R+W*0.05}px;top:${g.junior-H*0.03}px;opacity:${at(t,ev('accountant',3.0))}">CLERK</div>`;},
 // this time: the bottom rung lifts away and the camera rests on the gap
 gap(t){camera(t,{s:0.08*at(t,ev('first',0.4),2.0),dy:-H*0.05*at(t,ev('first',0.4),2.0)});const k=at(t,ev('first',0.4),1.0);
   const L=ladder(t,{extraTop:P.taller?1:0,juniorGone:k,label2030:P.y2030?1:0});SVG.innerHTML=L.svg;HTML.innerHTML='';},
 // judgement sits high, with nothing below it to climb from
 judgement(t){camera(t);const L=ladder(t,{extraTop:1,juniorGone:1});const g=L.g;const a=pop(t,ev('judgement',1.2),0.5);
   SVG.innerHTML=L.svg;HTML.innerHTML=`<div class="big" style="left:${g.R+W*0.04}px;top:${g.rungs[0]-H*0.13}px;font-size:${H*0.08}px;opacity:${a};transform:translateY(${(1-a)*30}px)">JUDGEMENT</div>`;},
 // 75% for Anthropic's staff, 28% for other Americans
 stat(t){camera(t);const a=pop(t,ev('n75',0.6),0.5),b=pop(t,ev('n75',0.6)+0.9,0.5);const v=Math.round(75*at(t,ev('n75',0.6),0.9));
   HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px">AI DOING THEIR WORK BY 2030</div>`+
   `<div class="big" style="left:${W*0.08}px;top:${H*0.26}px;font-size:${H*0.3}px;opacity:${a}">${v}%</div><div class="label" style="left:${W*0.09}px;top:${H*0.6}px;opacity:${a}">ANTHROPIC STAFF</div>`+
   `<div class="big" style="left:${W*(TALL?0.55:0.6)}px;top:${H*0.42}px;font-size:${H*0.15}px;color:${C.soft};opacity:${b}">28%</div><div class="label" style="left:${W*(TALL?0.55:0.6)}px;top:${H*0.6}px;color:${C.soft};opacity:${b}">OTHER AMERICANS</div>`;SVG.innerHTML='';},
 // 2030 lit mint at the top; a line runs down to the gap
 line2030(t){camera(t);const L=ladder(t,{extraTop:1,juniorGone:1,label2030:at(t,0.1),lineDown:at(t,ev('juniors',2.5),1.4)});SVG.innerHTML=L.svg;HTML.innerHTML='';},
 // the new hire's sheet: rows, a repeated click, a week counter
 sheet(t){camera(t);const rows=18,rh=H*0.042,x0=W*0.1,wd=W*0.8,y0=H*0.16;const scroll=(t*rh*2.4)%rh;
   const mode=P.mode||'open';let h=`<rect x="${x0}" y="${y0-rh*1.4}" width="${wd}" height="${rh*rows+rh*1.4}" rx="10" fill="${C.cream}"/><rect x="${x0}" y="${y0-rh*1.4}" width="${wd}" height="${rh*1.2}" rx="10" fill="#d9d2c3"/>`;
   const open=pop(t,0,0.6);
   for(let r=0;r<rows;r++){const y=y0+r*rh-scroll;if(y<y0-2||y>y0+rh*(rows-1))continue;
     for(let c=0;c<5;c++){h+=`<rect x="${x0+12+c*wd/5}" y="${y+4}" width="${wd/5-24}" height="${rh-12}" rx="3" fill="${C.ink}" opacity="${0.10+((r*7+c*3)%5)*0.03}"/>`}}
   // the repeated click: a cursor tapping the same cell on every row
   const cy=y0+((t*2.4|0)%10)*rh+rh/2;
   if(mode!=='macro'){h+=`<circle cx="${x0+wd*0.62}" cy="${cy}" r="${rh*0.38}" fill="${C.butter}" opacity="${0.5+0.5*Math.sin(t*15)}"/>`}
   else{const tries=[[ev('first',0.4),0.35],[ev('second',2.0),0.55],[ev('third',3.6),1.0]];tries.forEach(([s,reach],i)=>{const p=at(t,s,1.0)*reach;if(t>s)h+=`<rect x="${x0+wd*0.6}" y="${y0}" width="${wd*0.04}" height="${rh*rows*p}" fill="${i<2?C.muted:C.mint}" opacity="${i<2?0.7:0.9}"/>`})}
   SVG.innerHTML=`<g transform="translate(0 ${(1-open)*H*0.4})" opacity="${open}">${h}</g>`;
   const wk=Math.min(3,1+Math.floor(at(t,ev('weeks',1.0),Math.max(1,(P.dur||4)*0.6))*2.99));
   HTML.innerHTML=mode==='weeks'?`<div class="card" style="right:${W*0.06}px;top:${H*0.04}px;background:${C.ink};color:${C.cream};border:3px solid ${C.cream};padding:18px 26px;font:400 ${H*0.07}px Anton">WEEK ${wk}</div>`:'';},
 // three weeks fold into an afternoon
 calendar(t){camera(t);let h='';const k=at(t,ev('shrink',1.2),1.2);const cw=W*0.11,ch=H*0.12,x0=W*0.12,y0=H*0.2;
   for(let i=0;i<15;i++){const c=i%5,r=(i/5)|0;const x=x0+c*cw*1.25*(1-k)+(x0+cw*2.5)*k*0+ (W*0.4-x0-c*cw*1.25)*k;const y=y0+r*ch*1.3*(1-k)+(H*0.36-y0)*k;
     h+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="8" fill="${i===0?C.mint:C.cream}" opacity="${i===0?1:1-k}"/>`}
   SVG.innerHTML=h;HTML.innerHTML=`<div class="label" style="left:${W*0.06}px;top:${H*0.07}px;opacity:${1-k}">3 WEEKS BY HAND</div><div class="label" style="left:${W*0.06}px;top:${H*0.07}px;opacity:${k}">ONE AFTERNOON</div>`;},
 // the two questions as mint cards settling on the gap
 questions(t){camera(t);const L=ladder(t,{extraTop:1,juniorGone:1,label2030:1});const g=L.g;SVG.innerHTML=L.svg;
   const q=P.cards;HTML.innerHTML=(P.text?`<div class="label" style="left:${W*0.06}px;top:${H*0.04}px;opacity:${at(t,0.2)}">${esc(P.text)}</div>`:'')+
   q.map((s,i)=>{const a=pop(t,ev('q'+i,0.6+i*1.4),0.55);return `<div class="card" style="left:${TALL?W*0.08:g.R+W*0.04}px;top:${TALL?H*(0.56+i*0.2):H*(0.30+i*0.27)}px;max-width:${TALL?W*0.84:W-g.R-W*0.10}px;font-size:${H*0.042}px;opacity:${a};transform:translateY(${(1-a)*80}px) rotate(${(i?2:-2)*(1-a)+Math.sin(t+i)*0.6}deg)">${esc(s)}</div>`}).join('');},
 // an action card on the desk
 action(t){camera(t);const a=pop(t,0.05,0.55);const sub=P.sub||[];
   HTML.innerHTML=`<div class="card" style="left:${W*0.08}px;top:${H*0.2}px;width:${W*0.72}px;font-size:${H*0.06}px;opacity:${a};transform:translateY(${(1-a)*90}px) rotate(${-2*(1-a)+Math.sin(t*0.7)*0.5}deg)"><small>${esc(P.kicker||'')}</small>${esc(P.text)}</div>`+
     sub.map((s,i)=>{const b=pop(t,ev('s'+i,1.2+i*1.2),0.5);return `<div class="label" style="left:${W*0.1}px;top:${H*(0.62+i*0.08)}px;font-size:${H*0.028}px;opacity:${b};transform:translateX(${(1-b)*-30}px)">· ${esc(s)}</div>`}).join('');SVG.innerHTML='';},
};
function draw(t){(SCENES[S]||SCENES.label)(t)}
</script>
