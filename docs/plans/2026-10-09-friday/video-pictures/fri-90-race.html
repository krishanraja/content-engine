<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#0C1512; --road:#18241f; --edge:#2f3d37; --cream:#F4EFE4; --mint:#7EF0C0; --amber:#FFC24B; --muted:#a9b4ae; }
html, body { width: 968px; height: 773px; overflow: hidden; background: var(--ink); color: var(--cream); font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
h1 { position: absolute; left: 44px; top: 26px; font: 400 64px/1 Anton, sans-serif; text-transform: uppercase; }
.credit { position: absolute; left: 46px; top: 100px; font: 500 40px/1 'IBM Plex Mono', monospace; color: var(--muted); }
.row { position: absolute; left: 44px; right: 44px; height: 58px; display: flex; align-items: center; gap: 16px; }
.row img { height: 40px; }
.row .name { font: 400 56px/1 Anton, sans-serif; text-transform: uppercase; }
.gear { margin-left: auto; font: 700 40px/1 'IBM Plex Mono', monospace; letter-spacing: .03em; padding: 9px 16px 8px; border-radius: 10px; color: var(--ink); }
.gear.low { background: var(--amber); } .gear.top { background: var(--mint); }
.track { position: absolute; left: 44px; right: 44px; height: 156px; background: var(--road); border-radius: 12px; overflow: hidden; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 6px dashed #34443d; }
.finish { position: absolute; top: 0; bottom: 0; left: 776px; width: 36px; background: repeating-conic-gradient(var(--cream) 0 25%, var(--ink) 0 50%) 0 0 / 36px 36px; }
.car { position: absolute; top: 22px; width: 220px; height: 124px; }
.speed { position: absolute; top: 36px; width: 120px; height: 96px; }
.win { position: absolute; top: 46px; font: 400 56px/1 Anton, sans-serif; color: var(--ink); background: var(--mint); padding: 8px 18px 6px; border-radius: 12px; transform: rotate(-4deg); }
.pay { position: absolute; left: 44px; right: 44px; top: 652px; height: 100px; border-radius: 16px; background: var(--cream); color: var(--ink); display: flex; align-items: center; justify-content: center; font: 400 60px/1 Anton, sans-serif; text-transform: uppercase; white-space: pre; }
.pay.q { background: transparent; color: var(--cream); border: 4px solid var(--cream); }
.m { color: #1f7a52; }
</style></head><body>
<h1>One hard test</h1>
<div class="credit">Test by Artificial Analysis</div>

<div class="row" style="top:150px"><img src="anthropic-symbol-cream.svg" alt=""><span class="name">Newest Claude AI</span><span class="gear low">LOW GEAR</span></div>
<div class="track" id="tA" style="top:214px"><div class="finish"></div></div>
<div class="row" style="top:390px"><img src="anthropic-symbol-cream.svg" alt=""><span class="name">Older Claude AI</span><span class="gear top">TOP GEAR</span></div>
<div class="track" id="tB" style="top:454px"><div class="finish"></div></div>
<div class="pay" id="pay"></div>

<template id="car"><svg class="car" viewBox="0 0 250 140"><path class="body" d="M20 92 C22 70 40 62 62 60 L92 30 C98 24 106 22 116 22 L170 22 C182 22 190 26 198 34 L222 60 C238 62 244 72 244 92 L244 104 L20 104 Z"/><path d="M100 34 L118 34 L118 58 L80 58 Z M128 34 L176 34 C182 34 186 36 190 40 L206 58 L128 58 Z" fill="#0C1512"/><circle cx="70" cy="106" r="22" fill="#0C1512"/><circle cx="70" cy="106" r="9" fill="#a9b4ae"/><circle cx="198" cy="106" r="22" fill="#0C1512"/><circle cx="198" cy="106" r="9" fill="#a9b4ae"/></svg></template>
<script>
// Page 1: both on the start line. Page 2: the older one, in top gear, is over the line; the newest, in
// low gear, is drawn where its score puts it, 0.82 of the way (Artificial Analysis 42 against 51, never shown).
const page = new URLSearchParams(location.search).get('p') || '1';
const make = (track, fill) => { const s = document.getElementById('car').content.firstElementChild.cloneNode(true); s.querySelector('.body').setAttribute('fill', fill); document.getElementById(track).appendChild(s); return s };
const A = make('tA', '#F4EFE4'), B = make('tB', '#9aa59f');
const start = 14, nose = 0.976 * 220, finish = 776 + 36;   // track coordinates
const travel = finish + 40 - nose - start;                    // the winner's nose clearly over the line
const pay = document.getElementById('pay');
if (page === '1') {
  A.style.left = start + 'px'; B.style.left = start + 'px';
  pay.className = 'pay q'; pay.textContent = 'Which one wins?';
} else {
  B.style.left = (start + travel) + 'px'; A.style.left = (start + travel * 0.82) + 'px';
  const sp = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sp.setAttribute('class', 'speed'); sp.setAttribute('viewBox', '0 0 120 96');
  sp.innerHTML = '<g stroke="#7EF0C0" stroke-width="9" stroke-linecap="round"><line x1="8" y1="22" x2="100" y2="22"/><line x1="28" y1="50" x2="112" y2="50"/><line x1="8" y1="78" x2="100" y2="78"/></g>';
  sp.style.left = (start + travel - 128) + 'px'; document.getElementById('tB').appendChild(sp);
  const w = document.createElement('div'); w.className = 'win'; w.textContent = 'WINS'; w.style.left = '40px'; document.getElementById('tB').appendChild(w);
  pay.innerHTML = 'The gear beat the <span class="m">new</span> badge';
}
</script>
</body></html>
