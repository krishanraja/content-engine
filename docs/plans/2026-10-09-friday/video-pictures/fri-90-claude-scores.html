<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink:#0C1512; --panel:#15201b; --grid:#2b3832; --cream:#F4EFE4; --mint:#7EF0C0; --amber:#FFC24B; --muted:#a9b4ae; }
html, body { width: 968px; height: 773px; overflow: hidden; background: var(--ink); color: var(--cream); font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
.head { position: absolute; left: 44px; right: 44px; top: 34px; display: flex; align-items: center; gap: 18px; }
.head img { height: 42px; }
.head h1 { font: 800 54px/1.05 Archivo, sans-serif; letter-spacing: -.01em; }
.sub { position: absolute; left: 44px; right: 44px; top: 104px; font: 500 40px/1.2 Archivo, sans-serif; color: var(--muted); }
.plot { position: absolute; left: 44px; right: 44px; top: 186px; height: 470px; }
.grid { position: absolute; top: 0; bottom: 46px; border-left: 2px dashed var(--grid); }
.tick { position: absolute; bottom: 0; transform: translateX(-50%); font: 500 40px/1 'IBM Plex Mono', monospace; color: var(--muted); }
.row { position: absolute; left: 0; right: 0; height: 190px; }
.name { font: 800 50px/1 Archivo, sans-serif; }
.chip { display: inline-block; margin-left: 14px; vertical-align: 6px; font: 700 40px/1 'IBM Plex Mono', monospace; padding: 7px 12px 6px; border-radius: 8px; color: var(--ink); }
.bar { position: absolute; left: 0; top: 70px; height: 86px; border-radius: 0 12px 12px 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; font: 400 66px/1 Anton, sans-serif; color: var(--ink); }
.foot { position: absolute; left: 44px; right: 44px; bottom: 30px; font: 500 40px/1 Archivo, sans-serif; color: var(--muted); }
</style></head><body>
<div class="head"><img src="anthropic-symbol-cream.svg" alt=""><h1>Newest vs older Claude</h1></div>
<div class="sub">Intelligence Index: 10 hard tests. Higher is better.</div>
<div class="plot" id="plot"></div>
<div class="foot">Source: Artificial Analysis, 16 Oct 2026</div>
<script>
// Artificial Analysis Intelligence Index, read from its API on 16 October 2026: Claude Opus 5.5 (Low) 42.3,
// Claude Opus 5 (Max) 50.8; shown whole, as its model pages say them ("scores 42", "scores 51"). Axis from zero.
const rows = [
  { name: 'Opus 5.5 (newest)', chip: 'LOW EFFORT', colour: 'var(--amber)', value: 42 },
  { name: 'Opus 5 (older)', chip: 'MAX EFFORT', colour: 'var(--mint)', value: 51 },
];
const plot = document.getElementById('plot'), W = 880, MAX = 60;
for (const t of [0, 20, 40, 60]) {
  const x = t / MAX * W;
  plot.insertAdjacentHTML('beforeend', `<div class="grid" style="left:${x}px"></div><div class="tick" style="left:${Math.min(Math.max(x, 24), W - 24)}px">${t}</div>`);
}
rows.forEach((r, i) => {
  plot.insertAdjacentHTML('beforeend', `<div class="row" style="top:${i * 206}px"><div><span class="name">${r.name}</span><span class="chip" style="background:${r.colour}">${r.chip}</span></div>
    <div class="bar" style="width:${r.value / MAX * W}px;background:${r.colour}">${r.value}</div></div>`);
});
</script>
</body></html>
