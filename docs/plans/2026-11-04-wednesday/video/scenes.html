<!doctype html>
<meta charset="utf-8">
<!-- Wednesday 4 Nov, "The Queue": every drawn panel of both cuts. scenes.py loads this page at the panel's size
     (?w=1314&h=1080 beside his face, ?w=1080&h=1000 above it), calls show(id, params) once and render(t) per frame.
     Each scene is laid out in a 1000 x 1000 square, fitted and centred, so one layout serves both shapes.
     Krish, 2026-10-31: "I want way more animation than ever before and movement": the world drifts and pushes the
     whole time, everything enters on the brand's curve with a small overshoot and keeps swaying after it lands. -->
<style>
@font-face{font-family:Anton;src:url('../../../../assets/fonts/makeyourmindup/Anton-Regular.ttf')}
@font-face{font-family:Archivo;src:url('../../../../assets/fonts/makeyourmindup/Archivo-Variable.ttf')}
@font-face{font-family:Plex;src:url('../../../../assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf')}
:root{--ink:#0C1512;--deep:#070D0B;--cream:#F4EFE4;--mint:#7EF0C0;--lilac:#B7A6FF;--muted:#a9b4ae}
html,body{margin:0;background:var(--ink);overflow:hidden}
#stage{position:relative;overflow:hidden;background:radial-gradient(900px 700px at 58% 40%,#1c2a2e 0%,var(--ink) 58%,var(--deep) 100%)}
#grain{position:absolute;inset:-40px;opacity:.09;mix-blend-mode:screen;pointer-events:none}
#sq{position:absolute;left:50%;top:50%;width:1000px;height:1000px;transform-origin:0 0}
#world{position:absolute;inset:0;transform-origin:50% 50%}
.a{position:absolute}
.lab{font:26px Plex;letter-spacing:2px;color:var(--cream);background:var(--ink);border:2px solid var(--lilac);border-radius:10px;padding:10px 18px;white-space:nowrap}
.chip{font:24px Plex;letter-spacing:2px;color:var(--ink);background:var(--cream);border-radius:999px;padding:8px 18px;white-space:nowrap}
.order{width:300px;height:360px;background:url('../../../../assets/plates/two-passports/paper.jpg') center/cover,var(--cream);background-blend-mode:multiply;
  border-radius:8px;color:var(--ink);box-shadow:0 26px 50px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.4) inset;overflow:hidden}
.order .band{height:52px;background:url('../../../../assets/plates/two-passports/guilloche.svg') center/cover,#d9d1bf;opacity:.85}
.order .no{position:absolute;top:16px;left:20px;font:18px Plex;letter-spacing:2px}
.order h3{margin:22px 20px 0;font:800 36px/1.05 Archivo}
.order .from{position:absolute;left:20px;bottom:86px;display:flex;gap:10px;align-items:center;font:18px Plex;letter-spacing:1px}
.order .from img{width:40px;height:40px}
.order .slot{position:absolute;bottom:16px;height:56px;border:3px dashed rgba(12,21,18,.45);border-radius:10px;font:22px Plex;color:rgba(12,21,18,.55);
  display:flex;align-items:center;justify-content:center;letter-spacing:2px}
.order .yes{right:18px;width:130px}.order .nob{left:18px;width:96px}
.order .barred{left:18px;right:18px;font-size:15px;letter-spacing:1px;border-style:solid;border-color:#0C1512;background:#0C1512;color:var(--cream)}
.stamp{position:absolute;right:6px;bottom:4px;width:150px;height:76px;border:7px solid var(--mint);border-radius:14px;color:var(--mint);
  font:56px/62px Anton;text-align:center;letter-spacing:4px;background:rgba(126,240,192,.16);filter:drop-shadow(0 0 16px rgba(126,240,192,.6))}
.rail{position:absolute;left:-300px;right:-300px;height:14px;border-radius:7px;background:linear-gradient(#cfc8b8,#8f897b 55%,#5d5a51);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.line{position:absolute;width:10px;background:var(--lilac);border-radius:5px;box-shadow:0 0 40px rgba(183,166,255,.55)}
.page{background:#fff;border-radius:10px;box-shadow:0 40px 80px rgba(0,0,0,.65);overflow:hidden}
.page img{display:block;width:100%}
.logo{width:120px;height:120px;border-radius:28px;background:var(--cream);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 30px rgba(0,0,0,.5)}
.logo img{width:72px;height:72px}
.big{font-family:Anton;color:var(--cream);line-height:.9}
.card{background:var(--cream);color:var(--ink);border-radius:14px;box-shadow:0 24px 44px rgba(0,0,0,.55)}
.quote{font:700 40px/1.22 Archivo;color:var(--ink);padding:44px 48px}
.quote mark{background:var(--mint);color:var(--ink);padding:0 4px}
.src{font:20px Plex;letter-spacing:2px;color:var(--muted)}
.bubble{background:#F4EFE4;color:var(--ink);border-radius:26px 26px 26px 6px;font:700 30px Archivo;padding:22px 28px}
.tile{width:300px;height:300px;border-radius:26px;background:linear-gradient(160deg,#20302c,#0f1a17);border:3px solid var(--mint);box-shadow:0 30px 60px rgba(0,0,0,.6)}
.plan{width:200px;height:250px;border-radius:16px;font:400 54px Anton;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.step{font:400 64px Anton;color:var(--ink);background:var(--mint);width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
</style>
<body>
<div id="stage"><svg id="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div id="sq"><div id="world"></div></div></div>
<script>
const Q = new URLSearchParams(location.search), W = +Q.get('w') || 1314, H = +Q.get('h') || 1080;
const stage = document.getElementById('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
const S = Math.min(W, H) / 1000, sq = document.getElementById('sq');
sq.style.transform = `scale(${S}) translate(-500px,-500px)`;
const world = document.getElementById('world');
const LOGO = '../imagery/logos/', PAGE = '../imagery/pages/', CLAUDE = '../imagery/logos/claude.svg';
function bez(x1,y1,x2,y2){return t=>{if(t<=0)return 0;if(t>=1)return 1;let lo=0,hi=1,m;for(let i=0;i<30;i++){m=(lo+hi)/2;const x=3*(1-m)**2*m*x1+3*(1-m)*m*m*x2+m**3;if(x<t)lo=m;else hi=m}return 3*(1-m)**2*m*y1+3*(1-m)*m*m*y2+m**3}}
const enter = bez(.05,.7,.1,1), exit = bez(.3,0,.8,.15), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
// an entrance with a small overshoot that settles, then a slow float: never a dead hold
const pop = (t, at, d=0.45) => { const p = clamp((t-at)/d); return p<=0?0: p>=1?1: enter(p) + Math.sin(p*Math.PI)*0.08; };
const float = (t, k=1) => Math.sin(t*1.3 + k)*4;
let SCENE = null, P = {};
function el(html, x, y, extra='') { return `<div class="a" style="left:${x}px;top:${y}px;${extra}">${html}</div>`; }
function order(o, x, y, rot, stampP=0, barred=false) {
  return el(`<div class="order"><div class="band"></div><div class="no">${o.no}</div><h3>${o.title}</h3>
    <div class="from">${o.logo?`<img src="${LOGO}${o.logo}">`:''}${o.app||''}</div>
    ${barred?`<div class="slot barred">NOT EVEN WITH A YES</div>`:`<div class="slot nob">NO</div><div class="slot yes" style="opacity:${1-stampP}">YES</div>`}
    ${stampP>0?`<div class="stamp" style="opacity:${stampP};transform:scale(${1.6-0.6*enter(stampP)}) rotate(${-8+4*stampP}deg)">YES</div>`:''}</div>`,
    x, y, `transform:rotate(${rot}deg);transform-origin:50% -40px`);
}
function cam(t, T, push=0.06, drift=24) {   // the camera never rests
  const p = clamp(t/Math.max(T,0.1));
  world.style.transform = `translate(${-drift*p + Math.sin(t*0.4)*6}px,${Math.cos(t*0.33)*5}px) scale(${1+push*enter(p)})`;
}
function label(t, at, text, x=60, y=830) {
  const p = pop(t, at); if (!p || !text) return '';
  return el(`<div class="lab">${text}</div>`, x - (1-Math.min(p,1))*40, y, `opacity:${Math.min(1,p)}`);
}
const SCENES = {
  // Long 4: every few hours it checks your connected apps; over 6,000 connectors.
  logos(t,T){ cam(t,T,0.08); let h='';
    const c = pop(t,0.0), cx=500, cy=430;
    h += el(`<div class="logo" style="width:170px;height:170px;border-radius:40px"><img src="${CLAUDE}" style="width:104px;height:104px"></div>`, cx-85, cy-85+float(t), `transform:scale(${c})`);
    // the clock ring: a sweep round the Claude mark, again and again (every few hours)
    const sw = (t*0.9)%1; h += el(`<svg width="300" height="300"><circle cx="150" cy="150" r="138" fill="none" stroke="#B7A6FF" stroke-width="6" stroke-dasharray="${867*sw} 867" transform="rotate(-90 150 150)" opacity=".8"/></svg>`, cx-150, cy-150);
    [['gmail.svg',1.9,170,250],['google-calendar.svg',2.6,830,250],['slack.svg',3.7,500,720]].forEach(([f,at,x,y],i)=>{
      const p = pop(t,at); if(!p) return;
      const k = clamp((t-at)/0.6), lx = cx + (x-cx)*k, ly = cy + (y-cy)*k;
      h += `<svg class="a" style="left:0;top:0;overflow:visible" width="1000" height="1000"><line x1="${cx}" y1="${cy}" x2="${lx}" y2="${ly}" stroke="#7EF0C0" stroke-width="4" stroke-dasharray="10 12" stroke-dashoffset="${-t*60}" opacity=".8"/>
        <circle cx="${cx+(x-cx)*((t*0.7+i*0.3)%1)}" cy="${cy+(y-cy)*((t*0.7+i*0.3)%1)}" r="9" fill="#7EF0C0"/></svg>`;
      h += el(`<div class="logo"><img src="${LOGO}${f}"></div>`, x-60, y-60+float(t,i), `transform:scale(${p})`);
    });
    const m = pop(t,4.4); if (m) h += el(`<div class="chip">+ 6,000 MORE</div>`, 640, 690+float(t,4), `transform:scale(${m})`);
    h += label(t,0.4,'EVERY FEW HOURS · 6,000+ CONNECTORS',60,880); world.innerHTML = h; },
  // Long 6, short 4: it stops at the line before it sends, pays, signs or deletes; two things are off-limits even with a yes.
  stops(t,T){ cam(t,T,0.05,30); const tall = P.tall; let h='';
    const O = [{no:'WORK ORDER 01',title:'Send a message',logo:'gmail.svg',app:'GMAIL'},{no:'WORK ORDER 02',title:'Make a payment',app:'PAYMENT'},
               {no:'WORK ORDER 03',title:'Sign a document',app:'SIGNATURE'},{no:'WORK ORDER 04',title:'Delete anything',app:'FILES'}];
    const ats = P.ats, LINE = 820;
    h += `<div class="rail" style="top:800px;background-position-x:${t*40}px"></div>`;
    h += el(`<div class="line" style="height:600px"></div>`, LINE, 230, `opacity:${0.6+0.4*Math.abs(Math.sin(t*1.7))}`);
    h += el(`<div class="src" style="color:#B7A6FF">WAITS FOR YOUR YES</div>`, LINE-120, 190);
    O.forEach((o,i)=>{ if (ats[i]==null) return; const p = enter(clamp((t-ats[i])/0.7)); if(!p) return;
      const slot = LINE - 330 - i*70, x = -420 + (slot+420)*p, y = 420 - i*18;
      h += order(o, x, y, Math.sin(t*2+i)*1.4*(1-clamp((t-ats[i])/1.4)) + Math.sin(t*1.2+i)*0.6);
    });
    if (P.off != null && t > P.off) {   // off-limits even with a yes: trades, moving money
      const p = enter(clamp((t-P.off)/0.6));
      h += `<div class="a" style="inset:0;background:rgba(7,13,11,${0.72*p})"></div>`;
      [['Trade securities','TRADES'],['Move money between accounts','TRANSFERS']].forEach(([title,app],i)=>{
        const q = pop(t, P.off + 0.25 + i*0.3); if(!q) return;
        h += order({no:'OFF-LIMITS', title, app}, 170 + i*360, 280 + (1-Math.min(q,1))*300 + float(t,i), Math.sin(t+i)*1.2, 0, true);
      });
      h += label(t, P.off + 0.2, 'OFF-LIMITS EVEN WITH A YES', 60, 880);
    }
    world.innerHTML = h; },
  // A real page, the proving line marked in mint: it slides up, the camera travels down to the line and keeps pushing.
  doc(t,T){ let h=''; const p = enter(clamp(t/0.6));
    const z = 1.0 + 0.16*enter(clamp(t/Math.max(T,0.1))), fy = P.fy;   // fy: the marked line, 0..1 down the page
    const pw = 1900, ph = pw*P.ratio, x = 470 - pw*P.fx, y0 = 200 + (1-p)*200;
    const travel = enter(clamp((t-0.15)/1.2));
    const ty = y0 + (420 - y0 - ph*fy) * travel;
    world.style.transform = `translate(${Math.sin(t*0.4)*8}px,0) scale(${z})`; world.style.transformOrigin = `50% ${38+4*Math.sin(t*0.3)}%`;
    h += el(`<div class="page" style="width:${pw}px"><img src="${PAGE}${P.img}"></div>`, x, ty, `opacity:${p};transform:rotate(${-0.6+0.4*Math.sin(t*0.5)}deg)`);
    if (P.logo) { const q = pop(t, P.logoAt||0.8); if (q) h += el(`<div class="logo"><img src="${LOGO}${P.logo}"></div>`, 800, 660+float(t), `transform:scale(${q})`); }
    if (P.bar != null) {   // the usage bar fills on "limit"
      const f = enter(clamp((t-P.bar)/1.2));
      h += el(`<div class="card" style="width:520px;padding:22px 26px"><div class="src" style="color:#0C1512">SETTINGS · USAGE</div>
        <div style="margin-top:14px;height:30px;border-radius:15px;background:#d9d1bf;overflow:hidden"><div style="height:100%;width:${15+70*f}%;background:#B7A6FF"></div></div></div>`, 420, 700 + float(t), `opacity:${clamp((t-P.bar+0.4)/0.4)}`);
    }
    h += label(t, P.labAt||0.4, P.label||'', 60, 880);
    world.innerHTML = h; },
  // Long 21, short 11: you ask once and it builds you a tool you use again and again.
  tool(t,T){ cam(t,T,0.06); let h=''; const fold = P.fold, uses = P.uses;
    const b = pop(t, 0.2), f = enter(clamp((t-fold)/0.6));
    if (f < 1) h += el(`<div class="bubble" style="width:420px">Find me free slots<br>this week and next</div>`, 290, 300 + float(t), `opacity:${b*(1-f)};transform:scale(${1-0.5*f}) rotate(${-8*f}deg)`);
    if (f > 0) {
      const lit = uses.map(u => t > u ? 1 : 0);
      h += el(`<div class="tile"><div style="padding:30px;font:800 34px/1.05 Archivo;color:#F4EFE4">Calendar<br>scheduler</div>
        <div style="position:absolute;left:30px;right:30px;bottom:34px;display:flex;gap:12px">${['MON','WED','FRI'].map((d,i)=>`<div style="flex:1;text-align:center;font:22px Plex;padding:12px 0;border-radius:10px;
          background:${lit[i]?'#7EF0C0':'rgba(244,239,228,.08)'};color:${lit[i]?'#0C1512':'#a9b4ae'};transform:translateY(${lit[i]? -8*Math.sin(clamp((t-uses[i])/0.3)*Math.PI):0}px)">${d}</div>`).join('')}</div></div>`,
        350, 250 + float(t) , `transform:scale(${0.5+0.5*f}) rotate(${6*(1-f)}deg)`);
    }
    const a = pop(t, fold - 0.2); if (a) h += el(`<div class="chip" style="background:#B7A6FF">ASK ONCE</div>`, 120, 180, `transform:scale(${a})`);
    const u = pop(t, uses[0]); if (u) h += el(`<div class="chip">USE IT AGAIN AND AGAIN</div>`, 560, 640 + float(t,2), `transform:scale(${u})`);
    world.innerHTML = h; },
  // Long 22: today you paste the thread, the invite and your notes into Claude, then ask.
  today(t,T){ cam(t,T,0.05); let h='';
    h += label(t,0.2,'TODAY',60,120);
    h += el(`<div class="card" style="width:520px;height:330px;padding:26px"><div style="display:flex;gap:14px;align-items:center"><img src="${CLAUDE}" style="width:46px"><b style="font:800 30px Archivo">Claude</b></div>
      <div style="margin-top:22px;height:150px;border:3px dashed rgba(12,21,18,.35);border-radius:14px"></div></div>`, 240, 420 + float(t) - 14*Math.max(0,Math.sin(Math.min(1,Math.max(0,(t-6)/0.25))*Math.PI)));
    [['gmail.svg','THE EMAIL THREAD',P.ats[0],-60],['google-calendar.svg','THE INVITE',P.ats[1],420],[null,'YOUR NOTES',P.ats[2],760]].forEach(([lg,txt,at,x0],i)=>{
      const p = enter(clamp((t-at+0.6)/0.6)); if(!p) return;
      const x = x0 + (330+i*60 - x0)*p, y = 120 + (520-120)*p*p, s = 1 - 0.45*p;
      h += el(`<div class="card" style="padding:16px 20px;display:flex;gap:12px;align-items:center;font:22px Plex">${lg?`<img src="${LOGO}${lg}" style="width:40px">`:''}${txt}</div>`, x, y, `transform:scale(${s}) rotate(${(1-p)*-10}deg)`);
    });
    const q = pop(t, P.ask); if (q) h += el(`<div class="bubble" style="font-size:64px;padding:10px 34px">?</div>`, 700, 330 + float(t), `transform:scale(${q})`);
    world.innerHTML = h; },
  // Long 23: with Duet the work turns up first, prepared, and your job is yes or no. The big moment.
  duet(t,T){ cam(t,T,0.07,30); let h=''; const LINE=820;
    h += label(t,0.1,'WITH DUET',60,120);
    h += `<div class="rail" style="top:800px;background-position-x:${t*40}px"></div>`;
    h += el(`<div class="line" style="height:600px"></div>`, LINE, 230, `opacity:${0.6+0.4*Math.abs(Math.sin(t*1.7))}`);
    const O = [{no:'READY',title:'Meeting prep',logo:'google-calendar.svg',app:'CALENDAR'},{no:'READY',title:'Draft reply',logo:'gmail.svg',app:'GMAIL'},{no:'READY',title:'Note',app:'NOTES'}];
    const stamp = clamp((t-P.yes)/0.17), out = exit(clamp((t-P.yes-0.4)/0.55)), adv = enter(clamp((t-P.yes-0.75)/0.6));
    O.forEach((o,i)=>{ const p = enter(clamp((t-P.first-i*0.35)/0.7)); if(!p) return;
      let slot = LINE - 330 - i*330 + (i>0 ? 330*adv : 0); let x = -420 + (slot+420)*p;
      if (i===0) x += 900*out;
      h += order(o, x, 420, Math.sin(t*2+i)*1.2*(1-clamp((t-P.first)/1.4)) + Math.sin(t*1.2+i)*0.6, i===0?stamp:0);
    });
    world.innerHTML = h; },
  // Long 24: a small business owner's comment (the page wants a login, so it is drawn from the checked words; no username).
  reddit(t,T){ cam(t,T,0.05); let h=''; const p = pop(t,0.2), m = clamp((t-P.mark)/0.9);
    h += el(`<div class="card" style="width:820px"><div class="quote">“I’m not doing anything that I don’t think a normal version of Claude could do. <mark style="background:linear-gradient(90deg,#7EF0C0 ${m*100}%,transparent ${m*100}%)">I just hadn’t thought to use it this way.</mark>”</div></div>`, 90, 230 + float(t), `transform:scale(${Math.min(1,p)}) rotate(${-1+0.6*Math.sin(t*0.5)}deg)`);
    h += label(t,0.5,'A SMALL BUSINESS OWNER · REDDIT r/ClaudeAI · 26 OCT',60,820);
    world.innerHTML = h; },
  // Long 25: they caught up in 36 hours.
  hours(t,T){ cam(t,T,0.08); let h='';
    for (let i=0;i<9;i++){ const gone = enter(clamp((t-1.8-i*0.45)/0.5)); if (gone>=1) continue;   // the backlog clears, card by card
      h += el(`<div class="card" style="width:260px;height:70px;padding:16px 20px;font:22px Plex">BEHIND · ${String(i+1).padStart(2,'0')}</div>`, 60 + (i%3)*20 + gone*700, 140 + i*62, `opacity:${1-gone};transform:rotate(${(i%2?1:-1)*2}deg)`); }
    const r = clamp((t-P.roll)/0.9), n = Math.round(36*enter(r));
    if (t > P.roll - 0.2) h += el(`<div class="big" style="font-size:380px">${n}</div>`, 470, 230 + float(t), `opacity:${clamp((t-P.roll+0.2)/0.2)}`);
    const hr = pop(t, P.roll + 0.8); if (hr) h += el(`<div class="big" style="font-size:110px;color:#7EF0C0">HOURS</div>`, 500, 610, `transform:translateX(${(1-Math.min(hr,1))*80}px);opacity:${Math.min(1,hr)}`);
    h += label(t, P.roll + 1.2, 'THE SAME OWNER, ON REDDIT', 470, 790);
    world.innerHTML = h; },
  // Long 30: Pro and Max in the US by waitlist; Team and Enterprise later.
  plans(t,T){ cam(t,T,0.05); let h='';
    [['PRO',P.ats[0],true],['MAX',P.ats[1],true],['TEAM',P.ats[2],false],['ENTERPRISE',P.ats[3],false]].forEach(([n,at,ok],i)=>{
      const p = pop(t,at); if(!p) return;
      h += el(`<div class="plan card" style="font-size:${n.length>4?34:54}px;background:${ok?'#F4EFE4':'#26322f'};color:${ok?'#0C1512':'#a9b4ae'}">${n}
        <div class="chip" style="font-size:20px;background:${ok?'#7EF0C0':'#B7A6FF'};color:#0C1512">${ok?'US · WAITLIST':'LATER'}</div></div>`, 30 + i*240, 330 + float(t,i), `transform:scale(${p})`);
    });
    h += label(t, P.ats[2] + 0.4, 'TEAM AND ENTERPRISE: LATER', 60, 880);
    world.innerHTML = h; },
  // Long 32: work email into a personal Claude plan puts company email where the company has no say.
  it(t,T){ cam(t,T,0.05); let h='';
    const m = enter(clamp((t-P.move)/1.6));
    h += el(`<div class="card" style="width:360px;height:330px;padding:26px;font:800 34px Archivo">Personal<br>Claude plan<div class="src" style="color:#0C1512;margin-top:14px">OUTSIDE THE COMPANY</div></div>`, 580, 330 + float(t));
    h += el(`<div class="card" style="padding:18px 22px;display:flex;gap:12px;align-items:center;font:24px Plex"><img src="${LOGO}gmail.svg" style="width:42px"><img src="${LOGO}microsoft-365.svg" style="width:42px">WORK EMAIL</div>`,
      80 + 520*m, 300 + 250*m + float(t,1), `transform:scale(${1-0.25*m}) rotate(${-6+6*m}deg)`);
    const d = pop(t, P.decide); if (d) h += el(`<div class="card" style="padding:20px 26px;font:800 32px Archivo;display:flex;gap:16px;align-items:center">Allowed?
      <span class="chip" style="background:#7EF0C0">YES</span><span class="chip" style="background:#0C1512;color:#F4EFE4">NO</span></div>`, 120, 660, `transform:scale(${d})`);
    h += label(t, 0.4, 'TEAM AND ENTERPRISE PLANS: NOT YET', 60, 880);
    world.innerHTML = h; },
  // Long 34, 35 and short 13: the numbered steps.
  steps(t,T){ cam(t,T,0.05); let h='';
    P.items.forEach((s,i)=>{ const p = pop(t, s.at); if(!p) return; const y = 140 + i*370;
      h += el(`<div class="step">${s.n}</div>`, 60, y + float(t,i), `transform:scale(${p})`);
      if (s.kind === 'fire') h += el(`<div class="card" style="width:560px;padding:24px 28px;font:800 36px Archivo">One weekly job<div style="display:inline-block;margin-left:16px" class="chip" ><span style="color:#0C1512">ON FIRE</span></div></div>`, 180, y + float(t,i+1), `transform:scale(${Math.min(1,p)})`);
      if (s.kind === 'wire') { h += el(`<div class="card" style="width:260px;padding:22px 26px;font:800 32px Archivo">The job</div>`, 180, y + float(t,i+1));
        [['gmail.svg',s.at+0.3],['google-calendar.svg',s.at+0.7],['slack.svg',s.at+1.1]].forEach(([f,a],k)=>{ const q = pop(t,a); if(!q) return;
          h += `<svg class="a" style="left:0;top:0;overflow:visible" width="1000" height="1000"><path d="M440 ${y+40} C 560 ${y+40}, 560 ${y-40+k*80}, 660 ${y-40+k*80}" stroke="#7EF0C0" stroke-width="4" fill="none" stroke-dasharray="${300*clamp((t-a)/0.4)} 300"/></svg>`;
          h += el(`<div class="logo" style="width:90px;height:90px;border-radius:22px"><img src="${LOGO}${f}" style="width:54px;height:54px"></div>`, 670, y - 85 + k*80 + float(t,k), `transform:scale(${q})`); }); }
      if (s.kind === 'week') { ['M','T','W','T','F','S','S'].forEach((d,k)=>{ const st = clamp((t - s.yes - k*0.18)/0.17);
          h += el(`<div class="card" style="width:96px;height:120px;padding:10px;font:20px Plex;text-align:center">${d}<div style="margin-top:14px;height:40px;border-radius:8px;border:3px ${st?'solid #7EF0C0':'dashed rgba(12,21,18,.4)'};background:${st?'#7EF0C0':'transparent'};font:18px Plex;line-height:34px">YES</div></div>`, 180 + k*108, y + float(t,k)*0.6, `transform:scale(${1+0.15*Math.sin(st*Math.PI)})`); }); }
      if (s.kind === 'usage') { const f = enter(clamp((t-s.fill)/1.0));
        h += el(`<div class="card" style="width:600px;padding:22px 26px"><div class="src" style="color:#0C1512">SETTINGS · USAGE</div><div style="margin-top:14px;height:30px;border-radius:15px;background:#d9d1bf;overflow:hidden"><div style="height:100%;width:${10+60*f}%;background:#B7A6FF"></div></div></div>`, 180, y + float(t,i+1)); }
      if (s.kind === 'draft') { const st = clamp((t-s.yes)/0.17);
        h += order({no:'DRAFT', title:'Reply to a client', logo:'gmail.svg', app:'GMAIL'}, 200, y - 120, Math.sin(t*1.2)*0.8, st); }
    });
    world.innerHTML = h; },
  // Short 1: the opening: Claude Duet, the research preview he got into.
  open(t,T){ cam(t,T,0.07); let h='';
    const m = pop(t,0.2); h += el(`<div class="logo" style="width:200px;height:200px;border-radius:46px"><img src="${CLAUDE}" style="width:124px;height:124px"></div>`, 400, 150 + float(t), `transform:scale(${m}) rotate(${(1-Math.min(m,1))*-20}deg)`);
    const word = 'CLAUDE DUET', n = Math.round(word.length * clamp((t-1.6)/0.6));
    h += el(`<div class="big" style="font-size:170px;white-space:nowrap">${word.slice(0,n)}<span style="opacity:${Math.sin(t*8)>0?1:0}">${n<word.length?'|':''}</span></div>`, 70, 420);
    const c = pop(t,2.4); if (c) h += el(`<div class="chip" style="background:#B7A6FF">RESEARCH PREVIEW · 21 OCT 2026</div>`, 200, 640 + float(t,2), `transform:scale(${c})`);
    const q = pop(t,P.ask); if (q) h += el(`<div class="bubble" style="width:560px">What does it change if you already use Claude?</div>`, 220, 760 + float(t,3), `transform:scale(${q})`);
    world.innerHTML = h; },
  // Short 6: it reads one email account, and his is mostly bills; Microsoft 365 work email not yet.
  email(t,T){ cam(t,T,0.06); let h='';
    const box = pop(t,1.3); h += el(`<div class="card" style="width:520px;height:440px;padding:24px"><div style="display:flex;gap:12px;align-items:center;font:800 30px Archivo"><img src="${LOGO}gmail.svg" style="width:44px">One inbox</div></div>`, 240, 200 + float(t), `transform:scale(${box})`);
    for (let i=0;i<5;i++){ const p = pop(t, 1.9 + i*0.22); if(!p) continue; const bill = i!==2;
      h += el(`<div style="width:450px;height:56px;border-radius:10px;background:${bill?'#e9e2d2':'#fff'};display:flex;align-items:center;gap:14px;padding:0 18px;font:22px Plex;color:#0C1512">
        <span style="width:30px;height:22px;border:3px solid #0C1512;border-radius:4px"></span>${bill?'BILL':'EVERYTHING ELSE'}${bill&&t>P.bills+i*0.1?'<span class="chip" style="margin-left:auto;font-size:16px;padding:4px 10px;background:#B7A6FF">BILL</span>':''}</div>`, 275, 290 + i*66, `transform:translateX(${(1-Math.min(p,1))*-60}px);opacity:${Math.min(1,p)}`); }
    const m = pop(t,P.ms); if (m) h += el(`<div class="card" style="padding:16px 22px;display:flex;gap:14px;align-items:center;font:22px Plex"><img src="${LOGO}microsoft-365.svg" style="width:44px">MICROSOFT 365 WORK EMAIL: NOT YET</div>`, 150, 700 + float(t,2), `transform:scale(${m})`);
    world.innerHTML = h; },
  // Short 12: the turn to what to do: two empty steps arrive on the rail, waiting to be filled.
  doit(t,T){ cam(t,T,0.06); let h='';
    h += `<div class="rail" style="top:640px;background-position-x:${t*40}px"></div>`;
    [1,2].forEach((n,i)=>{ const p = pop(t, 0.3 + i*0.4); if(!p) return;
      h += el(`<div class="step" style="width:150px;height:150px;font-size:110px">${n}</div>`, 220 + i*360 - (1-Math.min(p,1))*400, 470 + float(t,i)); });
    world.innerHTML = h; },
};
function show(id, params) { SCENE = SCENES[id]; P = params || {}; }
function render(t) { SCENE(t, P.T || 6); document.getElementById('grain').style.transform = `translate(${(t*37)%40-20}px,${(t*23)%40-20}px)`; }
</script>
</body>
