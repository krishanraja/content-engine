<!doctype html>
<meta charset="utf-8">
<!-- The Queue, a concept mock for Codex: paper work orders slide along a dispatch rail, stop at the lilac line, and
     go through only when the mint YES is stamped. render(t) draws the scene at t seconds; ?shape=tall for 9:16. -->
<style>
@font-face{font-family:Anton;src:url('../../../../../assets/fonts/makeyourmindup/Anton-Regular.ttf')}
@font-face{font-family:Archivo;src:url('../../../../../assets/fonts/makeyourmindup/Archivo-Variable.ttf')}
@font-face{font-family:Plex;src:url('../../../../../assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf')}
:root{--ink:#0C1512;--deep:#070D0B;--cream:#F4EFE4;--mint:#7EF0C0;--lilac:#B7A6FF}
html,body{margin:0;background:var(--ink);overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  background:radial-gradient(1200px 700px at 62% 42%, #1d2a2e 0%, var(--ink) 55%, var(--deep) 100%)}
#grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:screen;pointer-events:none}
.wm{position:absolute;left:56px;top:46px;font:48px Anton;color:var(--cream);letter-spacing:.5px;z-index:9}
.wm b{color:var(--mint);font-weight:400}
.pill{position:absolute;right:56px;top:52px;font:26px Plex;background:var(--lilac);color:var(--ink);padding:6px 18px;border-radius:999px;z-index:9}
#world{position:absolute;inset:0;transform-origin:62% 55%}
.rail{position:absolute;left:-200px;right:-200px;top:842px;height:14px;border-radius:7px;
  background:linear-gradient(#cfc8b8,#8f897b 55%,#5d5a51);box-shadow:0 10px 24px rgba(0,0,0,.55)}
.rail::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.35) 46px 48px);border-radius:7px}
.line{position:absolute;left:1408px;top:330px;width:10px;height:560px;background:var(--lilac);border-radius:5px;
  box-shadow:0 0 40px rgba(183,166,255,.55)}
.line span{position:absolute;top:-46px;left:50%;transform:translateX(-50%);font:22px Plex;color:var(--lilac);white-space:nowrap;letter-spacing:2px}
.clip{position:absolute;top:822px;width:40px;height:54px;margin-left:-20px;border-radius:6px;
  background:linear-gradient(#e9e4d8,#9b9586);box-shadow:0 6px 10px rgba(0,0,0,.5)}
.order{position:absolute;top:400px;width:330px;height:420px;margin-left:-165px;transform-origin:50% -60px;
  background:url('../../../../../assets/plates/two-passports/paper.jpg') center/cover, var(--cream);
  background-blend-mode:multiply;border-radius:6px;color:var(--ink);
  box-shadow:0 30px 60px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.4) inset}
.order .band{height:62px;border-radius:6px 6px 0 0;background:url('../../../../../assets/plates/two-passports/guilloche.svg') center/cover, #d9d1bf;opacity:.85}
.order .no{position:absolute;top:18px;left:22px;font:20px Plex;letter-spacing:2px}
.order h3{margin:26px 22px 0;font:800 40px/1.05 Archivo}
.order .from{position:absolute;left:22px;bottom:92px;display:flex;gap:12px;align-items:center;font:20px Plex}
.order .from img{width:44px;height:44px}
.order .slot{position:absolute;right:20px;bottom:18px;width:150px;height:62px;border:3px dashed rgba(12,21,18,.45);border-radius:10px;
  font:24px Plex;color:rgba(12,21,18,.55);display:flex;align-items:center;justify-content:center;letter-spacing:2px}
.order .slot.left{left:20px;right:auto;width:110px}
.stamp{position:absolute;right:8px;bottom:6px;width:174px;height:86px;border:7px solid var(--mint);border-radius:14px;color:var(--mint);
  font:64px/72px Anton;text-align:center;letter-spacing:4px;background:rgba(126,240,192,.14);opacity:0;mix-blend-mode:normal;
  filter:drop-shadow(0 0 18px rgba(126,240,192,.55))}
.ink{position:absolute;right:6px;bottom:4px;width:180px;height:92px;border-radius:16px;background:radial-gradient(circle,rgba(126,240,192,.6),transparent 70%);opacity:0}
body.tall #stage{width:1080px;height:1920px}
</style>
<body>
<div id="stage">
  <svg id="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="wm">make<b>your</b>mind<b>up</b></div><div class="pill">under.the.hood</div>
  <div id="world">
    <div class="rail" id="rail"></div>
    <div class="line"><span>WAITS FOR YOUR YES</span></div>
    <div id="orders"></div>
  </div>
</div>
<script>
const L = '../logos/';
const ORDERS = [
  {no:'01', title:'Send a message', from:'gmail.svg', app:'GMAIL'},
  {no:'02', title:'Make a payment', from:null, app:'PAYMENT'},
  {no:'03', title:'Sign a document', from:null, app:'SIGNATURE'},
  {no:'04', title:'Delete anything', from:null, app:'FILES'},
];
const tall = new URLSearchParams(location.search).get('shape') === 'tall';
if (tall) document.body.classList.add('tall');
const box = document.getElementById('orders');
ORDERS.forEach(o => {
  const el = document.createElement('div'); el.className = 'order';
  el.innerHTML = `<div class="band"></div><div class="no">WORK ORDER ${o.no}</div><h3>${o.title}</h3>
    <div class="from">${o.from ? `<img src="${L}${o.from}">` : ''}${o.app}</div>
    <div class="slot left">NO</div><div class="slot">YES</div><div class="ink"></div><div class="stamp">YES</div>`;
  const clip = document.createElement('div'); clip.className = 'clip';
  box.appendChild(clip); box.appendChild(el); o.el = el; o.clip = clip;
});
// the brand's enter curve, cubic-bezier(0.05, 0.7, 0.1, 1.0)
function bez(x1,y1,x2,y2){return t=>{if(t<=0)return 0;if(t>=1)return 1;let lo=0,hi=1,m;for(let i=0;i<30;i++){m=(lo+hi)/2;const x=3*(1-m)**2*m*x1+3*(1-m)*m*m*x2+m**3;if(x<t)lo=m;else hi=m}return 3*(1-m)**2*m*y1+3*(1-m)*m*m*y2+m**3}}
const enter = bez(.05,.7,.1,1), exit = bez(.3,0,.8,.15);
const clamp = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const LINE = 1408, GAP = 370, STAMP_AT = 3.3, OUT_AT = 3.9, ADV_AT = 4.25;
function render(t){
  // the camera never rests: a slow push and drift across the whole shot
  const cam = 1 + 0.06 * clamp(t/6.5);
  document.getElementById('world').style.transform = `scale(${cam}) translateX(${-30*clamp(t/6.5)}px)`;
  document.getElementById('rail').style.backgroundPositionX = `${t*40}px`;
  ORDERS.forEach((o,i) => {
    // each order slides in from the left in turn and queues behind the line
    const start = 0.25 + i*0.42, p = enter(clamp((t-start)/0.75));
    let slot = LINE - 210 - i*GAP;                      // queue position, first at the line
    if (t > ADV_AT && i > 0) slot += GAP * enter(clamp((t-ADV_AT)/0.6));  // the queue moves up one
    let x = -400 + (slot + 400) * p;
    // order 01 gets its yes, crosses the line and leaves
    if (i === 0 && t > OUT_AT) x = slot + 900 * exit(clamp((t-OUT_AT)/0.55));
    const sway = Math.sin(t*2.1 + i) * 1.6 * (1 - clamp((t-start)/1.2)) + Math.sin(t*1.3+i)*0.6;
    o.el.style.left = x + 'px'; o.clip.style.left = x + 'px';
    o.el.style.transform = `rotate(${sway}deg)`;
    if (i === 0) {
      const s = clamp((t-STAMP_AT)/0.17);                // five frames: the stamp slaps on
      const st = o.el.querySelector('.stamp'), ink = o.el.querySelector('.ink');
      st.style.opacity = s; o.el.querySelector('.slot:not(.left)').style.opacity = 1 - s; st.style.transform = `scale(${1.6 - 0.6*enter(s)}) rotate(${-8 + 4*s}deg)`;
      ink.style.opacity = clamp((t-STAMP_AT)/0.1) * (1 - clamp((t-STAMP_AT-0.1)/0.5)) ;
    }
  });
}
render(0);
</script>
</body>
