<!doctype html>
<meta charset="utf-8">
<!-- Wednesday 4 Nov (Claude Duet) rebuild, both cuts, in the approved Monday proof's style (Krish, 2026-10-31: "Good,
     build all four this way"). render(t) draws one frame of one layer: "bg" sits behind his face and the phone footage,
     "fg" over them. compose.py injects the cut's timeline (timeline.py) with init(tl) before the first frame. -->
<style>
@font-face{font-family:Anton;src:url('../../../../assets/fonts/makeyourmindup/Anton-Regular.ttf')}
@font-face{font-family:Archivo;src:url('../../../../assets/fonts/makeyourmindup/Archivo-Variable.ttf')}
@font-face{font-family:Plex;src:url('../../../../assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf')}
@font-face{font-family:Fraunces;src:url('../../../../assets/fonts/makeyourmindup/Fraunces-Italic-Variable.ttf');font-style:italic}
html,body{margin:0;overflow:hidden;background:transparent}
.L{position:absolute;inset:0;overflow:hidden}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.anton{font-family:Anton;line-height:.92;text-transform:uppercase}
.mono{font-family:Plex;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.arch{font-family:Archivo;font-weight:900}
.hl{display:inline-block;position:relative;z-index:0}
.hl::before{content:'';position:absolute;left:-6px;right:-6px;top:6%;bottom:2%;background:var(--hl,#B7A6FF);z-index:-1;transform-origin:left;transform:scaleX(var(--k,1))}
.paper{background:#ece6d6 url('../../../../assets/plates/two-passports/paper.jpg') center/320px;color:#0C1512}
.pill{display:inline-block;font:500 22px Plex;letter-spacing:2px;border:3px solid #0C1512;border-radius:999px;padding:4px 14px;color:#0C1512}
.pill.on{background:#7EF0C0}
.logo{display:block;object-fit:contain}
#grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='3'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
#cap{position:absolute;text-align:center}
#cap span{font:900 var(--cs,50px) Archivo;color:#F4EFE4;background:#0C1512;padding:8px 20px 10px;box-shadow:var(--sh,8px) var(--sh,8px) 0 #B7A6FF;-webkit-box-decoration-break:clone;box-decoration-break:clone;line-height:1.55}
</style>
<div class="L" id="root"><div id="cam"></div><div id="grain"></div><div id="corners"></div><div id="cap"></div></div>
<script>
const Q=new URLSearchParams(location.search), LAYER=Q.get('layer')||'fg';
const WM='../../../../.cache/makeyourmindup/wordmark.png', LOGO=n=>`../imagery/logos/${n}.svg`, PAGE=n=>`../imagery/pages/${n}.png`;
const INK='#0C1512',CREAM='#F4EFE4',LIL='#B7A6FF',MINT='#7EF0C0',DIM='#5b625e';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const W=(t,a,d)=>eo((t-a)/d), B=(t,a,d)=>back((t-a)/d), lerp=(a,b,k)=>a+(b-a)*k;
let TL=null,VW=1920,VH=1080,V=false,PHR=[];
function init(tl){TL=tl;VW=tl.W;VH=tl.H;V=tl.fmt==='9x16';
  document.documentElement.style.width=document.body.style.width=VW+'px';document.documentElement.style.height=document.body.style.height=VH+'px';
  const brk=w=>/[.,?!:;]$/.test(w);let cur=[];PHR=[];
  for(const w of tl.words){cur.push(w);if(brk(w[0])||cur.length>=(V?5:6)){PHR.push(cur);cur=[]}}if(cur.length)PHR.push(cur);
  const cap=document.getElementById('cap');
  if(V){cap.style.left='40px';cap.style.width='880px';cap.style.top='1290px';cap.style.setProperty('--cs','58px');cap.style.setProperty('--sh','12px')}
  else{cap.style.left='0';cap.style.right='0';cap.style.bottom='58px';cap.style.setProperty('--cs','50px');cap.style.setProperty('--sh','8px');cap.style.whiteSpace='nowrap'}}
function segAt(t){const S=TL.segs;for(let i=S.length-1;i>=0;i--)if(t>=S[i].a)return i;return 0}
const isPhone=s=>s&&s.pic==='phone';
// a quantity that follows each segment's target, eased over d seconds from the segment start
function follow(t,target,d=0.5){const S=TL.segs,i=segAt(t),cur=target(S[i],t),prev=i>0?target(S[i-1],t):cur;return lerp(prev,cur,W(t,S[i].a,d))}
// a full-frame panel's horizontal offset (slides in from the right, out to the left); the compositor uses the same rule
const isFull=q=>q&&q.mode==='full';
function nb(s){const i=TL.segs.indexOf(s);return [TL.segs[i-1],TL.segs[i+1]]}
function panelX(t,s){const [p,n]=nb(s);const inn=isFull(p)?1:W(t,s.a,0.42),out=(!isFull(n)&&t>s.b-0.36)?W(t,s.b-0.36,0.36):0;return (1-inn)*VW-out*VW}
function caps(t){const el=document.getElementById('cap');if(LAYER!=='fg'||t<3.0){el.innerHTML='';return}
  const s=TL.segs[segAt(t)];if(s.mode==='close'&&t>s.a+0.5){el.innerHTML='';return}
  let p=null;for(let i=0;i<PHR.length;i++){const st=PHR[i][0][1]-0.05,e=(PHR[i+1]?PHR[i+1][0][1]:st+4)-0.05;if(t>=st&&t<e&&t<PHR[i][PHR[i].length-1][1]+1.6){p=PHR[i];break}}
  if(!p){el.innerHTML='';return} const shown=p.filter(w=>t>=w[1]-0.03).map(w=>w[0]);el.innerHTML=shown.length?'<span>'+shown.join(' ')+'</span>':''}
function camera(t){let x=Math.sin(t*.37)*7,y=Math.cos(t*.29)*5,s=1.012+Math.sin(t*.21)*.008;
  for(const k of (TL.shakes||[])){const q=clamp(1-(t-k)/0.45);if(t>=k&&q>0){x+=12*q*Math.sin((t-k)*70);y+=8*q*Math.cos((t-k)*63)}}
  return `translate(${x}px,${y}px) scale(${s})`}
const html=[];const put=s=>html.push(s);
const env=(t,s,di=0.45,dout=0.35)=>({inn:B(t,s.a,di),fade:W(t,s.a,0.25)*(t>s.b-dout?1-W(t,s.b-dout,dout):1)});
const strip=(txt,x,y,o,col=LIL,size=24)=>`<div class="abs mono" style="left:${x}px;top:${y}px;font-size:${size}px;background:${col};color:${INK};padding:8px 16px;opacity:${o};white-space:nowrap;box-shadow:5px 5px 0 ${INK}">${txt}</div>`;
const src=(txt,x,y,o)=>`<div class="abs mono" style="left:${x}px;top:${y}px;font-size:20px;color:${INK};background:${CREAM};padding:6px 12px;opacity:${o};white-space:nowrap;text-transform:none;letter-spacing:.5px">${txt}</div>`;
function workOrder(n,title,tag,x,y,rot,yes,sc=1,logo){ // a paper work order from the queue plate
  return `<div class="abs paper" style="left:${x}px;top:${y}px;width:${230*sc}px;height:${300*sc}px;transform:rotate(${rot}deg);transform-origin:50% -20px;box-shadow:0 18px 30px rgba(0,0,0,.5)">
   <div class="mono" style="position:absolute;left:${14*sc}px;top:${14*sc}px;font-size:${15*sc}px">WORK ORDER 0${n}</div><div style="position:absolute;left:0;right:0;top:${40*sc}px;height:2px;background:rgba(12,21,18,.25)"></div>
   <div class="arch" style="position:absolute;left:${14*sc}px;top:${56*sc}px;width:${200*sc}px;font-size:${31*sc}px;line-height:1.05">${title}</div>
   ${logo?`<img src="${LOGO(logo)}" style="position:absolute;left:${14*sc}px;top:${190*sc}px;width:${26*sc}px;height:${26*sc}px">`:''}
   <div class="mono" style="position:absolute;left:${(logo?48:14)*sc}px;top:${194*sc}px;font-size:${14*sc}px">${tag}</div>
   <div style="position:absolute;left:${14*sc}px;top:${232*sc}px;width:${90*sc}px;height:${48*sc}px;border:2px dashed rgba(12,21,18,.5);font:500 ${18*sc}px Plex;display:flex;align-items:center;justify-content:center">NO</div>
   <div style="position:absolute;left:${118*sc}px;top:${232*sc}px;width:${96*sc}px;height:${48*sc}px;border:2px dashed rgba(12,21,18,.5);font:500 ${18*sc}px Plex;display:flex;align-items:center;justify-content:center">YES</div>
   ${yes>0?`<div class="anton" style="position:absolute;left:${110*sc}px;top:${222*sc}px;width:${112*sc}px;height:${64*sc}px;background:${MINT};border:4px solid ${INK};font-size:${48*sc}px;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg) scale(${2.4-1.4*yes});opacity:${clamp(yes*3)}">YES</div>`:''}</div>`}
function tile(logo,x,y,sz,rot=0,o=1){return `<div class="abs paper" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:${sz*.16}px;transform:rotate(${rot}deg);opacity:${o};box-shadow:0 14px 24px rgba(12,21,18,.35);display:flex;align-items:center;justify-content:center"><img class="logo" src="${LOGO(logo)}" style="width:${sz*.58}px;height:${sz*.58}px"></div>`}
// ---------------- the opener (3 s, music only): the chat box that waited, then the work that turns up on its own ----------------
function opener(t){if(t>=3.1)return;const out=t>2.55?W(t,2.55,0.5):0;
  put(`<div class="abs" style="left:0;top:0;width:${VW}px;height:${VH}px;background:${INK};transform:translateX(${-out*VW}px)">`);
  const bx=V?90:150,by=V?250:170,bw=V?900:760;
  // the old way: an empty chat box with a blinking cursor, waiting; it is shoved aside at 1.1 s
  const shove=W(t,1.05,0.35),blink=(Math.floor(t*3)%2)?1:0;
  put(`<div class="abs" style="left:${bx}px;top:${by}px;width:${bw}px;height:${V?130:120}px;border:4px solid ${DIM};border-radius:28px;transform:translateY(${shove*(V?-60:-40)}px) scale(${1-.12*shove});opacity:${1-.65*shove}">
    <div style="position:absolute;left:34px;top:${V?36:32}px;width:5px;height:${V?56:52}px;background:${CREAM};opacity:${blink*(1-shove)}"></div>
    <div class="mono" style="position:absolute;right:30px;top:${V?44:40}px;font-size:24px;color:${DIM}">YOU ASK</div></div>`);
  // the rail and the lilac line; a work order slides in by itself and stops; the YES slaps on
  const ry=V?1520:780,lx=V?930:1700;
  put(`<div class="abs" style="left:0;top:${ry}px;width:${VW}px;height:6px;background:${CREAM};opacity:${W(t,0.25,.4)*.8}"></div>`);
  put(`<div class="abs" style="left:${lx}px;top:${ry-(V?420:400)}px;width:8px;height:${V?470:450}px;background:${LIL};opacity:${W(t,0.35,.3)}"></div>`);
  const arr=W(t,0.95,0.42),sc=V?1.25:1.1,ox=lx-20-230*sc;
  put(workOrder(1,'Send a message','GMAIL',lerp(-320,ox,arr),ry-300*sc-6,(1-arr)*-8+Math.sin(t*5)*1.2*(1-W(t,1.4,1)),W(t,1.55,0.18)*(t>=1.55?1:0),sc,'gmail'));
  const sl=B(t,1.35,0.32),tx=V?80:150,ty=V?520:330,fs=V?150:160;
  put(`<div class="abs anton" style="left:${tx}px;top:${ty}px;font-size:${fs}px;white-space:nowrap;color:${CREAM};transform:scale(${2.1-1.1*sl});transform-origin:left center;opacity:${clamp((t-1.35)/0.08)}">AI now</div>`);
  put(`<div class="abs anton" style="left:${tx}px;top:${ty+fs*.98}px;font-size:${fs}px;white-space:nowrap;opacity:${clamp((t-1.6)/0.08)}"><span class="hl" style="--k:${W(t,1.6,0.3)};color:${INK}">acts first.</span></div>`);
  put(`<div class="abs" style="left:${tx+6}px;top:${ty+fs*2.05}px;font:italic ${V?40:44}px Fraunces,Georgia,serif;color:${CREAM};opacity:${W(t,1.95,0.35)}">Claude Duet, research preview, October 2026.</div>`);
  put('</div>')}
// ---------------- the close: the one question, the wordmark, the address ----------------
function closer(t,s){const inn=W(t,s.a,0.5),pu=1+.07*W(t,s.a,TL.dur-s.a);
  put(`<div class="abs" style="left:${(1-inn)*VW}px;top:0;width:${VW}px;height:${VH}px;background:${LIL}"><div class="abs" style="inset:0;transform:scale(${pu}) rotate(${Math.sin(t*.7)*.6}deg);transform-origin:40% 45%">`);
  const fl=Math.sin(t*1.3)*12,q=B(t,s.a+0.35,0.5),qx=V?80:140,qy=V?300:170,fs=V?118:118;
  put(`<div class="abs anton" style="left:${qx}px;top:${qy+fl}px;width:${V?920:1160}px;font-size:${fs}px;color:${INK};transform:scale(${1.6-.6*q});transform-origin:left top;opacity:${clamp((t-s.a-0.35)/0.1)}">Which job only gets done when someone <span class="hl" style="--hl:${CREAM};--k:${W(t,s.a+0.9,0.4)}">nudges you?</span></div>`);
  const c=B(t,s.a+1.1,0.6),cx=V?80:1100,cy=V?1180:660;
  put(`<div class="abs" style="left:${cx+(1-c)*800}px;top:${cy-fl}px;width:${V?700:680}px;height:${V?250:250}px;background:${INK};border-radius:22px;box-shadow:14px 14px 0 rgba(12,21,18,.25);transform:rotate(${-2+Math.sin(t*.8)}deg)">
    <img src="${WM}" style="position:absolute;left:44px;top:50px;width:${V?600:580}px"><div class="mono" style="position:absolute;left:46px;top:${V?160:156}px;font-size:${V?40:38}px;color:${CREAM};text-transform:none;letter-spacing:0">makeyourmindup.ai</div></div>`);
  put(`<div class="abs mono" style="left:${V?80:140}px;top:${V?1500:900}px;font-size:28px;color:${INK};background:${CREAM};border:4px solid ${INK};border-radius:40px;padding:10px 26px;box-shadow:6px 6px 0 ${INK};transform:rotate(${-3+Math.sin(t*.9)*1.5}deg) scale(${B(t,s.a+1.5,.5)})">THE FULL DEEP DIVE</div>`);
  put('</div></div>')}
// ---------------- the branded frame (16:9): series tag, title, sticker, the WEDNESDAYS card ----------------
function brandFrame(t){const show=follow(t,s=>s.mode==='face'?1:0,0.5)*(t<2.5?0:1);if(show<0.01)return;
  const a=1,b=1,c=1,d=1,fl=Math.sin(t*1.3)*4,sx=(1-show)*-760;
  const s=TL.segs[segAt(t)],tag=null,tg=tag?W(t,s.a+0.25,0.35)*(t>s.b-0.3?1-W(t,s.b-0.3,0.3):1):0;
  put(`<div class="abs mono" style="left:${66-(1-a)*500+sx}px;top:${330+fl}px;font-size:30px;color:${LIL};background:${INK};padding:8px 18px">UNDER.THE.HOOD</div>`);
  put(`<div class="abs anton" style="left:${66-(1-b)*600+sx}px;top:${400+fl*.6}px;width:560px;font-size:72px;color:${INK}">AI used to reply. Now it <span class="hl" style="--hl:${CREAM};--k:1">acts first.</span></div>`);
  put(`<div class="abs mono" style="left:${66+sx-tg*700}px;top:${760+fl*1.2}px;transform:rotate(${-3+Math.sin(t*.9)*1.5}deg) scale(${c});font-size:28px;color:${INK};background:${CREAM};border:4px solid ${INK};border-radius:40px;padding:12px 26px;box-shadow:7px 7px 0 ${INK};white-space:nowrap">SCREWDRIVER INCLUDED</div>`);
  if(tg>0)put(`<div class="abs mono" style="left:${66+sx+(1-tg)*-700}px;top:${760+fl}px;font-size:${tag.length>28?21:26}px;color:${MINT};background:${INK};padding:12px 20px;white-space:nowrap;box-shadow:7px 7px 0 ${CREAM}">${tag}</div>`);
  put(`<div class="abs" style="left:${1340+(1-d)*700-sx}px;top:${380-fl}px;width:510px;height:310px;background:${INK};border-radius:22px;box-shadow:14px 14px 0 rgba(12,21,18,.25)">
    <img src="${WM}" style="position:absolute;left:38px;top:44px;width:430px"><div class="anton" style="position:absolute;left:38px;top:118px;font-size:92px;color:${LIL}">Wednesdays</div>
    <div class="mono" style="position:absolute;left:40px;top:236px;font-size:30px;color:${CREAM};text-transform:none;letter-spacing:0">makeyourmindup.ai</div></div>`)}
// ---------------- the vertical's top card (above his head, never over his face) ----------------
function topCard(t,s){const e=env(t,s,0.45,0.35);
  if(s.pic==='brand'){const a=B(t,Math.max(s.a,3.0),0.55),fl=Math.sin(t*1.3)*3,out=t>s.b-0.4?W(t,s.b-0.4,0.4):0;
    put(`<div class="abs" style="left:${60-(1-a)*900-out*900}px;top:${150+fl}px;width:760px;background:${LIL};padding:22px 28px 24px;transform:rotate(-1.5deg);box-shadow:10px 10px 0 ${INK}">
      <div class="mono" style="display:inline-block;font-size:22px;color:${LIL};background:${INK};padding:5px 12px">UNDER.THE.HOOD</div>
      <div class="anton" style="font-size:66px;color:${INK};margin-top:12px">AI used to reply. Now it <span class="hl" style="--hl:${CREAM};--k:${W(t,3.9,0.5)}">acts first.</span></div></div>`);
    put(`<div class="abs mono" style="left:${600+(1-B(t,4.0,.5))*700+out*700}px;top:${330+fl*1.4}px;font-size:22px;color:${INK};background:${CREAM};border:4px solid ${INK};border-radius:30px;padding:8px 18px;transform:rotate(${-4+Math.sin(t*.9)*1.5}deg);box-shadow:5px 5px 0 ${INK};white-space:nowrap">SCREWDRIVER INCLUDED</div>`);return}
  if(s.ms&&t>=s.tagAt-0.1){const k=B(t,s.tagAt,0.45),out=t>s.b-0.35?W(t,s.b-0.35,0.35):0;
    put(`<div class="abs" style="left:${70-(1-k)*900-out*900}px;top:${150+Math.sin(t*1.2)*4}px;display:flex;align-items:center;gap:22px;background:${CREAM};border:6px solid ${INK};padding:14px 26px;box-shadow:10px 10px 0 ${LIL};transform:rotate(-2deg)"><img src="${LOGO('microsoft-365')}" style="width:90px;height:90px"><div><div class="arch" style="font-size:40px;color:${INK}">Microsoft 365 email</div><div class="anton" style="font-size:84px;color:${INK}">Not yet</div></div></div>`)}
  if(false&&s.tag&&t>=s.tagAt-0.1){const k=B(t,s.tagAt,0.4),out=t>s.b-0.35?W(t,s.b-0.35,0.35):0;
    put(`<div class="abs mono" style="left:${60-(1-k)*900-out*900}px;top:${170+Math.sin(t*1.2)*3}px;max-width:820px;font-size:32px;line-height:1.3;color:${MINT};background:${INK};padding:16px 24px;box-shadow:8px 8px 0 ${LIL};transform:rotate(-1.2deg)">${s.tag}</div>`)}
  if(false&&s.bar){const f=clamp((t-s.bar.at)/(s.bar.full-s.bar.at+0.6)),out=t>s.b-0.35?W(t,s.b-0.35,0.35):0;
    put(`<div class="abs" style="left:${60-out*900}px;top:290px;width:820px;height:46px;border:4px solid ${INK};background:${CREAM};opacity:${W(t,s.bar.at,.3)}"><div style="height:100%;width:${f*100}%;background:${LIL}"></div></div>`)}}
// ---------------- the pictures ----------------
const P={};
P.logos=(t,s)=>{const e=env(t,s),ev=s.ev,ry=700,x0=700;
  put(`<div class="abs" style="left:660px;top:${ry}px;width:1200px;height:8px;background:${INK};opacity:${e.fade}"></div>`);
  put(`<div class="abs" style="left:1800px;top:${ry-330}px;width:10px;height:380px;background:${INK};opacity:${e.fade}"></div>`);
  for(let k=0;k<14;k++){const xx=660+((k*90-(t*120)%90)+1200)%1200;put(`<div class="abs" style="left:${xx}px;top:${ry+8}px;width:4px;height:16px;background:${INK};opacity:${.5*e.fade}"></div>`)}
  [['gmail',Math.min(ev.email,s.a+0.5)],['google-calendar',ev.cal],['slack',ev.slack]].forEach(([n,at],i)=>{if(t<at-0.3)return;const d=B(t,at-0.15,0.45),ride=Math.max(0,t-at)*26;
    put(tile(n,x0+i*260+ride,ry-220-(1-d)*500,200,Math.sin(t*2+i)*3*(1-W(t,at,1.5))+Math.sin(t*1.1+i)*1.5,e.fade))});
  if(t>=ev.more-0.2){const k=W(t,ev.more,1.0),n=Math.round(6000*k);
    put(`<div class="abs" style="left:700px;top:${780+(1-B(t,ev.more,.4))*80}px;background:${INK};padding:16px 26px;opacity:${e.fade};box-shadow:8px 8px 0 ${CREAM}"><span class="anton" style="font-size:96px;color:${MINT}">${n.toLocaleString('en-GB')}${k>=1?'+':''}</span><span class="anton" style="font-size:96px;color:${CREAM};margin-left:24px">connectors</span></div>`)}
};
P.queue=(t,s)=>{const ev=s.ev,px=panelX(t,s);
  put(`<div class="abs" style="left:${px}px;top:0;width:${VW}px;height:${VH}px;background:${INK}">`);
  const push=1+W(t,s.a,s.b-s.a)*.08,orders=[['Send a message','GMAIL','gmail',ev.send],['Make a payment','PAYMENT',null,ev.pay],['Sign a document','SIGNATURE',null,ev.sign],['Delete anything','DELETE',null,ev.delete]];
  if(!V){const ry=780,lx=1640;
