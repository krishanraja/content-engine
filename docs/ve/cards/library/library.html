function artFrame(item,previewWidth){
 const {id,name,width,height}=item;
 return `<svg class="art" role="img" aria-label="${esc(name)}" xmlns="http://www.w3.org/2000/svg" width="${previewWidth||width}" height="${previewWidth?previewWidth*height/width:height}" viewBox="0 0 ${width} ${height}" data-item="${id}" data-preview="${previewWidth||0}"></svg>`
}
function fitFrames(){
 for(const svg of main.querySelectorAll('svg[data-item]')){
  const probe=document.createElementNS(svg.namespaceURI,'text');
  probe.style.visibility='hidden';
  svg.prepend(probe);
  const item=items.find(row=>row.id===svg.dataset.item);
  probe.insertAdjacentHTML('beforebegin',art(item,Number(svg.dataset.preview),probe));
  probe.remove()
 }
}
function art(item,previewWidth,probe){
 const {width:W,height:H,layout:k,id}=item;
 if(k==='bio'){
  if(item.wordmarks!==0 || item.headline!==brandHeadline)throw Error(id+' invalid bio');
  const rows=item.surfaces.map(surface=>`<section><strong>${esc(surface)}</strong><p>${esc(item.headline)}<br/><a href="${esc(item.subscribe_url)}">${esc(item.subscribe_line)}</a></p></section>`).join('');
  return `<foreignObject width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="padding:32px;font:24px/1.4 sans-serif;background:white;color:black">${rows}</div></foreignObject>`
 }
 const canvas=grid.canvases[W+'x'+H], zones=canvas.profiles[item.grid_profile].safe_zones;
 const [X,Y,B,C]=zones.content_box, unit=Math.min(B,C), u=canvas.baseline_px;
 const gutter=canvas.gutter_px, column=(B-(grid.columns-1)*gutter)/grid.columns;
 const snap=(v,origin)=>origin+Math.round((v-origin)/u)*u;
 const col=n=>X+n*(column+gutter);

  const n=Math.round((v-X)/(column+gutter));
  return Math.abs(col(n)-v)<u ? col(n) : snap(v,X)

 let slotIndex=0, out='', refusals=[];

  // Keep bleed edges and platform masks exact. Snap internal edges to the canvas grid.
  const horizontal=v=>v===0||v===W?v:left(v);
  const vertical=v=>v===0||v===H?v:snap(v,Y);
  const l=horizontal(x), t=vertical(y);
  return [l,t,horizontal(x+w)-l,vertical(y+h)-t]
 }
 function slot(){const name=slots[slotIndex++];return [name,item.slots[name]]}
 function refuse(name,reason){
  const rule=name+' '+reason;
  if(!stress || !previewWidth)throw Error(id+' '+rule);
  refusals.push({name,reason:rule})
 }
 function longCopy(limit,lineCount,isQuestion){
  const words='How much does a play count when the song ends early and who decides'.split(' ');
  const ending=isQuestion?'?':'';
  let copy='';
  for(let i=0;;i++){
   const word=words[i%words.length];
   const next=copy?copy+' '+word:word;
   if(next.length+ending.length>limit)break;
   copy=next
  }
  const chars=(copy+ending).split('');
  const spaces=chars.flatMap((ch,i)=>ch===' '?[i]:[]);
  for(let n=1;n<lineCount && spaces.length;n++){
   const target=n*chars.length/lineCount;
   const at=spaces.reduce((a,b)=>Math.abs(a-target)<Math.abs(b-target)?a:b);
   chars[at]='\n';spaces.splice(spaces.indexOf(at),1)
  }
  return chars.join('')
 }
 function box(x,y,w,h,c,grain=false){out+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;if(grain)out+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#grain)" opacity="${c===ink?.07:.12}"/>`}
 function label(str,x,y,width,height,size,font='Mono',color=cream,italic=false,bottom=false){
  const [name,rule]=slot(), role=rule.role;
  if(['headline','body','source','figure'].includes(role)){
   if(stress==='long')str=longCopy(rule.max_chars,rule.max_lines,str.trimEnd().endsWith('?'));
   if(stress==='short')str=role==='body'?'It counts.':'Play counts';
   if(stress==='word' && role==='headline')str='Disintermediation';
   if(stress==='numbers' && role==='figure')str='£1.2bn'
  }
  str=window.libraryContent?.[id]?.[name] ?? str;
  const normalized=str.replace(/\s+/g,' ').toLowerCase();
  if(normalized.includes(brandHeadline.toLowerCase()) && !(name==='body_1' && ['desktop','mobile'].includes(k)))throw Error(id+' misplaced brand headline');
  if([...str].length>rule.max_chars){refuse(name,'max_chars');return y}
  const tracked=role==='label'||role==='source';
  if(tracked)font='Mono';
  if(tracked||font==='Anton')str=str.toUpperCase();
  const right=x+width, last=y+height;
  x=left(x); y=snap(y,Y); width=right-x;
  height=bottom?height:last-y;
  function layout(size){
   probe.setAttribute('font-family',font);
   probe.setAttribute('font-weight',font==='Fraunces'?500:400);
   probe.setAttribute('font-style',italic?'italic':'normal');
   probe.setAttribute('font-size',size);
   const tracking=tracked?size*.04:0;
   probe.style.letterSpacing=tracking+'px';
   const style=getComputedStyle(probe);
   ctx.font=[style.fontStyle,style.fontWeight,style.fontSize,style.fontFamily].join(' ');
   const cache=new Map();
   function measure(line){
    if(cache.has(line))return cache.get(line);
    probe.textContent=line;
    const box=probe.getBBox(), glyphs=ctx.measureText(line);
    const spacing=tracking*Math.max(0,[...line].length-1);
    const inset=Math.max(0,-box.x,glyphs.actualBoundingBoxLeft);
    const extent=inset+Math.max(glyphs.width+spacing,box.x+box.width,glyphs.actualBoundingBoxRight+spacing);
    const result={extent,inset,ascent:glyphs.actualBoundingBoxAscent,descent:glyphs.actualBoundingBoxDescent};
    cache.set(line,result);
    return result
   }
   const lines=[];
   for(const paragraph of str.trim().split(/\r?\n/)){
    let line='';
    for(const word of paragraph.trim().split(/\s+/)){
     const joined=line?line+' '+word:word;
     if(line && measure(joined).extent>width){lines.push(line);line=word}
     else line=joined
    }
    lines.push(line)
   }
   const metrics=lines.map(measure), leading=Math.ceil(size*1.18/u)*u;
   const ascent=Math.max(...metrics.map((m,i)=>m.ascent-i*leading));
   const below=Math.max(...metrics.map((m,i)=>m.descent+i*leading));
   return {lines,metrics,leading,ascent,below,tracking,valid:lines.length<=rule.max_lines &&
    ascent+below<=height && metrics.every(m=>m.extent<=width)}
  }
  size=rule.max_size_px;
  let fit=layout(size);
  while(!fit.valid && size>rule.min_size_px){
   size=Math.max(rule.min_size_px,size-rule.step_px);fit=layout(size)
  }
  if(!fit.valid){refuse(name,fit.lines.length>rule.max_lines?'max_lines at minimum size':'cannot fit at minimum size');return y}
  const baseline=bottom?y-fit.below:y+fit.ascent;
  fit.lines.forEach((line,i)=>{
   const content=k==='captions' && line==='at 30 seconds'?'at <tspan fill="'+mint+'">30</tspan> seconds':esc(line);
   out+=`<text data-template="${id}" data-slot="${name}" letter-spacing="${fit.tracking}" data-bounds="${x} ${bottom?y-height:y} ${width} ${height}" x="${x+fit.metrics[i].inset}" y="${baseline+i*fit.leading}" fill="${color}" font-family="${font}" font-size="${size}" font-weight="${font==='Fraunces'?500:400}" font-style="${italic?'italic':'normal'}">${content}</text>`
  });

 }
 function mark(kind,x,y,w,h){if(!['s3h','d','v4'].includes(kind))[x,y,w,h]=frame(x,y,w,h);const dims=document.getElementById(kind).getAttribute('viewBox').split(' ').map(Number);const ratio=dims[2]/dims[3];w=Math.min(w,h*ratio);h=w/ratio;out+=`<use href="#${kind}" x="${x}" y="${y}" width="${w}" height="${h}" color="${cream}" fill="${mint}"/>`}
 function photo(name,x,y,w,h,burn=false){
  if(k!=='highlight')[x,y,w,h]=frame(x,y,w,h);
  const [slotName]=slot();
  const content=window.libraryContent?.[id] || {};
  if(Object.hasOwn(content,slotName))name=content[slotName];
  if(stress==='brightphoto')name='still-record-phone';
  if(stress==='nophoto'||!photos[name]||missingPhotos.has(name)){box(x,y,w,h,ink,true);return}
  box(x,y,w,h,ink,true);
  const {width:sw,height:sh,focus:f}=photos[name];
  const upper=burn?(H>W*1.5?.55:.45):1;
  const scale=Math.min(Math.max(w/sw,h/sh),w/(sw*f.w),h*upper/(sh*f.h));
  const iw=sw*scale, ih=sh*scale;
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const dx=clamp(w/2-iw*(f.x+f.w/2),Math.min(0,w-iw),Math.max(0,w-iw));
  const dy=clamp(h*upper/2-ih*(f.y+f.h/2),-ih*f.y,h*upper-ih*(f.y+f.h));
  if(dx+iw*f.x < -.01 || dx+iw*(f.x+f.w)>w+.01 || dy+ih*f.y < -.01 || dy+ih*(f.y+f.h)>h*upper+.01){refuse(slotName,'focal box outside photo');return}
  const url=photoRoot+name+'.png';
  out+=`<svg x="${x}" y="${y}" width="${w}" height="${h}" overflow="hidden">`;
  // Extend the edge pixels wherever fitting the entire subject needs overscan.
  const xs=[[0,dx,0,1],[dx,iw,0,sw],[dx+iw,w-dx-iw,sw-1,1]];
  const ys=[[0,dy,0,1],[dy,ih,0,sh],[dy+ih,h-dy-ih,sh-1,1]];
  for(const [left,width,sx,cw] of xs)for(const [top,height,sy,ch] of ys){
   if(width<=0||height<=0)continue;
   const src=edgePixels[name][[sx,sy,cw,ch].join(',')]||url;
   out+=`<image x="${left}" y="${top}" width="${width}" height="${height}" preserveAspectRatio="none" href="${src}"/>`;
  }
  out+='</svg>';
  if(burn)out+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${ink}" opacity=".70"/>`;
  if(burn){const start=Math.max(upper-.04,(dy+ih*(f.y+f.h))/h);box(x,y+h*start,w,h*(1-start),'url(#burn)')}

  const [sx,sy,w,h]=rect;

 function doc(x,y,w,h,key='spotify-song-stream'){
  [x,y,w,h]=frame(x,y,w,h);
  const [slotName]=slot();
  key=window.libraryContent?.[id]?.[slotName] ?? key;
  if(!Object.hasOwn(crops,key)){refuse(slotName,'unknown document crop');return}
  const {logo,lines,wrap_first_at}=crops[key], pad=Math.min(w*.025,h*.025);
  let rows=lines;
  if(stress==='doc-long' && wrap_first_at){
   const [sx,sy,cw,ch]=lines[0];
   rows=[[sx,sy+4,420-sx,34],[420,sy+5,298,28],[718,sy+6,sx+cw-718,32],[157,946,345,27]]
  }else if(wrap_first_at && (w-3*pad-4)/lines[0][2]<1.3*W/1080){
   const [sx,sy,cw,ch]=lines[0],cut=wrap_first_at-sx;
   rows=[[sx,sy,cut,ch],[wrap_first_at,sy,cw-cut,ch],...lines.slice(1)];
  }
  box(x,y,w,h,'#fff');
  const logoScale=Math.min((w-pad*2)/logo[2],h*.13/logo[3]);
  const rowHeight=rows.reduce((sum,r)=>sum+r[3],0);
  const beside=key==='spotify-song-stream' && h-3*pad-logo[3]*logoScale<rowHeight*28*W/(22*1080);
  const textX=x+2*pad+4;
  const logoWidth=logo[2]*logoScale;
  fragment(logo,beside?x+w-pad-logoWidth:x+pad,y+pad,logoScale);
  const top=beside?y+pad:y+2*pad+logo[3]*logoScale;
  const scale=Math.min((w-3*pad-4-(beside?logoWidth+pad:0))/Math.max(...rows.map(r=>r[2])),(y+h-pad-top)/rows.reduce((sum,r)=>sum+r[3],0));
  if(key==='spotify-song-stream' && 22*scale+0.01<28*W/1080){refuse(slotName,'evidence below 28 px at 1080 wide');return}
  let lineY=top;
  for(const row of rows){fragment(row,textX,lineY,scale);lineY+=row[3]*scale}
  box(x+pad,top,4,lineY-top,rungs[1])
