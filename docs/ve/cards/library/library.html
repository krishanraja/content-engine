const missingPhotos=new Set(), missingDocuments=new Set(), rejectedImages=new Map();
const photoURL=name=>photos[name]?.src ?? (photos[name]?.path?'../../../../'+photos[name].path:photoRoot+name+'.png');
const main=document.querySelector('main'), params=new URLSearchParams(location.search);
async function loadCarouselImage(id,slot,record) {
 const key=acceptCarouselImage(registry,id,slot,record);
 const im=new Image();im.src=record.src;await im.decode();
 const w=im.naturalWidth,h=im.naturalHeight;
 const rule=items.find(i=>i.id===id).slots[slot];
 if(!rule.source_only && (Math.abs(w/h-.8)>.006 || Math.max(w,h)<2048))throw Error(key+' needs a 4:5 image at 2K');
 const focus=record.focus || {x:.1,y:.08,w:.8,h:.44};
 if(![focus.x,focus.y,focus.w,focus.h].every(Number.isFinite) || focus.x<0 || focus.y<0 ||
    focus.w<=0 || focus.h<=0 || focus.x+focus.w>1 || focus.y+focus.h>1)throw Error(key+' invalid focal box');
 photos[key]={...record,width:w,height:h,focus};
 rejectedImages.delete(key);
 return key;
}
window.generateCarouselImage=async (id,slot,scene,generate=window.libraryImageGenerator)=>{
 if(typeof generate!=='function')throw Error('Connect the producer image generator before generating');
 const brief=carouselImageBrief(registry,id,slot,scene);
 const record={...await generate(brief),prompt:brief.prompt,imagery_style:brief.imagery_style};
 await loadCarouselImage(id,slot,record);
 window.libraryImages??={};(window.libraryImages[id]??={})[slot]=record;
 window.renderLibraryView?.();
 return record;
};
window.ready=(async()=>{
 registerCarouselEvidence(registry,window.libraryEvidence);
 await Promise.all(Object.entries(window.libraryImages||{}).flatMap(([id,slots])=>
   Object.entries(slots).map(([slot,record])=>loadCarouselImage(id,slot,record).catch(e=>rejectedImages.set(id+'/'+slot,e.message)))));
 const requested=params.get('item'), sequence=sequences[params.get('seq')], view=params.get('view');
 const onScreen=requested?items.filter(i=>i.id===requested):
   sequence?sequence.shots.map(s=>items.find(i=>i.id===(s.slide||s.item))):
   view && items.some(i=>i.family===view)?items.filter(i=>i.family===view):items;
 const visibleBank=new Set(onScreen.flatMap(i=>[
   ...Object.values(window.libraryContent?.[i.id]||{}),
   ...(i.scene||[]).filter(op=>op.kind==='photo').map(op=>op.value)]));
 await Promise.all(Object.keys(photos).filter(name=>!name.startsWith('bank-') || visibleBank.has(name)).map(async name=>{
  const image=new Image();image.src=photoURL(name);
  try{await image.decode();photos[name].width=image.naturalWidth;photos[name].height=image.naturalHeight}catch{missingPhotos.add(name)}
 }));
 if(params.get('stress')==='brightphoto' && missingPhotos.has('still-record-phone'))throw Error('Bright-photo fixture unavailable');
 await Promise.all(['32px Anton','500 32px Fraunces','italic 500 32px Fraunces','600 32px Fraunces','32px Mono'].map(f=>document.fonts.load(f)));
 await document.fonts.ready;
 await Promise.all([photoRoot+'doc-spotify-streams.png',photoRoot+crops['spotify-song-stream'].mobile.path,
  spotifyMarks.ink,spotifyMarks.cream,...Object.values(registry.tool_logos).map(o=>o.src),...Object.values(registry.screenshots).map(o=>o.src)].map(async path=>{
  const image=new Image();image.src=path;
  try{
   await image.decode();
   for(const logo of Object.values(registry.tool_logos))if(logo.src===path)logo.aspect=image.naturalWidth/image.naturalHeight;
   const shot=Object.values(registry.screenshots).find(s=>s.src===path);
   if(shot && (shot.size[0]!==image.naturalWidth || shot.size[1]!==image.naturalHeight))throw Error('source dimensions');
  }catch{missingDocuments.add(path)}
 }));
 main.addEventListener('change',event=>{
   const {bankItem:id,bankSlot:slot}=event.target.dataset;
   if(!id)return;
   const key=event.target.value,item=items.find(row=>row.id===id);
   if(key && !bankChoices(registry,item,slot).some(([id])=>id===key))throw Error('Invalid bank selection');
   window.libraryContent??={};const slots=window.libraryContent[id]??={};
   if(key)slots[slot]=key;else delete slots[slot];
   // Retain keyboard focus and the open picker as the artwork changes.
   for(const figure of event.target.closest('figure').querySelectorAll('svg.art')){
     const width=Number(figure.getAttribute('width'));
     const probe=document.createElementNS(figure.namespaceURI,'text');figure.replaceChildren(probe);
     figure.setAttribute('viewBox','0 0 '+item.width+' '+item.height);
     probe.insertAdjacentHTML('beforebegin',art(item,width,probe));probe.remove();
   }
 });
 main.addEventListener('submit',async event=>{
  const form=event.target;
  if(!form.dataset.briefItem)return;
  event.preventDefault();
  const {briefItem:id,briefSlot:slot}=form.dataset, scene=form.elements.scene.value;
  const result=form.querySelector('output');
  try{
   if(event.submitter?.name==='generate'){
    event.submitter.disabled=true;
    result.textContent='Generating image…';
    await window.generateCarouselImage(id,slot,scene);
   }else result.textContent=carouselImageBrief(registry,id,slot,scene).prompt;
  }catch(error){result.textContent=error.message}
  finally{if(event.submitter)event.submitter.disabled=false}
 });
 window.renderLibraryView=()=>{
 const seqName=params.get('seq'), id=params.get('item');
 const families=[...new Set(items.map(i=>i.family))], family=params.get('view')||'index';
 if(seqName||id){
  const seq=sequences[seqName], item=items.find(i=>i.id===id), surface=seq||item;
  if(!surface)throw Error('Unknown export '+(seqName||id));
  document.body.className='single';
  main.innerHTML=artFrame({...surface,id:id||seqName,name:item?.name||seqName});
  const svg=main.firstElementChild,probe=document.createElementNS(svg.namespaceURI,'text');
  window.drawFrame=frame=>{
   frame=Math.max(0,Math.min((seq?.frames||item?.motion?.frames||1)-1,Math.floor(Number(frame)||0)));
   probe.style.visibility='hidden';svg.replaceChildren(probe);
   const markup=seq?sequenceArt(seq,frame,probe):art(item,0,probe,frame);
   probe.insertAdjacentHTML('beforebegin',markup);probe.remove()
  };
  window.drawFrame(params.has('t')?params.get('t'):seq?0:(item.motion?.frames||1)-1);return
 }
 const heading=s=>'<header><a href="?view=index">Make Your Mind Up / Library</a><h1>'+s+'</h1></header>';
 if(family==='system'||family==='grid'){main.innerHTML=reviewView(family);fitFrames();return}
 if(family==='index'){main.innerHTML=heading('Template library')+'<p>One wordmark per artefact.</p><p>The headline appears once per medium, where the medium introduces itself (bio, homepage, site), never on per-piece artefacts.</p><nav>'+['system','grid',...families].map(f=>'<a href="?view='+f+'">'+(f==='system'?'The whole system':f==='grid'?'Instagram grid':f+' · '+items.filter(i=>i.family===f).length)+'</a>').join('')+'</nav>';return}
 main.innerHTML=heading(family)+'<section class="grid">'+items.filter(i=>i.family===family).map(i=>{
 const preview=n=>{
  const src=window.libraryImages?.[i.id] || window.libraryContent?.[i.id] ? null : window.itemPreviews?.[i.id];
  if(i.family.startsWith('video-') || i.preview_ui || i.format==='text' || !src || cameraPlatePreview(i) || params.has('stress') || params.get('grid')==='1')return artFrame(i,n);
  const guides=sheetGuides(i);
  return `<svg class="art" width="${n}" height="${n*i.height/i.width}" viewBox="0 0 ${i.width} ${i.height}" aria-label="${esc(i.name)}"><image href="${src}" width="${i.width}" height="${i.height}"/>${guides}</svg>`
 };
 let markup=preview(400);if((i.layout==='icon'||i.layout==='avatar-wordmark')&&i.id.endsWith('avatar'))markup=markup.replace('class="art"','class="art" style="border-radius:50%"');
 const sizes=i.layout==='episode'?[56]:i.layout==='show'?[300,150,56]:i.id.includes('youtube-thumb')?[168]:[];
 const credits=[...new Set((i.scene||[]).filter(op=>op.kind==='photo' && i.slots[op.slot]?.reported_event).map(op=>{
   const key=window.libraryContent?.[i.id]?.[op.slot] ?? (photos[i.id+'/'+op.slot]?i.id+'/'+op.slot:op.value);
   return photos[key]?.credit;
 }).filter(Boolean))];
 const photoCredit=credits.length?'<br>Photography · '+credits.map(esc).join(' / '):'';
 return '<figure>'+markup+'<figcaption><strong><a href="?item='+i.id+'">'+i.name+'</a></strong>'+i.platform+' · '+i.width+' × '+i.height+'<br>'+i.use+photoCredit+(i.motion?'<br>'+i.motion.note:'')+'</figcaption>'+bankPicker(i)+imageBriefForm(i)+'<div class="samples">'+sizes.map(n=>preview(n).replace('class="art"','class="art" style="width:'+n+'px"')).join('')+'</div></figure>'}).join('')+'</section>';
 fitFrames()
 };
 window.renderLibraryView();
})();
