name: Standards check-in weekly

# The weekly standards check-in's data (Ruling, Krish, 2026-11-15: the weekly standards check-in is one pinned
# claude.ai artifact refreshed weekly, an exception to "No Claude artifact, ever"). docs/STANDARDS-CHECKIN.md.
#
# Code only, no model: scripts/standards_checkin.py applies his answers from last week's check-in through the one
# decision write, proposes every floor standard config/floor-groups.json does not place into a group (a decided
# group's evolution under a new key, or a new group by theme), seeds those groups as proposals, and stores the week's
# payload in standards_checkins. The page itself is refreshed by a session; this job builds no page and no publish
# board. A changed config/floor-groups.json goes out as a pull request that merges itself on green CI, like every
# other (Ruling, Krish, 2026-11-03: "Change everything to auto-merge all the time. No manual merging").
#
# When: Sunday 07:00 UTC, after the Saturday floor run. When the Rejections engine's floor pull request
# (floor/rejections) is open, the run starts from it, because that pull request stays red until its new standards
# are grouped, and the grouping pull request carries it to main (as #710 did). By hand from Actions: a hand run is a
# dry run (counts only, nothing written) unless dry_run is unticked.
#
# This repository is public: the log carries counts and keys only, never his words or a still.

on:
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: print the counts, write nothing, open no pull request'
        type: boolean
        default: true

concurrency:
  group: standards-checkin
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: The database keys are here
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::No SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF. One setup step for Krish: add the Supabase management key and the main project's ref as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start from the floor pull request when it is open
        id: base
        run: |
          if git ls-remote --exit-code --heads origin floor/rejections >/dev/null 2>&1; then
            git fetch -q origin floor/rejections
            if [ -n "$(git rev-list origin/main..origin/floor/rejections)" ]; then
              git switch -q --detach origin/floor/rejections
              echo "from=floor/rejections" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "from=main" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (the stills are made small with it)
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt

      - name: Dry run or the real week
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$DRY" = "false" ]; then echo "apply=true" >> "$GITHUB_OUTPUT"; else echo "apply=false" >> "$GITHUB_OUTPUT"; fi
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build the week's check-in
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APPLY: ${{ steps.mode.outputs.apply }}
          TODAY: ${{ steps.mode.outputs.today }}
        run: |
          if [ "$APPLY" = "true" ]; then
            python3 scripts/standards_checkin.py --apply --week-of "$TODAY"
            python3 scripts/floor_group.py --check
          else
            python3 scripts/standards_checkin.py --week-of "$TODAY"
          fi

      - name: Open the grouping pull request (it merges itself on green CI)
        if: steps.mode.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ steps.mode.outputs.today }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          FROM: ${{ steps.base.outputs.from }}
        run: |
          git diff --quiet -- config/floor-groups.json && { echo "No new standards to group this week."; exit 0; }
          branch="floor/checkin-$TODAY-$RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add config/floor-groups.json
          git commit -q -m "Group the week's new floor standards for the standards check-in ($TODAY)" \
            -m "Written by .github/workflows/standards-checkin.yml from $FROM, code only: each new standard proposed into a group, seeded as a proposal for his answer on the check-in. Nothing is decided here." \
            -m 'Ruling (Krish, 2026-11-15): the weekly standards check-in is one pinned claude.ai artifact refreshed weekly, an exception to "No Claude artifact, ever".'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          gh pr create -R "$REPO" --head "$branch" --base main --title "Standards check-in: group the new floor standards ($TODAY)" \
            --body "The week's new floor standards, each proposed into a group (config/floor-groups.json) and seeded as a proposal for Krish's answer on the standards check-in. Started from $FROM. It merges itself on green CI (auto-merge.yml)."
          gh workflow run ci.yml -R "$REPO" --ref "$branch"
