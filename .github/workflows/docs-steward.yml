# Docs steward caller. Copy this file to .github/workflows/docs-steward.yml in
# a fleet repo. The procedure, schema and scripts live in
# krishanraja/ai-harness (docs/steward/, scripts/steward/); this file only
# calls them. They moved there from control-center on 2026-10-15, when it went
# private: a public repository cannot call a private repository's workflow.
#
# One-time setup per repo: run `claude setup-token` locally and add the
# result as the repository secret CLAUDE_CODE_OAUTH_TOKEN. Until it exists
# the run fails with a message naming it, never silently.
#
# Pick a distinct minute for the nightly cron so eight repos do not hit the
# subscription together. Cron is UTC; 20:xx UTC is 06:xx Brisbane.

name: Docs steward

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Digest and validate only; Claude does not run and nothing is pushed"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  steward:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs(steward):') }}
    # Pinned by commit, never @main: whoever can change ai-harness main must not
    # run code with this repository's secrets the same night. Move the pin in a
    # reviewed pull request when the steward changes.
    uses: krishanraja/ai-harness/.github/workflows/docs-steward.yml@ab9dfa6af13a5b778fc73950b65bbfdb1dcbab76 # 2026-11-14, AUTO-6 hardening (#237)
    with:
      dry_run: ${{ inputs.dry_run || false }}
    # Only the one secret the steward reads, never `secrets: inherit`.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
