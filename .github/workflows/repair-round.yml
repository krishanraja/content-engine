name: Repair round

# Plan Wave 2, W2.6: "Repair round. A GitHub job on his subscription, dispatched when the board holds a cut (or by his
# press). One bounded round, never a routine." Ruling (Krish, 2026-10-29): "FYI, I want zero Claude routines. No Claude
# schedules of any kind in this architecture". So this job has no schedule. It starts only when someone starts it:
#   - the overnight run, when the Monday board it built holds a cut a repair could mend
#     (scripts/overnight/overnight.py, repair_round: `gh workflow run repair-round.yml -f week=<Monday> -f cuts=<day-cut,...>`);
#   - a repository_dispatch with event type repair-round and client_payload {"week": "<Monday>", "cuts": "wed-long"},
#     for a press on the board or in Control Center;
#   - Krish, from Actions > Repair round > Run workflow.
#
# One round: Claude Code, on his subscription (CLAUDE_CODE_OAUTH_TOKEN, never an API key), reads each held cut's named
# failure from the week's board and the computers' lane reports, and acts as the repairer only: for each cut it writes
# what to change (spec field paths, or which plates to regenerate) as a board item through the engine API, which the
# next render on his computer reads; a failure that needs a different take it leaves held and says so. It never judges
# the cut (a fresh Critic does, on the next render), never renders, never edits a file, never publishes, and writes
# nothing but those records (ENGINE_OPERATOR_TOKEN). Its turns are capped, and a second round for the same week waits
# for this one, so it stays one bounded round.
#
# One-time setup (Krish): run `claude setup-token` on his own computer and add the result to this repository as the
# Actions secret CLAUDE_CODE_OAUTH_TOKEN. Until it exists every run fails at its first step, naming that step.
# This repository is public: Claude's full output stays out of the log (claude-code-action's default).
#
# The board and the lane reports are written from outside this job, so the run is fenced by permissions, not by its
# prompt: Bash only for the named engine scripts (no curl, no git push, no shell), no Edit or Write at all, no read of
# /proc (where the step's secrets live), and the checkout keeps no GitHub credential (persist-credentials: false).

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'The Monday the week starts on, YYYY-MM-DD'
        required: true
      cuts:
        description: 'The held cuts to repair, as day-cut separated by commas (for example wed-long,fri-short)'
        required: true
  repository_dispatch:
    types: [repair-round]

concurrency:
  group: repair-round-${{ github.event.inputs.week || github.event.client_payload.week }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Claude Code runs on Krish's subscription, never an API key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN. One setup step for Krish: run 'claude setup-token' on your computer and add what it prints as the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions). This job never uses an API key instead."
            exit 1
          fi
          if [ -z "$ENGINE_OPERATOR_TOKEN" ]; then
            echo "::error::No ENGINE_OPERATOR_TOKEN, so the run cannot read the board or write its repair records."
            exit 1
          fi

      - name: Which week and which held cuts
        id: round
        env:
          WEEK: ${{ github.event.inputs.week || github.event.client_payload.week }}
          CUTS: ${{ github.event.inputs.cuts || github.event.client_payload.cuts }}
        run: |
          if ! [[ "$WEEK" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "$(date -u -d "$WEEK" +%u 2>/dev/null)" != "1" ]; then
            echo "::error::week must be a Monday, YYYY-MM-DD."
            exit 1
          fi
          if ! [[ "$CUTS" =~ ^(mon|wed|fri)-(long|short)(,(mon|wed|fri)-(long|short)){0,5}$ ]]; then
            echo "::error::cuts must be day-cut pairs such as wed-long,fri-short (at most six)."
            exit 1
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "cuts=$CUTS" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the tools the round runs
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-ci.txt
          # The Claude Code installer needs its launcher directory to exist (the docs steward's fix, 2026-09-08).
          mkdir -p "$HOME/.local/bin"

      - name: One repair round, in Claude Code on his subscription
        uses: anthropics/claude-code-action@v1
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 120
            --allowedTools "Bash(python3 scripts/check_failures.py:*),Bash(python3 scripts/floor.py:*),Bash(python3 scripts/engine.py:*),Bash(python3 scripts/post-pack/board_web.py read:*),Bash(python3 scripts/post-pack/making.py:*),Bash(python3 scripts/overnight/critic.py check:*),Read,Glob,Grep"
            --disallowedTools "Read(//proc/**)"
          prompt: |
            One repair round for the week starting Monday ${{ steps.round.outputs.week }}, for the held cuts
            ${{ steps.round.outputs.cuts }}, started in GitHub Actions (.github/workflows/repair-round.yml). No one
            reads this run's chat.

            You are the repairer only (plan Wave 2, W2.6). For each held cut: read why it is held from the computers'
            lane reports (python3 scripts/engine.py GET /api/library/recordings/lane: its overnight block names the
            reason and where) and from the week's board (python3 scripts/post-pack/board_web.py read <Monday> picks and
            comments), and the piece's making record and creative direction (python3 scripts/post-pack/making.py
            <piece> show; the docs/plans folder). Read scripts/overnight/overnight.py REASONS for what each reason means.
            Then write one board item for that cut through the engine API (python3 scripts/engine.py POST
            /api/workbench with {"action": "upsert_items", "client": "claude_code", "items": [{"id":
            "repair-<Monday>-<day>-<cut>", "lane": "in_progress", "rank": 1, "area": "Videos", "title": ..., "detail":
            ..., "idea_id": <piece>}]}) whose detail says exactly what the next render changes: the spec field paths and
            their new values, or which plates to regenerate and why, so the next render on his computer applies it
            and a fresh Critic judges it again. A failure that needs a different take is not repaired: its item says
            the cut stays held for a new take, and which line. Never judge the cut yourself, never render, never edit
            or write a file, never publish, send or post, and never ask Krish anything here: a question goes in the
            item's detail. Stop after one item per held cut.
