name: GPU matte trial

# Runs a GPU subject matte (scripts/velib/matte_pod.py: BiRefNet, MIT, and RobustVideoMatting, GPL-3.0, run on the pod
# as a separate tool and never vendored) on one clip of a take, on one rented RunPod pod, and keeps the clip, the alpha
# mattes and the pod's receipt as a short-lived artifact. The comparison against the CPU matte (scripts/velib/matte.py)
# is made from that artifact; nothing here feeds a render.
#
# Spend, so: run by hand only, never on a schedule (Ruling, Krish, 2026-10-29: "I want zero Claude routines"), and only
# with the confirmation typed exactly. Ruling (Krish, 2026-11-20): one GPU matte comparison run on RunPod approved,
# about $0.10. The runner refuses over the cap, terminates the pod on every path and keeps RUNPOD_API_KEY out of every
# file. No Claude runs here.

on:
  workflow_dispatch:
    inputs:
      take:
        description: 'The recording, by its name in the store (python scripts/post-pack/recording.py list); cleanup terminates any matte pod'
        required: true
        default: 'ai-music-short.mp4'
      model:
        description: 'Comma-separated, from scripts/velib/matte_pod.py MODELS: birefnet-hr, birefnet, rvm'
        required: true
        default: 'birefnet-hr,rvm'
      clip_start:
        description: 'Start the clip this many seconds into the take'
        required: false
        default: '0'
      clip_seconds:
        description: 'Send only this many seconds (0 = the whole take); the clip is kept in the artifact'
        required: false
        default: '30'
      max_usd:
        description: 'Refuse a run that could cost more than this (US dollars)'
        required: true
        default: '0.25'
      max_minutes:
        description: 'Stop the pod after this many minutes'
        required: true
        default: '40'
      confirm:
        description: 'Type exactly: spend approved by Krish'
        required: true

permissions:
  contents: read

concurrency:
  group: matte-trial
  cancel-in-progress: false

jobs:
  matte:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Refuse without the typed confirmation
        if: ${{ inputs.confirm != 'spend approved by Krish' }}
        run: |
          echo "The confirmation was not typed exactly; nothing was rented."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the take from the recordings store
        if: ${{ inputs.take != 'cleanup' }}
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
          TAKE: ${{ inputs.take }}
        run: python scripts/post-pack/recording.py get "$TAKE" --out "$RUNNER_TEMP/take"
      - name: Cut the clip (at most 30 fps, constant rate, the take's own size up to 1920 on the long side)
        if: ${{ inputs.take != 'cleanup' }}
        env:
          TAKE: ${{ inputs.take }}
          START: ${{ inputs.clip_start }}
          CLIP: ${{ inputs.clip_seconds }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg > /dev/null
          RATE=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$RUNNER_TEMP/take/$TAKE" \
            | python -c "import sys; n, _, d = sys.stdin.read().strip().partition('/'); print(min(float(n) / float(d or 1), 30.0))")
          LIMIT=""
          if [ "${CLIP:-0}" != "0" ]; then LIMIT="-t $CLIP"; fi
          mkdir -p "$RUNNER_TEMP/matte"
          # fps=..:round=near, never the -r output option: -r put his picture 52 to 55 ms behind his voice (maxine-trial.yml).
          ffmpeg -v error -y -ss "${START:-0}" -i "$RUNNER_TEMP/take/$TAKE" $LIMIT -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 12 \
            -profile:v high -pix_fmt yuv420p \
            -vf "fps=$RATE:round=near,scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(iw,ih),-2,min(1920,ih))'" -fps_mode cfr \
            -c:a aac -b:a 192k "$RUNNER_TEMP/matte/clip.$TAKE"
          ffprobe -v error -show_entries stream=codec_type,width,height,r_frame_rate -show_entries format=duration -of compact "$RUNNER_TEMP/matte/clip.$TAKE"
      - name: Matte the clip on one rented pod
        if: ${{ inputs.take != 'cleanup' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          TAKE: ${{ inputs.take }}
          MODELS: ${{ inputs.model }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
        run: |
          python scripts/velib/matte_pod.py "$RUNNER_TEMP/matte/clip.$TAKE" "$RUNNER_TEMP/matte" --yes --models "$MODELS" \
            --max-usd "$MAX_USD" --max-minutes "$MAX_MINUTES"
          rm -f "$RUNNER_TEMP/matte/"*.mattes.tar
          ls -laR "$RUNNER_TEMP/matte"
      - name: Keep the clip, the mattes and the receipt (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matte-${{ github.run_id }}
          path: ${{ runner.temp }}/matte/
          retention-days: 3
          if-no-files-found: warn
      - name: Terminate any matte pod still running (also on cancel; take=cleanup runs only this)
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python scripts/velib/matte_pod.py cleanup -
