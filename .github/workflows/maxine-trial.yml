name: Maxine eye contact trial

# Runs NVIDIA Maxine Eye Contact (AR SDK, "available for commercial/non-commercial use" per NGC) on one take, on one
# rented RunPod Secure Cloud RTX A5000 (scripts/velib/maxine_pod.py), and keeps only Maxine's redirected copy and the
# pod's receipt as a short-lived artifact. `ve eyeline --backend maxine --maxine-copy <copy>` then lays Maxine's eyes
# onto the take only where the plan says.
#
# Spend, so: run by hand only, never on a schedule (Ruling, Krish, 2026-10-29: "I want zero Claude routines"), and only
# with the confirmation typed exactly. Krish approved the first run on 5 Nov 2026: "merge the job and spend up to $1".
# The runner refuses over the cap, terminates the pod on every path and keeps RUNPOD_API_KEY and NGC_API_KEY out of
# every file. No Claude runs here.

on:
  workflow_dispatch:
    inputs:
      take:
        description: 'The recording, by its name in the store (python scripts/post-pack/recording.py list)'
        required: true
        default: 'ai-music-short.mp4'
      max_usd:
        description: 'Refuse a run that could cost more than this (US dollars)'
        required: true
        default: '1.00'
      route:
        description: 'nim (the Eye Contact NIM, which this NGC key can pull) or sdk (needs a Maxine SDK subscription)'
        required: false
        default: 'nim'
      variants:
        description: 'nim route: JSON {name: [client args]} of settings to try on one pod (empty = default)'
        required: false
        default: ''
      clip_seconds:
        description: 'Send only the first N seconds (0 = the whole take); the clip is kept in the artifact'
        required: false
        default: '10'
      max_minutes:
        description: 'Stop the pod after this many minutes'
        required: false
        default: '30'
      split_seconds:
        description: 'Cut the take into chunks of this many seconds, run each on the one pod and join them (0 = whole take; the NIM refused the 315 s ai-music-long whole and took the 96 s short take)'
        required: false
        default: '0'
      image:
        description: 'nim route: the NIM image tag to run (empty = latest); take=entitlement-check lists the tags'
        required: false
        default: ''
      confirm:
        description: 'Type exactly: spend approved by Krish'
        required: true

permissions:
  contents: read

concurrency:
  group: maxine-trial
  cancel-in-progress: false

jobs:
  maxine:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Refuse without the typed confirmation
        if: ${{ inputs.confirm != 'spend approved by Krish' }}
        run: |
          echo "The confirmation was not typed exactly; nothing was rented."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: What can this NGC key reach (take=entitlement-check; free, no GPU)
        if: ${{ inputs.take == 'entitlement-check' }}
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          set +e
          echo "$NGC_API_KEY" | docker login nvcr.io -u '$oauthtoken' --password-stdin >/dev/null 2>&1 && echo "nvcr.io login: ok" || echo "nvcr.io login: refused"
          for image in nim/nvidia/maxine-eye-contact:latest nvidia/maxine/maxine-eye-contact:latest; do
            if docker manifest inspect "nvcr.io/$image" >/dev/null 2>&1; then echo "pull allowed: $image"; else echo "pull refused: $image"; fi
          done
          # The tags NVIDIA publishes for the Eye Contact NIM (`latest` changed under us on 9 Nov: feature 1.5.1 refused
          # the take the 5 Nov image took). Registry v2 token for nvcr.io with the NGC key, then the tag list.
          TOKEN=$(curl -s -u "\$oauthtoken:$NGC_API_KEY" "https://nvcr.io/proxy_auth?scope=repository:nim/nvidia/maxine-eye-contact:pull" | python -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          curl -s -H "Authorization: Bearer $TOKEN" https://nvcr.io/v2/nim/nvidia/maxine-eye-contact/tags/list | python -c "import json,sys; d=json.load(sys.stdin); print('tags:', ' '.join(sorted(d.get('tags') or [])) or d)"
          docker logout nvcr.io >/dev/null 2>&1
      - name: Fetch the take from the recordings store
        if: ${{ inputs.take != 'cleanup' && inputs.take != 'entitlement-check' }}
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
          TAKE: ${{ inputs.take }}
        run: python scripts/post-pack/recording.py get "$TAKE" --out "$RUNNER_TEMP/take"
      - name: Make the take what the NIM accepts (and cut a short clip for a fast trial)
        if: ${{ inputs.take != 'cleanup' && inputs.take != 'entitlement-check' }}
        env:
          TAKE: ${{ inputs.take }}
          CLIP: ${{ inputs.clip_seconds }}
          SPLIT: ${{ inputs.split_seconds }}
          VARIANTS_IN: ${{ inputs.variants }}
        run: |
          # The NIM takes "Only H.264 8-bit videos with Constant Frame Rate" and refused the take as recorded (run
          # 42120949518: audio is its first stream, video Baseline). Video first, H.264 High 8-bit 4:2:0, constant
          # frame rate, index at the end (transactional: with the index first the NIM takes its streaming path and
          # refused it, run 42122101025); the same file is kept in the artifact so ve eyeline works on the frames the NIM saw.
          pip install -q imageio-ffmpeg
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          RATE=$(python - "$RUNNER_TEMP/take/$TAKE" <<'PY'
          import json, subprocess, sys, imageio_ffmpeg
          out = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-i', sys.argv[1]], capture_output=True, text=True).stderr
          import re
          m = re.search(r'Video:.*?(\d+(?:\.\d+)?) fps', out)
          # At most 30 fps: the NIM took the 30 fps takes of 5 Nov and refused the 48 fps takes of 10 Nov with the same
          # "Only H.264 8-bit ... Constant Frame Rate" error (run 42805645993; suspected cause, the frame rate).
          print(min(float(m.group(1)), 30.0) if m else '30')
          PY
          )
          LIMIT=""
          if [ "${CLIP:-0}" != "0" ]; then LIMIT="-t $CLIP"; fi
          mkdir -p "$RUNNER_TEMP/maxine"
          KEYS=""
          if [ "${SPLIT:-0}" != "0" ]; then KEYS="-force_key_frames expr:gte(t,n_forced*$SPLIT)"; fi
          "$FF" -v error -y -i "$RUNNER_TEMP/take/$TAKE" $LIMIT -map 0:v:0 -map 0:a? -c:v libx264 -preset veryfast -crf 12 \
            -profile:v high -pix_fmt yuv420p -r "$RATE" -fps_mode cfr $KEYS -c:a aac -b:a 192k \
            "$RUNNER_TEMP/maxine/clip.$TAKE"
          cp "$RUNNER_TEMP/maxine/clip.$TAKE" "$RUNNER_TEMP/take/$TAKE"
          if [ "${SPLIT:-0}" != "0" ]; then
            # Chunks cut on the forced keyframes, so they hold every frame exactly once and join back frame for frame; each
            # is a variant with its own --input, run back to back on the one pod with the settings given in `variants`.
            mkdir -p "$RUNNER_TEMP/take/parts"
            "$FF" -v error -y -i "$RUNNER_TEMP/take/$TAKE" -map 0 -c copy -f segment -segment_time "$SPLIT" -reset_timestamps 1 \
              "$RUNNER_TEMP/take/parts/p%03d.mp4"
            python - "$RUNNER_TEMP/take/parts" "$VARIANTS_IN" >> "$GITHUB_ENV" <<'PY'
          import json, pathlib, sys
          parts = sorted(pathlib.Path(sys.argv[1]).glob('p*.mp4'))
          given = json.loads(sys.argv[2]) if sys.argv[2] else {'': ['--bitrate', '20000000']}
          if len(given) != 1:
              raise SystemExit('split_seconds takes one variant: the settings every chunk runs with')
          args = list(given.values())[0]
          print('SPLIT_VARIANTS=' + json.dumps({p.stem: args + ['--input', str(p)] for p in parts}))
          PY
            ls -la "$RUNNER_TEMP/take/parts"
          fi
          # Inputs a variant can name with --input, for diagnosing what the NIM accepts: a 10 s cut and NVIDIA's sample.
          "$FF" -v error -y -i "$RUNNER_TEMP/take/$TAKE" -t 10 -c copy "$RUNNER_TEMP/take/c10.mp4" || true
          curl -sSL -o "$RUNNER_TEMP/take/nv.mp4" https://media.githubusercontent.com/media/NVIDIA-Maxine/nim-clients/main/eye-contact/assets/sample_transactional.mp4 || true
          ls -la "$RUNNER_TEMP/take/$TAKE"
      - name: NVIDIA's Eye Contact client (nim route)
        if: ${{ inputs.take != 'cleanup' && inputs.take != 'entitlement-check' && inputs.route != 'sdk' }}
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA-Maxine/nim-clients.git "$RUNNER_TEMP/nim-clients"
          git -C "$RUNNER_TEMP/nim-clients" sparse-checkout set eye-contact utils
          pip install -q -r "$RUNNER_TEMP/nim-clients/eye-contact/requirements.txt"
      - name: Run Maxine on one rented pod
        if: ${{ inputs.take != 'cleanup' && inputs.take != 'entitlement-check' }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          TAKE: ${{ inputs.take }}
          MAX_USD: ${{ inputs.max_usd }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          NIM: ${{ inputs.route != 'sdk' && 'yes' || '' }}
          VARIANTS: ${{ inputs.variants }}
          MAXINE_NIM_IMAGE: ${{ inputs.image && format('nvcr.io/nim/nvidia/maxine-eye-contact:{0}', inputs.image) || '' }}
        run: |
          RUN_VARIANTS="${SPLIT_VARIANTS:-$VARIANTS}"
          python scripts/velib/maxine_pod.py "$RUNNER_TEMP/take/$TAKE" "$RUNNER_TEMP/maxine" --yes --max-usd "$MAX_USD" \
            --max-minutes "${MAX_MINUTES:-30}" ${NIM:+--nim-client "$RUNNER_TEMP/nim-clients/eye-contact"} \
            ${RUN_VARIANTS:+--variants "$RUN_VARIANTS"}
      - name: Join the chunks back into one copy of the take (split_seconds only)
        if: ${{ inputs.split_seconds != '' && inputs.split_seconds != '0' && inputs.take != 'cleanup' && inputs.take != 'entitlement-check' }}
        env:
          TAKE: ${{ inputs.take }}
        run: |
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          STEM="${TAKE%.*}"
          cd "$RUNNER_TEMP/maxine"
          ls "$STEM".maxine.p*.mp4 | sort | sed "s/^/file '/; s/$/'/" > parts.txt
          cat parts.txt
          "$FF" -v error -y -f concat -safe 0 -i parts.txt -c copy "$STEM.maxine.joined.mp4"
          rm -f "$STEM".maxine.p*.mp4
          ls -la
      - name: Keep the redirected copy and the receipt (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maxine-${{ github.run_id }}
          path: ${{ runner.temp }}/maxine/
          retention-days: 3
          if-no-files-found: warn
      - name: Terminate any eyeline pod still running (also on cancel; take=cleanup runs only this)
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python scripts/velib/maxine_pod.py cleanup -
