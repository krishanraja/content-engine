name: Auto-merge

# Every pull request merges itself once CI is green, ve included (Ruling, Krish, 2026-11-03: "Change everything to
# auto-merge all the time. No manual merging"). main has no required checks (Krish, 2026-10-25: "No merge checks."), so
# GitHub's own auto-merge would not wait for CI; this job merges on green CI instead. Red CI never merges: the branch
# is fixed and the next green run merges it. A branch with no open pull request is never touched. "CI" is the quick
# checks only (ci.yml); the full verify (full-verify.yml) runs after the merge and never holds one back.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request whose CI is green
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,headRefOid,isDraft \
            --jq "[.[] | select(.isDraft | not) | select(.headRefOid == \"$SHA\")][0].number // empty")
          if [ -z "$pr" ]; then echo "No open, ready pull request at $SHA on $BRANCH; nothing to merge."; exit 0; fi
          # Push and pull_request both run CI on the same commit: merge only when every CI run on it is green.
          waiting=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI") | select(.status != "completed" or .conclusion != "success")] | length')
          if [ "$waiting" != "0" ]; then echo "$waiting other CI run(s) on $SHA are not green yet; the last green one merges."; exit 0; fi
          gh pr merge "$pr" -R "$REPO" --merge
          echo "Merged #$pr ($SHA) on green CI."
          echo "merged=true" >> "$GITHUB_OUTPUT"
          # A merge made with GitHub's own token starts no push workflow on main; start the docs steward by hand, as
          # its dry run: the digest and the validator, with no model, the half a push would run. Its writing half is
          # the nightly run. Dispatched without the dry run, every merge started Claude as github-actions[bot], which
          # claude-code-action refuses ("Workflow initiated by non-human actor"), so the steward check was red on
          # every merge from 3 Nov to 12 Nov.
          gh workflow run docs-steward.yml -R "$REPO" --ref main -f dry_run=true || echo "::warning::docs-steward was not started; its nightly run picks the merge up."
      # The same token starts no push workflow, so harness-repository-context.yml's fold job never sees this merge and
      # closeout notes pile up unfolded (twelve by 4 Nov). Fold them here with the harness's own script, pinned by the
      # sha256 that workflow checks, so NOW.md is current the moment the work lands (Ruling, Krish, 2026-11-04: docs are
      # current before work merges).
      - if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - if: steps.merge.outputs.merged == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      # scripts/gen-repo-map.mjs reads the code with the typescript package.
      - if: steps.merge.outputs.merged == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Fold closeout notes into NOW.md
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pin=$(grep -o -m1 '[0-9a-f]\{64\}  \.claude/hooks/harness-closeout\.mjs' .github/workflows/harness-repository-context.yml)
          for attempt in 1 2 3; do
            git fetch --quiet origin main && git reset --quiet --hard origin/main || exit 1
            status=0
            if ls now-notes/*.md >/dev/null 2>&1; then
              echo "$pin" | sha256sum --check --status || { echo "::error::.claude/hooks/harness-closeout.mjs is not the harness copy"; exit 1; }
              node .claude/hooks/harness-closeout.mjs --fold || status=$?
            fi
            # Main keeps NOW.md under its limit itself, so no branch ever trims it by hand: two branches trimming
            # NOW.md at once is what left pull requests conflicted and unmerged (2026-11-10).
            python3 scripts/now_trim.py || status=$?
            # The repo map heals here too: a pull request is only warned for a stale map (scripts/gen-repo-map.mjs), so
            # main regenerates it after every merge, as it trims NOW.md, and the full verify below finds it current.
            node scripts/gen-repo-map.mjs || status=$?
            if [ -z "$(git status --porcelain -- NOW.md now-notes docs/history docs/REPO_MAP.md)" ]; then echo "Nothing to fold, trim or map."; exit "$status"; fi
            git add -A -- NOW.md now-notes docs/history docs/REPO_MAP.md
            git commit --quiet -m "docs(closeout): fold closeout notes into NOW.md" -m "Folded by auto-merge after the merge, with .claude/hooks/harness-closeout.mjs --fold from krishanraja/ai-harness, then trimmed under the size limit by scripts/now_trim.py, and docs/REPO_MAP.md regenerated by scripts/gen-repo-map.mjs."
            if git push --quiet origin HEAD:main; then exit "$status"; fi
            sleep $((attempt * 5))
          done
          echo "::error::Main kept moving; the notes stay in now-notes/ for the next merge or the nightly steward."
          exit 1
      # The full verify runs after the merge and after the fold, never before it (Ruling, Krish, 2026-11-11: quick checks
      # on pull requests, the full verify after merge; merge fast and he tests live), so it checks the healed map. It
      # opens an issue if main goes red.
      - name: Start the full verify on main
        if: always() && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run full-verify.yml -R "$REPO" --ref main || echo "::warning::full-verify was not started; its nightly run picks the merge up."
