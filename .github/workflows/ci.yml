name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the hash-pinned Python the tests need
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Install hash-pinned FFmpeg and FFprobe on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $videoFfmpegBuild = 'ffmpeg-n8.1.2-53-g1005b294ff-win64-gpl-8.1'
          $videoFfmpegSha256 = '577a6a46f9c844657ac849245487a56dfc0507f9bac3f92d40370ebfb64ace72'
          $videoFfmpegArchive = Join-Path $env:RUNNER_TEMP "$videoFfmpegBuild.zip"
          $videoFfmpegRoot = Join-Path $env:RUNNER_TEMP 'mindmake-ffmpeg'
          gh release download toolchain-ffmpeg-n8.1.2-53-g1005b294ff --repo $env:GITHUB_REPOSITORY --pattern "$videoFfmpegBuild.zip" --dir $env:RUNNER_TEMP
          $videoFfmpegActualSha256 = (Get-FileHash -LiteralPath $videoFfmpegArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($videoFfmpegActualSha256 -ne $videoFfmpegSha256) { throw 'Downloaded FFmpeg archive failed its pinned SHA-256 check.' }
          Expand-Archive -LiteralPath $videoFfmpegArchive -DestinationPath $videoFfmpegRoot
          $videoFfmpegBin = Join-Path $videoFfmpegRoot "$videoFfmpegBuild\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $videoFfmpegBin 'ffmpeg.exe'))) { throw 'Pinned FFmpeg binary is missing after extraction.' }
          if (-not (Test-Path -LiteralPath (Join-Path $videoFfmpegBin 'ffprobe.exe'))) { throw 'Pinned FFprobe binary is missing after extraction.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $videoFfmpegBin
      - name: Install hash-pinned FFmpeg and FFprobe on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          video_ffmpeg_build='ffmpeg-n8.1.2-53-g1005b294ff-linux64-gpl-8.1'
          video_ffmpeg_sha256='e4a088c9b16d4b729396805e589394cef45a6d1e5427f8ca32ded8a86694d5b8'
          video_ffmpeg_archive="$RUNNER_TEMP/$video_ffmpeg_build.tar.xz"
          gh release download toolchain-ffmpeg-n8.1.2-53-g1005b294ff --repo "$GITHUB_REPOSITORY" --pattern "$video_ffmpeg_build.tar.xz" --dir "$RUNNER_TEMP"
          echo "$video_ffmpeg_sha256  $video_ffmpeg_archive" | sha256sum --check --strict
          tar -xJf "$video_ffmpeg_archive" -C "$RUNNER_TEMP"
          video_ffmpeg_bin="$RUNNER_TEMP/$video_ffmpeg_build/bin"
          test -x "$video_ffmpeg_bin/ffmpeg"
          test -x "$video_ffmpeg_bin/ffprobe"
          echo "$video_ffmpeg_bin" >> "$GITHUB_PATH"
      - name: Verify media toolchain
        run: |
          ffmpeg -version
          ffprobe -version
      - run: npm ci
      - name: Smoke-test the Windows runner source install
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/verify-runner-source.ps1
      - run: npm run verify

  browser-buttons:
    # Every Download, Copy picture and Copy button on a built publish board
    # and publish page, clicked in Chromium with fetch() blocked the way
    # claude.ai's page rules block it (Krish, 2026-10-14: "the download
    # buttons for the images STILL do not work!!!!").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the hash-pinned Python the tests need
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Install Playwright and its Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Click every button on the board and a publish page
        run: python scripts/post-pack/buttons_in_browser.py
      - name: The board keeps its fixed layout and fits a phone (390px, 44px targets)
        run: python scripts/check_board_layout.py --browser

  board-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - run: npm ci
      - name: Install isolated SQL and browser test runtimes
        run: |
          npm install --no-save --package-lock=false @electric-sql/pglite@0.3.14 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify artifact conversion, migration and interactive web parity
        run: |
          python tests/board_web_test.py
          node tests/board-db.mjs "$PWD/node_modules/@electric-sql/pglite/dist/index.js"
          python tests/board_fixture.py "$RUNNER_TEMP/board-fixture.html"
          node --import tsx tests/integration/board-runtime.ts "$PWD/node_modules/@electric-sql/pglite/dist/index.js" "$PWD/node_modules/playwright/index.mjs" "$RUNNER_TEMP/board-fixture.html" "$RUNNER_TEMP/board-screenshots"

  control-plane-sql:
    # The Video Studio control plane's projection CAS, ancestry and race
    # invariants, replayed on a clean Postgres 17 from the migration copies in
    # supabase/migrations and the fixtures in tests/fixtures/control-plane.
    # Lifted from Control Center's CI with the routes in the 2026-09 unification.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Video Studio projection CAS and ancestry
        env:
          VIDEO_STUDIO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql_in() { docker exec -i "$VIDEO_STUDIO_POSTGRES_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 < "$1"; }
          psql_in tests/fixtures/control-plane/projection-state-postgres-roles.sql
          psql_in supabase/migrations/20260904084240_video_studio_control_plane.sql
          psql_in supabase/migrations/20260905001000_video_studio_least_privilege.sql
          psql_in supabase/migrations/20260905100000_video_studio_heartbeat_lease.sql
          psql_in tests/fixtures/control-plane/projection-state-pre-migration.sql
          psql_in supabase/migrations/20260905110000_video_studio_expected_platform_state.sql
          psql_in supabase/migrations/20260926090000_video_studio_series_live_subchannels.sql
          psql_in tests/fixtures/control-plane/series-live-subchannels.sql
          # The runner-role fence goes in before the existing regression, which
          # then proves nothing changes while the roles are unseeded.
          psql_in supabase/migrations/20260928120000_video_studio_runner_roles.sql
          psql_in tests/fixtures/control-plane/projection-state-regression.sql
          psql_in tests/fixtures/control-plane/runner-roles-regression.sql
          psql_in tests/fixtures/control-plane/projection-state-concurrency-setup.sql

          wait_for_advisory_locks() {
            required="$1"
            for _ in $(seq 1 100); do
              held="$(docker exec "$VIDEO_STUDIO_POSTGRES_CONTAINER" psql --username postgres --dbname postgres --tuples-only --no-align --command "select count(*) from pg_catalog.pg_locks where locktype = 'advisory' and granted")"
              if [ "$held" -ge "$required" ]; then return 0; fi
              sleep 0.1
            done
            return 1
          }

          run_projection_race() {
            first="$1"
            second="$2"
            required_locks="$3"
            log_file="$(basename "$first").log"
            docker exec -i "$VIDEO_STUDIO_POSTGRES_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 < "$first" > "$log_file" 2>&1 &
            first_pid=$!
            if ! wait_for_advisory_locks "$required_locks"; then
              cat "$log_file"
              wait "$first_pid" || true
              echo "Timed out waiting for the first PostgreSQL session to hold its advisory fence" >&2
              return 1
            fi
            docker exec -i "$VIDEO_STUDIO_POSTGRES_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 < "$second"
            wait "$first_pid"
            cat "$log_file"
          }

          run_projection_race \
            tests/fixtures/control-plane/projection-state-concurrent-idempotency-first.sql \
            tests/fixtures/control-plane/projection-state-concurrent-idempotency-second.sql 2
          run_projection_race \
            tests/fixtures/control-plane/projection-state-concurrent-new-job-first.sql \
            tests/fixtures/control-plane/projection-state-concurrent-new-job-second.sql 2
          run_projection_race \
            tests/fixtures/control-plane/projection-state-concurrent-command-first.sql \
            tests/fixtures/control-plane/projection-state-concurrent-command-second.sql 1
          psql_in tests/fixtures/control-plane/projection-state-concurrency-verify.sql
          psql_in supabase/migrations/20260907091923_studio_session_learning_spine.sql
          psql_in tests/fixtures/control-plane/studio-session-learning-regression.sql
          # A stale copy of a piece's meta never puts back an older making record.
          psql_in tests/fixtures/control-plane/keep-newer-making-setup.sql
          psql_in supabase/migrations/20261012120000_keep_newer_making.sql
          psql_in tests/fixtures/control-plane/keep-newer-making-regression.sql
          # An item waiting on Krish is ready for his list, or it is held in
          # progress; run twice, because it must be safe to run again.
          psql_in supabase/migrations/20261003130000_work_board.sql
          psql_in supabase/migrations/20261011120000_board_items_follow_pieces.sql
          psql_in supabase/migrations/20261013080000_board_on_you_fields.sql
          psql_in supabase/migrations/20261013081000_board_closed_by.sql
          psql_in tests/fixtures/control-plane/board-on-you-ready-setup.sql
          psql_in supabase/migrations/20261013093000_board_on_you_is_ready.sql
          psql_in supabase/migrations/20261013093000_board_on_you_is_ready.sql
          psql_in tests/fixtures/control-plane/board-on-you-ready-regression.sql
          # Step 4: every item says how it ends, and an item on Krish carries
          # what its check needs; each migration run twice.
          psql_in supabase/migrations/20261022090000_board_close_columns.sql
          psql_in supabase/migrations/20261022090000_board_close_columns.sql
          psql_in tests/fixtures/control-plane/board-close-kinds-setup.sql
          psql_in supabase/migrations/20261022091000_on_you_closes_itself.sql
          psql_in supabase/migrations/20261022091000_on_you_closes_itself.sql
          psql_in tests/fixtures/control-plane/board-close-kinds-regression.sql
          # Step 4, part C: one closer. Every open item says how it ends, and
          # only a check, Krish, or a session on its own work closes one;
          # run twice.
          psql_in tests/fixtures/control-plane/board-one-closer-setup.sql
          psql_in supabase/migrations/20261023090000_one_closer.sql
          psql_in supabase/migrations/20261023090000_one_closer.sql
          psql_in tests/fixtures/control-plane/board-one-closer-regression.sql
          # A podcast or stage worth taking closes when Krish decides it; run twice.
          psql_in supabase/migrations/20261023100000_board_target_decided.sql
          psql_in supabase/migrations/20261023100000_board_target_decided.sql
          psql_in tests/fixtures/control-plane/board-target-decided-regression.sql
          # Step 3, PR 1: honest sources. Before the migration a shift_write
          # insert fails the source foreign key; the migration runs twice; then
          # its read-back must refuse a missing owner foreign key and a source
          # already under another owner, committing nothing either time.
          psql_in tests/fixtures/control-plane/honest-sources-setup.sql
          psql_in tests/fixtures/control-plane/honest-sources-before.sql
          psql_in supabase/migrations/20261021080000_honest_sources.sql
          psql_in supabase/migrations/20261021080000_honest_sources.sql
          psql_in tests/fixtures/control-plane/honest-sources-regression.sql
          for guard in no-fkey wrong-owner; do
            psql_in tests/fixtures/control-plane/honest-sources-setup.sql
            psql_in "tests/fixtures/control-plane/honest-sources-guard-$guard.sql"
            if psql_in supabase/migrations/20261021080000_honest_sources.sql; then
              echo "honest_sources committed with guard case $guard" >&2
              exit 1
            fi
            psql_in tests/fixtures/control-plane/honest-sources-before.sql
          done
          psql_in tests/fixtures/control-plane/honest-sources-setup.sql
          # Step 3, PR 6: manual is his words. On a minimal content_ideas
          # with the live vocabularies, after honest sources, the CHECK runs
          # twice; a new manual row with no said: ref is refused, one with it
          # is kept, the one exempt ref is kept, and a backdated manual row
          # with no ref is refused.
          psql_in tests/fixtures/control-plane/content-ideas-minimal.sql
          psql_in supabase/migrations/20261021080000_honest_sources.sql
          psql_in supabase/migrations/20261021100000_manual_is_his_words.sql
          psql_in supabase/migrations/20261021100000_manual_is_his_words.sql
          psql_in tests/fixtures/control-plane/manual-is-his-words.sql
          # Step 3, PR 8: the CHECK validates over every row the fixture kept,
          # and runs twice.
          psql_in supabase/migrations/20261101120000_manual_is_his_words_validated.sql
          psql_in supabase/migrations/20261101120000_manual_is_his_words_validated.sql
          # Last, because it commits a seed that fences every later claim: an
          # open claim holds the active role row, so a switch must wait for it
          # and then refuse.
          psql_in tests/fixtures/control-plane/runner-roles-race-setup.sql
          run_projection_race \
            tests/fixtures/control-plane/runner-roles-race-claim-first.sql \
            tests/fixtures/control-plane/runner-roles-race-switch-second.sql 1
          psql_in tests/fixtures/control-plane/runner-roles-race-verify.sql

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
