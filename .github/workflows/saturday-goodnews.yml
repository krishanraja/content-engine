name: Saturday good news

# Rulings (Krish, 2026-11-07): "Saturday's good news run should be done later in the week so the good news is fresh",
# and "Happy to break the "no Claude schedules" rule for Saturday's good news. We might as well just keep that on an
# automatic schedule."
#
# So this is the one exception to zero Claude schedules beside the Sunday ideas run, built the same way: GitHub is the
# scheduler and Claude Code runs inside this job on his subscription (CLAUDE_CODE_OAUTH_TOKEN, never an API key),
# writing to the board only through the engine API (ENGINE_OPERATOR_TOKEN). It follows "The Saturday good news" in
# .agents/skills/plan-week/references/offdays.md: five real AI stories from the seven days up to Thursday, each checked
# on its own page, each with its own picture or clip, written onto the week's good-news option and published on that
# week's live board, so his Approve, Improve, Reject and Next week presses work as on any off-day option.
#
# When: Thursday, twice (10:41 and 19:23 UTC; 05:41 and 14:23 in New York in winter), because GitHub's cron fires hours
# late; the second firing is only a retry. Both are outside 06:00 to 09:00 Pacific. The guard
# (scripts/saturday_goodnews.py check) makes a firing do nothing once the week's live board shows the stories, and a
# scheduled firing before 12 November do nothing at all (the first is for Saturday 14 November). Run workflow by hand
# any time with a week; "force" finds the stories again even when they are live.
#
# This repository is public: Claude's full output stays out of the log (claude-code-action's default), and nothing
# here prints a link, a story or a source.
#
# The run reads untrusted web pages, so it is fenced by permissions, not by its prompt: Bash only for the named
# engine scripts (no curl, no git push, no shell), writes only under docs/plans/, no read of /proc (where the step's
# secrets live), and the checkout keeps no GitHub credential (persist-credentials: false). Only the keep step, after
# Claude has stopped, pushes, with the token passed for that one command.

on:
  schedule:
    - cron: '41 10 * * 4'
    - cron: '23 19 * * 4'
  workflow_dispatch:
    inputs:
      week:
        description: 'The Monday of the week whose Saturday it is, YYYY-MM-DD (empty: the week whose Saturday comes next)'
        required: false
      force:
        description: 'Find the stories again even if the live board already shows them'
        type: boolean
        default: false

concurrency:
  group: saturday-goodnews
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  goodnews:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Claude Code runs on Krish's subscription, never an API key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN. One setup step for Krish: run 'claude setup-token' on your computer and add what it prints as the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions). This job never uses an API key instead."
            exit 1
          fi
          if [ -z "$ENGINE_OPERATOR_TOKEN" ]; then
            echo "::error::No ENGINE_OPERATOR_TOKEN, so the run cannot read or write the board."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Which week, and are its stories due and not yet live?
        id: guard
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
          WEEK: ${{ inputs.week }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          # A typed week is normalised to its YYYY-MM-DD Monday (or refused) before it names a folder or a branch.
          set -- check --event "$EVENT"
          [ -n "$WEEK" ] && set -- "$@" --week "$WEEK"
          [ "$FORCE" = "true" ] && set -- "$@" --force
          python3 scripts/saturday_goodnews.py "$@" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'true'
        with:
          node-version: '24'
          cache: npm

      - name: Install the tools the skill runs
        if: steps.guard.outputs.go == 'true'
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-ci.txt
          npm ci
          # The Claude Code installer needs its launcher directory to exist (the docs steward's fix, 2026-09-08).
          mkdir -p "$HOME/.local/bin"

      - name: This Saturday's good news, in Claude Code on his subscription
        if: steps.guard.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
          GN_MONDAY: ${{ steps.guard.outputs.monday }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash(python3 scripts/check_failures.py:*),Bash(python3 scripts/floor.py:*),Bash(python3 scripts/engine.py:*),Bash(python3 scripts/post-pack/week_board.py:*),Bash(python3 scripts/post-pack/board_web.py:*),Bash(python3 scripts/post-pack/board_feed.py:*),Bash(python3 scripts/post-pack/copy_lint.py:*),Bash(node vendor/makeyourmindup/kill-list/kill-list.mjs:*),Bash(git status:*),Bash(git diff:*),Read,Glob,Grep,Edit(docs/plans/**),Write(docs/plans/**),WebSearch,WebFetch,Task,TodoWrite"
            --disallowedTools "Read(//proc/**)"
          prompt: |
            The Saturday good news for the week starting Monday ${{ steps.guard.outputs.monday }}, fired by GitHub
            Actions on Thursday (.github/workflows/saturday-goodnews.yml). No one reads this run's chat.

            Run python3 scripts/check_failures.py and python3 scripts/floor.py first. Then follow the section
            "The Saturday good news" in .agents/skills/plan-week/references/offdays.md exactly: find the five stories
            (real AI news from the seven days up to the option's stories_due that helped real people, each with a real
            photo or clip of the thing itself the post can embed), check each against its primary source, write them
            into that week's docs/plans/<Monday>-week/ideas.json, run board_feed.py gather and cover, rebuild that
            week's board from its live build keeping every made day, and publish it with board_web.py publish-web
            --apply. Read the live page back. Research with the built-in web search and web fetch.

            Change nothing but that option's stories; never patch the built page; never publish or post anything
            public; no spend beyond this run. Do not commit or push: the workflow keeps that folder on a branch. If
            the board refuses a build, fix the stories and build again; if it still refuses, stop and say why.

      - name: The stories are live
        if: steps.guard.outputs.go == 'true'
        env:
          ENGINE_OPERATOR_TOKEN: ${{ secrets.ENGINE_OPERATOR_TOKEN }}
          MONDAY: ${{ steps.guard.outputs.monday }}
        run: |
          live=$(python3 -c "import sys; sys.path[:0] = ['scripts', 'scripts/post-pack']; import saturday_goodnews as g; print(g.live_has_stories('$MONDAY'))")
          if [ "$live" != "True" ]; then
            echo "::error::The run ended but the week of $MONDAY's live board does not show the good-news stories."
            exit 1
          fi

      - name: Keep the week's stories on a branch
        if: always() && steps.guard.outputs.go == 'true'
        env:
          MONDAY: ${{ steps.guard.outputs.monday }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          folder="docs/plans/$MONDAY-week"
          [ -d "$folder" ] || { echo "::warning::No $folder was written."; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "saturday-goodnews/$MONDAY-$RUN_ID"
          git add -- "$folder"
          git diff --cached --quiet && { echo "Nothing new in $folder."; exit 0; }
          git commit -q -m "Saturday good news for the week of $MONDAY (run $RUN_ID)" \
            -m "Written by the Thursday good-news run in GitHub Actions on Krish's subscription; the next session merges it." \
            -m 'Ruling (Krish, 2026-11-07): "Happy to break the "no Claude schedules" rule for Saturday'"'"'s good news. We might as well just keep that on an automatic schedule."'
          # The checkout kept no credential, so the token is passed to this one push only.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/saturday-goodnews/$MONDAY-$RUN_ID"
          echo "::notice::The week's stories are on the branch saturday-goodnews/$MONDAY-$RUN_ID."
