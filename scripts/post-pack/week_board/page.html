<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
{{BASE_CSS}}
{{WEEK_CSS}}
</style>
<div class="wk-top"><div class="wk-kick"><div class="kick">{{KICKER}}</div><a class="wk-std" href="/board/standards">Production standards</a></div><h1 class="wk-title">{{TITLE}}</h1></div>
<header class="wk{{WK_CLASS}}"><div class="wk-in" role="tablist" aria-label="{{TABLIST_LABEL}}">{{TABS}}</div>
<div class="wk-week"><div class="meter" role="progressbar" aria-label="This week" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-weekbar><span data-meter="week"></span></div><span class="wk-txt" data-weektxt>This week: loading ticks</span>{{ASIDE}}</div></header>
<div id="stale-bar" class="stale-bar" role="status" hidden>A newer version of this board is live. <a href="">Reload</a></div>
<main id="week"{{MAIN_ATTRS}}>{{PANELS}}</main>
<div id="toast" role="status"></div>
<script>
{{SCRIPT}}
</script>
