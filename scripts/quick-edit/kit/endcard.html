<!doctype html>
<!--
  kit.py: the house end card, joined after Krish's last word. The same card
  for every piece and subchannel: the masthead, what the publication is, the
  three days and how to subscribe. Body class "tall" is 1080 x 1920, "wide"
  1920 x 1080. kit.py turns the picture into a 4 second clip with a silent
  48 kHz stereo track. Placeholders start with a dollar sign; kit.py fills every one.
-->
<html lang="en-GB"><head><meta charset="utf-8"><style>
$fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: ${W}px; height: ${H}px; overflow: hidden; }
body { background: $ink; color: $cream; font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
.ec { position: absolute; inset: 0; }
.mh { width: 100%; height: auto; display: block; }
.tl { font-weight: 600; text-wrap: balance; }
.days { display: flex; flex-direction: column; }
.d { display: flex; flex-direction: column; gap: 4px; }
.dn { font-family: 'IBM Plex Mono', monospace; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.cn { font-family: 'IBM Plex Mono', monospace; font-weight: 700; line-height: 1.1; }
.btn { white-space: nowrap; background: $mint; color: $ink; font-weight: 800; border-radius: 999px; line-height: 1; }
.url { font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: $cream; }

body.tall .ec { padding: 0 90px; display: flex; flex-direction: column; justify-content: center; gap: 70px; }
body.tall .tl { font-size: 58px; line-height: 1.18; }
body.tall .days { gap: 22px; }
body.tall .dn { font-size: 32px; }
body.tall .cn { font-size: 60px; }
body.tall .cta { display: flex; flex-direction: column; align-items: flex-start; gap: 26px; }
body.tall .btn { font-size: 60px; padding: 22px 48px; }
body.tall .url { font-size: 44px; }

body.wide .ec { padding: 0 130px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 110px; row-gap: 60px; align-content: center; }
body.wide .mh { grid-column: 1 / 3; width: 1000px; }
body.wide .tl { font-size: 52px; line-height: 1.2; }
body.wide .days { grid-row: 2 / 4; grid-column: 2; gap: 26px; }
body.wide .dn { font-size: 28px; }
body.wide .cn { font-size: 56px; }
body.wide .cta { display: flex; align-items: center; gap: 40px; }
body.wide .btn { font-size: 46px; padding: 20px 40px; }
body.wide .url { font-size: 36px; }
</style></head><body class="$shape">
<div class="ec">
  <img class="mh" src="$masthead" alt="makeyourmindup">
  <div class="tl">$tagline</div>
  <div class="days">$days</div>
  <div class="cta"><span class="btn">$cta</span><span class="url">$site</span></div>
</div>
</body></html>
