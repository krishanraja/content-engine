<!doctype html>
<!--
  kit.py: the house end card, joined after his last word. One close for every
  piece (rejection floor never 7). Krish picked this direction, "C: the
  statement", on 10 Nov 2026, with the tagline "Built to help you decide."
  The tagline is the picture: Anton, each line rising out of its own mask,
  the last word in the series colour. Above it the masthead on ink (brand
  book: on ink, level, untouched); below it the three days, each in its
  series colour, then "Subscribe free" and the address, whose underline
  draws on last. Things arrive fast and settle softly, in reading order, and
  everything has settled by 2.75 s, so the card then holds still to the end of
  its 6 s clip (the approved standard: a calm close of about 6 s with the
  final card held about 2 s). The plan is docs/production/CLOSING.md.
  Body class "tall" is 1080 x 1920 and is a compact end beat of 2 s: every
  word and the masthead sit inside the tall core box, x 120 to 820, y 330 to
  1180, and everything settles by 1.3 s (config/brand-palette.json
  statement_beat; Ruling, Krish, 2026-11-12, held to
  docs/production/SOCIAL-BEST-PRACTICES-2026.md sections 3.5 and 5). "wide"
  is 1920 x 1080 on a 160 x 120 margin, 6 s, held for YouTube's end screen.
  kit.py films the motion at 30 fps (Drawer.film) and draws the still at the
  settled last frame. Placeholders start with a dollar sign; kit.py fills every one.
-->
<html lang="en-GB"><head><meta charset="utf-8"><style>
$fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: ${W}px; height: ${H}px; overflow: hidden; }
body { background: $ink; color: $cream; font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
:root { --arrive: cubic-bezier(.16, 1, .3, 1); --draw: cubic-bezier(.65, 0, .35, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(34px); } to { opacity: 1; transform: none; } }
@keyframes up { from { transform: translateY(105%); } to { transform: none; } }
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.a { animation: rise .8s var(--arrive) both; }
.ec { position: absolute; display: flex; flex-direction: column; justify-content: space-between; }
.mh { display: block; height: auto; }
.st { font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; line-height: .9; letter-spacing: .005em;
      overflow-wrap: normal; word-break: keep-all; }
.st .ln { display: block; overflow: hidden; white-space: nowrap; }
.st .ln > span { display: block; animation: up .75s var(--arrive) both; }
.st .ln:last-child > span { color: $accent; }
.days { font-family: 'IBM Plex Mono', monospace; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.days b { color: $cream; opacity: .35; font-weight: 400; }
.kick { font-family: 'IBM Plex Mono', monospace; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: $mint; }
.url { position: relative; display: inline-block; font-family: 'IBM Plex Mono', monospace; font-weight: 700; color: $cream;
       padding-bottom: .32em; white-space: nowrap; }
.url i { position: absolute; left: 0; right: 0; bottom: 0; height: .12em; background: $accent; transform-origin: left;
         animation: draw .7s var(--draw) both; }

body.tall .ec { left: 120px; width: 700px; top: 330px; height: 850px; }
body.tall .mh { width: 420px; }
body.tall .st { font-size: 176px; }
body.tall .bot { display: flex; flex-direction: column; gap: 30px; }
body.tall .days { font-size: 24px; }
body.tall .kick { font-size: 24px; margin-bottom: 10px; }
body.tall .url { font-size: 46px; }
/* The tall beat is 2 s: the same arrivals, quicker, settled by 1.3 s. */
body.tall .a, body.tall .st .ln > span, body.tall .url i { animation-duration: .5s !important; }
body.tall .mh { animation-delay: 0s !important; }
body.tall .st .ln:nth-child(1) > span { animation-delay: .1s !important; }
body.tall .st .ln:nth-child(2) > span { animation-delay: .18s !important; }
body.tall .st .ln:nth-child(3) > span { animation-delay: .26s !important; }
body.tall .days { animation-delay: .5s !important; }
body.tall .kick { animation-delay: .6s !important; }
body.tall .url { animation-delay: .66s !important; }
body.tall .url i { animation-delay: .8s !important; }

body.wide .ec { left: 160px; right: 160px; top: 120px; bottom: 120px; }
body.wide .mh { width: 520px; }
body.wide .st { font-size: 190px; }
body.wide .bot { display: flex; align-items: flex-end; justify-content: space-between; }
body.wide .days { font-size: 24px; margin-bottom: 24px; }
body.wide .kick { font-size: 22px; margin-bottom: 10px; }
body.wide .url { font-size: 44px; }
</style></head><body class="$shape">
<div class="ec">
  <img class="mh a" style="animation-delay: 1.3s" src="$masthead" alt="makeyourmindup">
  <div class="st" data-fit="$lines">$statement</div>
  <div class="bot">
    $order_days
    <div><div class="kick a" style="animation-delay: 1.6s">$cta</div><div class="url a" style="animation-delay: 1.7s">$site<i style="animation-delay: 2.05s"></i></div></div>
    $order_days_after
  </div>
</div>
</body></html>
