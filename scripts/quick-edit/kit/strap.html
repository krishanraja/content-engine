<!doctype html>
<!--
  kit.py: the name strap for the tall cut, a transparent 1080 x 1920 frame
  laid over the picture for a few seconds early on: Krish's name on ink and
  the subchannel on its colour, low on the frame, clear of the captions at
  the top and of the panel. Placeholders start with a dollar sign; kit.py fills every one.
-->
<html lang="en-GB"><head><meta charset="utf-8"><style>
$fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
body { font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
.strap { position: absolute; left: 60px; top: 1500px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.name { background: $ink; color: $cream; font-weight: 800; font-size: 58px; line-height: 1; padding: 16px 30px 18px; border-radius: 999px;
        white-space: nowrap; }
.ch { background: $accent; color: $ink; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 38px; line-height: 1;
      padding: 12px 26px; border-radius: 999px; white-space: nowrap; }
</style></head><body>
<div class="strap"><div class="name">$author</div><div class="ch">$channel</div></div>
</body></html>
