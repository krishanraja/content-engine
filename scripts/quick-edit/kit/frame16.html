<!doctype html>
<!--
  kit.py: the wide cut's background, 1920 x 1080, in the subchannel's look.
  The speaker's column, x 657 to 1263, is left plain: the recording covers
  it. Two columns share one grid: a 96 px margin top and bottom, so the
  subchannel pill and the wordmark sit on the same top line and the
  subject's last line and the address sit on the same bottom line.
  Left, on the subchannel colour: the pill and the piece's subject. Right,
  full height on ink (the brand book keeps the logo on ink): the wordmark,
  the day and the address.
  The subject breaks only between words, never inside one: kit.py's fit
  step shrinks it until its longest word fits the column and it holds
  four lines (Krish, 10 Nov 2026, on "COUNTIN / G RAT / TAILS").
  Placeholders start with a dollar sign; kit.py fills every one.
-->
<html lang="en-GB"><head><meta charset="utf-8"><style>
$fonts
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { background: $accent; color: $ink; font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased; }
.fl { position: absolute; left: 96px; width: 497px; top: 96px; bottom: 96px; display: flex; flex-direction: column; }
.pill { align-self: flex-start; display: inline-block; background: $ink; color: $cream; font-family: 'IBM Plex Mono', monospace;
        font-weight: 700; font-size: 28px; letter-spacing: .08em; padding: .36em .62em .3em; border-radius: .26em; line-height: 1;
        text-transform: uppercase; white-space: nowrap; }
.sub { flex: 1; display: flex; align-items: center; }
/* Words never split and never hyphenate: the fit step shrinks the size instead. */
h1 { width: 100%; font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 150px; line-height: .94;
     letter-spacing: .005em; overflow-wrap: normal; word-break: keep-all; hyphens: none; text-wrap: balance; }
.fr { position: absolute; left: 1263px; right: 0; top: 0; bottom: 0; background: $ink; padding: 96px 96px 96px 80px;
      display: flex; flex-direction: column; justify-content: space-between; }
.fr img { width: 100%; height: auto; display: block; }
.end { display: flex; flex-direction: column; gap: 18px; }
.day { color: $accent; font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 88px; line-height: .9; }
.url { color: $cream; font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 32px; }
</style></head><body>
<div class="fl">
  <span class="pill">$channel</span>
  <div class="sub"><h1 data-fit="4">$subject</h1></div>
</div>
<div class="fr">
  <img src="$wordmark" alt="makeyourmindup">
  <div class="end"><div class="day">$days</div><div class="url">$site</div></div>
</div>
</body></html>
