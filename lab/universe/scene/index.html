<!doctype html>
<!-- The work, as one building (version 2): lab/universe/PLAN.md. Served from the repository root; rendered by
     lab/universe/render.cjs, which calls window.setTime(t) once per frame. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(/assets/fonts/makeyourmindup/Anton-Regular.ttf)}
@font-face{font-family:Archivo;src:url(/assets/fonts/makeyourmindup/Archivo-Variable.ttf);font-weight:100 900}
@font-face{font-family:FrauncesI;src:url(/assets/fonts/makeyourmindup/Fraunces-Italic-Variable.ttf);font-weight:100 900}
@font-face{font-family:Plex;src:url(/assets/fonts/makeyourmindup/IBMPlexMono-Medium.ttf)}
:root{--ink:#0C1512;--cream:#F4EFE4;--mint:#7EF0C0;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:Archivo,sans-serif;background:#E9E2D2;position:relative}
#sky{position:absolute;inset:0;background:linear-gradient(#EFE8D8,#E2D9C5)}
#night{position:absolute;inset:0;background:radial-gradient(1100px 800px at 40% 20%,#16221D,#0A110E 75%);opacity:var(--n)}
#stars{position:absolute;inset:0;opacity:var(--n)} .star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--cream)}
#sun{position:absolute;right:64px;top:40px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFE27A,#FF8A4D);box-shadow:0 0 60px #FFB86B88;transform:translateY(calc(var(--n) * 150px));opacity:clamp(0, calc(1 - var(--n) * 2.2), 1)}
#moon{position:absolute;right:70px;top:44px;width:80px;height:80px;border-radius:50%;background:var(--cream);box-shadow:inset -16px -7px 0 #CFC9BA,0 0 46px #F4EFE455;opacity:clamp(0, calc(var(--n) * 2.2 - 1.2), 1)}
canvas{position:absolute;inset:0}
.title{position:absolute;left:52px;top:38px}
.title .big{font-family:Anton;font-size:78px;line-height:1;text-transform:uppercase;letter-spacing:.5px}
.title .pill{display:inline-block;margin-top:8px;font-family:FrauncesI;font-weight:500;font-size:58px;line-height:1.05;padding:0 20px 10px;border-radius:12px}
#tday .big{color:var(--ink)} #tday .pill{background:var(--ink);color:var(--mint)}
#tnight .big{color:var(--cream)} #tnight .pill{background:var(--cream);color:var(--ink)}
#labels{position:absolute;inset:0;pointer-events:none}
.sign{position:absolute;transform:translate(0,-100%);font-family:Plex;font-size:14px;letter-spacing:.8px;text-transform:uppercase;background:var(--ink);color:var(--cream);padding:4px 9px 3px;border-radius:5px;white-space:nowrap}
.sign b{color:var(--mint);font-weight:500;margin-right:7px}
.sign.brain{background:var(--mint);color:var(--ink)} .sign.brain b{color:var(--ink)}
.tag{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:11px;line-height:1.1;background:var(--cream);border:1.5px solid var(--ink);border-radius:5px;padding:2px 5px 1px;white-space:nowrap;color:var(--ink)}
.tag.chief{background:var(--mint);font-size:13px;border-width:2px}
.room{position:absolute;transform:translate(-50%,0);font-family:Plex;font-size:10.5px;letter-spacing:.5px;background:#2A3A33;color:var(--cream);padding:2px 6px 1px;border-radius:4px;white-space:nowrap}
.room.brain{background:var(--mint);color:var(--ink)}
#panel{position:absolute;left:740px;top:240px;width:312px;display:flex;flex-direction:column;gap:7px}
.card{background:var(--cream);border:2.5px solid var(--ink);border-radius:10px;padding:7px 11px 7px}
.card h3{font-weight:900;font-size:18px;line-height:1.05;display:flex;align-items:center;gap:8px}
.card h3 i{margin-left:auto;display:flex;gap:3px}
.card h3 i img{width:16px;height:16px;border-radius:4px;object-fit:cover;border:1px solid #0C151233}
.card h3 span{font-family:Plex;font-weight:500;font-size:12px;background:var(--ink);color:var(--mint);padding:3px 6px 2px;border-radius:4px}
.card ul{list-style:none;margin-top:4px}
.card li{font-size:12.5px;line-height:1.3;padding-left:12px;position:relative;color:#1E2723}
.card li:before{content:"";position:absolute;left:1px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.card.brain li:before{background:var(--ink)}
.card .out{margin-top:5px;border-top:1.5px solid #CFC7B4;padding-top:4px;font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;gap:6px}
.card .out em{font-style:normal;font-family:Plex;font-weight:500;font-size:9.5px;letter-spacing:.8px;color:#5A615D;text-transform:uppercase;padding-top:2px}
.card.brain{background:var(--mint)} .card.brain h3 span{background:var(--ink);color:var(--mint)}
</style></head><body>
<div id="sky"></div><div id="night"></div><div id="stars"></div><div id="sun"></div><div id="moon"></div>
<div class="title" id="tday"><div class="big">Inside my AI-native firm</div><div class="pill">floor by floor</div></div>
<div class="title" id="tnight"><div class="big">And it keeps working</div><div class="pill">after I log off</div></div>
<div id="labels"></div>
<div id="panel"></div>
<script type="module" src="./scene.js"></script>
</body></html>
